<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | مركز الإدارة</title><link rel="stylesheet" href="assets/style.css?v=2026.09.03"><link rel="stylesheet" href="assets/admin3.css?v=2026.09.03"></head><body><main class="shell"><section id="auth" class="card" style="max-width:520px;margin:45px auto"><span class="badge">لوحة محمية</span><h1>مركز الإدارة</h1><p class="muted">إدارة الرحلات والكباتن وطلبات التوثيق.</p><form id="login" class="form"><div class="field"><label>رقم الهاتف</label><input id="phone" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div><button class="btn">دخول</button></form></section><section id="app" class="hidden" style="padding:18px 0 45px"><div class="card"><span class="badge">● مركز التشغيل</span><h1>إدارة وصلها</h1><p class="muted">نظرة سريعة على التشغيل والكباتن والرحلات.</p><button id="refresh" class="btn">↻ تحديث</button></div><div id="stats" class="grid" style="margin:18px 0"></div><div class="grid"><div class="col-8 card"><h2>طلبات الكباتن</h2><div class="field"><label>فلترة التوثيق</label><select id="docFilter"><option value="">الكل</option><option value="pending">بانتظار المراجعة</option><option value="approved">موثق</option><option value="rejected">مرفوض</option><option value="not_submitted">لم يقدم</option></select></div><div id="captains" class="table-wrap"></div></div><div class="col-4 card"><h2>الرحلات</h2><div class="field"><label>الحالة</label><select id="rideStatus"><option value="">الكل</option><option value="searching">بحث</option><option value="captain_assigned">تم التعيين</option><option value="trip_started">قيد الرحلة</option><option value="trip_completed">مكتملة</option><option value="cancelled">ملغاة</option></select></div><div id="rides" class="table-wrap"></div></div></div></section></main><script src="assets/app.js?v=2026.09.03"></script><script>(async()=>{const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dlabel={pending:'قيد المراجعة',active:'مفعل',suspended:'موقوف',not_submitted:'لم يقدم',approved:'موثق',rejected:'مرفوض',online:'متاح',offline:'غير متصل',busy:'في رحلة'};const label=v=>dlabel[v]||statusLabel(v);function show(){const ok=!!token;$('auth').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok);if(ok)load()}async function load(){try{const cq=new URLSearchParams({limit:'100'});if($('docFilter').value)cq.set('documentsStatus',$('docFilter').value);const rq=new URLSearchParams({limit:'12'});if($('rideStatus').value)rq.set('status',$('rideStatus').value);const[s,c,r]=await Promise.all([api('/admin/stats'),api('/admin/captains?'+cq),api('/admin/rides?'+rq)]);renderStats(s.data||{});renderCaptains(c.data?.items||[]);renderRides(r.data?.items||[])}catch(e){toast(e.message)}}function renderStats(x){const a=[['المستخدمون',x.users],['الكباتن',x.captains],['طلبات معلقة',x.pendingCaptains],['متاحون',x.onlineCaptains],['في رحلات',x.busyCaptains],['رحلات نشطة',x.activeRides],['مكتملة',x.completedRides],['ملغاة',x.cancelledRides]];$('stats').innerHTML=a.map(i=>`<div class="col-3 stat"><span class="muted">${i[0]}</span><b>${i[1]??0}</b></div>`).join('')}function renderCaptains(a){if(!a.length){$('captains').innerHTML='<div class="empty">لا توجد طلبات.</div>';return}$('captains').innerHTML='<table class="table"><thead><tr><th>الكابتن</th><th>المركبة</th><th>الحساب</th><th>الوثائق</th><th>إجراء</th></tr></thead><tbody>'+a.map(c=>{const canActivate=c.documentsStatus==='approved';return `<tr><td><b>${esc(c.user?.name||'—')}</b><br>${esc(c.user?.phone||'')}</td><td>${esc([c.vehicle?.type,c.vehicle?.make,c.vehicle?.model,c.vehicle?.plateNumber].filter(Boolean).join(' • ')||'غير مكتملة')}</td><td>${esc(label(c.status))}</td><td>${esc(label(c.documentsStatus))}</td><td><div class="actions"><button class="btn" data-status="${esc(c._id)}" data-value="active" ${canActivate?'':'disabled'} title="${canActivate?'':'يجب توثيق الوثائق أولاً'}">تفعيل</button><button class="btn secondary" data-doc="${esc(c._id)}" data-value="approved">توثيق</button><button class="btn light" data-doc="${esc(c._id)}" data-value="rejected">رفض</button></div></td></tr>`}).join('')+'</tbody></table>';document.querySelectorAll('[data-status]:not(:disabled)').forEach(b=>b.onclick=async()=>{try{await api('/admin/captains/'+b.dataset.status+'/status',{method:'PATCH',body:JSON.stringify({status:b.dataset.value})});toast('تم تفعيل الكابتن');load()}catch(e){toast(e.message)}});document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=async()=>{try{await api('/admin/captains/'+b.dataset.doc+'/documents',{method:'PATCH',body:JSON.stringify({status:b.dataset.value})});toast(b.dataset.value==='approved'?'تم توثيق الكابتن':'تم رفض الوثائق');load()}catch(e){toast(e.message)}})}function renderRides(a){$('rides').innerHTML=a.length?'<table class="table"><tbody>'+a.map(r=>`<tr><td>#${esc(String(r._id||'').slice(-6))}</td><td>${esc(label(r.status))}</td><td>${esc(money(r.estimatedFare??r.fare))}</td></tr>`).join('')+'</tbody></table>':'<div class="empty">لا توجد رحلات.</div>'}$('login').onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value.trim(),password:$('password').value})});if((d.data?.user||d.user)?.role!=='admin')throw Error('هذا الحساب ليس حساب إدارة');saveAuth(d.data||d);show()}catch(e){toast(e.message)}};$('refresh').onclick=load;$('docFilter').onchange=load;$('rideStatus').onchange=load;show()})()</script></body></html>
