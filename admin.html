<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f9f6e"><title>وصلها | لوحة الإدارة</title><link rel="stylesheet" href="assets/style.css?v=2026.09.05"></head><body><main class="shell" style="padding:16px 0 50px"><section id="auth" class="card" style="max-width:520px;margin:35px auto"><span class="badge">🔐 لوحة محمية</span><h1>مركز إدارة وصلها</h1><p class="muted">إدارة المستخدمين والكباتن والرحلات من مكان واحد.</p><form id="login" class="form"><div class="field"><label>رقم الهاتف</label><input id="phone" autocomplete="tel" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn">دخول الإدارة</button></form></section><section id="app" class="hidden"><header class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><span class="badge">● مركز التشغيل</span><h1 style="margin:8px 0 4px">إدارة وصلها</h1><p class="muted" style="margin:0">مراقبة التشغيل واتخاذ الإجراءات بسرعة.</p></div><button id="refresh" class="btn">↻ تحديث الكل</button></div></header><div id="stats" class="grid" style="margin-bottom:16px"></div><section class="card" style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">المستخدمون</h2><p class="muted" style="margin:5px 0">تفعيل أو إيقاف حسابات العملاء والإدارة.</p></div><button id="userRefresh" class="btn secondary">تحديث</button></div><div class="grid" style="margin-top:12px"><div class="field"><label>الدور</label><select id="userRole"><option value="">الكل</option><option value="customer">عملاء</option><option value="captain">كباتن</option><option value="admin">إدارة</option></select></div><div class="field"><label>الحالة</label><select id="userActive"><option value="">الكل</option><option value="true">مفعل</option><option value="false">موقوف</option></select></div><div class="field"><label>بحث</label><input id="userSearch" placeholder="الاسم أو الهاتف"></div></div><div id="users" class="table-wrap" style="margin-top:10px"></div></section><div class="grid"><section class="col-8 card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">الكباتن</h2><p class="muted" style="margin:5px 0">التوثيق والحالة والتوفر.</p></div></div><div class="grid" style="margin-top:12px"><div class="field"><label>الوثائق</label><select id="docFilter"><option value="">الكل</option><option value="pending">بانتظار المراجعة</option><option value="approved">موثق</option><option value="rejected">مرفوض</option><option value="not_submitted">لم يقدم</option></select></div><div class="field"><label>الحالة</label><select id="captainStatus"><option value="">الكل</option><option value="pending">قيد التسجيل</option><option value="active">مفعل</option><option value="suspended">موقوف</option></select></div><div class="field"><label>التوفر</label><select id="availability"><option value="">الكل</option><option value="online">متاح</option><option value="busy">في رحلة</option><option value="offline">غير متصل</option></select></div></div><div id="captains" class="table-wrap" style="margin-top:10px"></div></section><section class="col-4 card"><h2>الرحلات</h2><div class="field"><label>الحالة</label><select id="rideStatus"><option value="">الكل</option><option value="requested">طلب جديد</option><option value="searching">بحث عن كابتن</option><option value="captain_assigned">تم التعيين</option><option value="captain_arriving">الكابتن بالطريق</option><option value="captain_arrived">وصل الكابتن</option><option value="trip_started">قيد الرحلة</option><option value="trip_completed">مكتملة</option><option value="cancelled">ملغاة</option></select></div><div class="field"><label>الخدمة</label><select id="rideService"><option value="">الكل</option><option value="taxi">سيارة</option><option value="motorcycle">دراجة</option><option value="delivery">توصيل</option></select></div><div id="rides" class="table-wrap"></div></section></div></section></section></main><script src="assets/app.js?v=2026.09.05"></script><script>(async()=>{const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={pending:'قيد المراجعة',active:'مفعل',suspended:'موقوف',not_submitted:'لم يقدم',approved:'موثق',rejected:'مرفوض',online:'متاح',offline:'غير متصل',busy:'في رحلة',requested:'طلب جديد',searching:'بحث عن كابتن',captain_assigned:'تم التعيين',captain_arriving:'الكابتن بالطريق',captain_arrived:'وصل الكابتن',trip_started:'قيد الرحلة',trip_completed:'مكتملة',cancelled:'ملغاة'};const label=v=>labels[v]||statusLabel(v),svc=v=>v==='motorcycle'?'🏍️ دراجة':v==='delivery'?'📦 توصيل':'🚕 سيارة',money=v=>Number(v||0).toLocaleString('ar-SY')+' ل.س';function show(){const ok=!!token;$('auth').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok);if(ok)loadAll()}async function loadAll(){try{const[s,c,r,u]=await Promise.all([api('/admin/stats'),api('/admin/captains?limit=100&'+new URLSearchParams({documentsStatus:$('docFilter').value,status:$('captainStatus').value,availability:$('availability').value})),api('/admin/rides?limit=15&'+new URLSearchParams({status:$('rideStatus').value,serviceType:$('rideService').value})),api('/admin/users?limit=30&'+new URLSearchParams({role:$('userRole').value,isActive:$('userActive').value,search:$('userSearch').value.trim()}))]);renderStats(s.data||{});renderCaptains(c.data?.items||[]);renderRides(r.data?.items||[]);renderUsers(u.data?.items||[])}catch(e){toast(e.message)}}function renderStats(x){const a=[['المستخدمون',x.users],['العملاء',x.customers],['الكباتن',x.captains],['طلبات التوثيق',x.pendingCaptains],['متاحون',x.onlineCaptains],['في رحلة',x.busyCaptains],['رحلات نشطة',x.activeRides],['مكتملة',x.completedRides],['ملغاة',x.cancelledRides]];$('stats').innerHTML=a.map(i=>`<div class="col-3 stat"><span class="muted">${i[0]}</span><b>${i[1]??0}</b></div>`).join('')}function renderUsers(a){if(!a.length){$('users').innerHTML='<div class="empty">لا توجد حسابات مطابقة.</div>';return}$('users').innerHTML='<table class="table"><thead><tr><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>'+a.map(u=>`<tr><td><b>${esc(u.name)}</b><br><small>${esc(u.phone)}</small></td><td>${u.role==='customer'?'عميل':u.role==='captain'?'كابتن':'مدير'}</td><td>${u.isActive?'🟢 مفعل':'🔴 موقوف'}</td><td>${u.role==='admin'&&u._id===user()?.id?'—':`<button class="btn ${u.isActive?'danger':'secondary'}" data-user="${esc(u._id)}" data-active="${u.isActive?'false':'true'}">${u.isActive?'إيقاف':'تفعيل'}</button>`}</td></tr>`).join('')+'</tbody></table>';document.querySelectorAll('[data-user]').forEach(b=>b.onclick=async()=>{try{setBusy(b,true,'جارٍ الحفظ...');await api('/admin/users/'+b.dataset.user+'/status',{method:'PATCH',body:JSON.stringify({isActive:b.dataset.active==='true'})});toast(b.dataset.active==='true'?'تم تفعيل الحساب':'تم إيقاف الحساب');loadAll()}catch(e){toast(e.message)}finally{setBusy(b,false)}})}function renderCaptains(a){if(!a.length){$('captains').innerHTML='<div class="empty">لا توجد نتائج.</div>';return}$('captains').innerHTML='<table class="table"><thead><tr><th>الكابتن</th><th>المركبة</th><th>الحالة</th><th>الوثائق</th><th>إجراء</th></tr></thead><tbody>'+a.map(c=>{const approved=c.documentsStatus==='approved';return `<tr><td><b>${esc(c.user?.name||'—')}</b><br><small>${esc(c.user?.phone||'')}</small></td><td>${esc([c.vehicle?.type,c.vehicle?.make,c.vehicle?.model,c.vehicle?.plateNumber].filter(Boolean).join(' • ')||'غير مكتملة')}</td><td>${esc(label(c.status))} / ${esc(label(c.availability))}</td><td>${esc(label(c.documentsStatus))}</td><td><div class="actions"><button class="btn" data-cs="${esc(c._id)}" data-v="active" ${approved?'':'disabled'}>تفعيل</button><button class="btn secondary" data-doc="${esc(c._id)}" data-v="approved">توثيق</button><button class="btn light" data-doc="${esc(c._id)}" data-v="rejected">رفض</button></div></td></tr>`}).join('')+'</tbody></table>';document.querySelectorAll('[data-cs]:not(:disabled)').forEach(b=>b.onclick=()=>captainStatusUpdate(b));document.querySelectorAll('[data-doc]').forEach(b=>b.onclick=()=>docUpdate(b))}async function captainStatusUpdate(b){try{setBusy(b,true,'...');await api('/admin/captains/'+b.dataset.cs+'/status',{method:'PATCH',body:JSON.stringify({status:b.dataset.v})});toast('تم تحديث حالة الكابتن');loadAll()}catch(e){toast(e.message)}finally{setBusy(b,false)}}async function docUpdate(b){try{setBusy(b,true,'...');await api('/admin/captains/'+b.dataset.doc+'/documents',{method:'PATCH',body:JSON.stringify({status:b.dataset.v})});toast(b.dataset.v==='approved'?'تم توثيق الوثائق':'تم رفض الوثائق');loadAll()}catch(e){toast(e.message)}finally{setBusy(b,false)}}function renderRides(a){if(!a.length){$('rides').innerHTML='<div class="empty">لا توجد رحلات.</div>';return}$('rides').innerHTML='<table class="table"><thead><tr><th>الرحلة</th><th>الخدمة</th><th>الحالة</th><th>السعر</th></tr></thead><tbody>'+a.map(r=>`<tr><td>#${esc(String(r._id||'').slice(-6))}<br><small>${esc(r.customer?.name||'عميل')}</small></td><td>${svc(r.serviceType)}</td><td>${esc(label(r.status))}${r.captain?.user?.name?'<br><small>👤 '+esc(r.captain.user.name)+'</small>':''}</td><td>${money(r.finalFare??r.estimatedFare)}</td></tr>`).join('')+'</tbody></table>'}$('login').onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value.trim(),password:$('password').value})});if((d.data?.user||d.user)?.role!=='admin')throw Error('هذا الحساب ليس حساب إدارة');saveAuth(d.data||d);show()}catch(e){toast(e.message)}};$('refresh').onclick=loadAll;$('userRefresh').onclick=loadAll;['docFilter','captainStatus','availability','rideStatus','rideService','userRole','userActive'].forEach(id=>$(id).onchange=loadAll);let searchTimer;$('userSearch').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadAll,350)};show()})()</script></body></html>
