<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | مركز الإدارة</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="shell has-app-nav"><section id="auth" class="card" style="max-width:520px;margin:45px auto"><span class="badge">لوحة محمية</span><h1 style="font-size:34px;margin:14px 0 5px">مركز الإدارة</h1><p class="muted">سجّل الدخول لإدارة منصة وصلها ومراقبة التشغيل.</p><form id="login" class="form" style="margin-top:22px"><div class="field"><label>رقم الهاتف</label><input id="phone" required autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">فتح مركز الإدارة</button></form></section><section id="app" class="hidden" style="padding:18px 0 45px"><div class="card" style="margin-bottom:18px"><span class="badge">● النظام يعمل</span><h1 style="font-size:clamp(30px,5vw,48px);margin:10px 0 3px">مركز التشغيل</h1><p class="muted">نظرة سريعة على المستخدمين والرحلات والكباتن.</p><button id="refresh" class="btn" style="margin-top:15px">↻ تحديث البيانات</button></div><div id="stats" class="grid" style="margin-bottom:18px"></div><div class="grid"><div class="col-8 card"><span class="badge">العمليات</span><h2 style="margin-top:8px">الرحلات</h2><div class="grid" style="margin-top:15px"><div class="col-6"><div class="field"><label>الحالة</label><select id="rideStatus"><option value="">كل الحالات</option><option value="requested">مطلوب</option><option value="searching">جاري البحث</option><option value="captain_assigned">تم التعيين</option><option value="captain_arriving">في الطريق</option><option value="captain_arrived">وصل</option><option value="trip_started">قيد الرحلة</option><option value="trip_completed">مكتملة</option><option value="cancelled">ملغاة</option></select></div></div><div class="col-6"><div class="field"><label>الخدمة</label><select id="service"><option value="">كل الخدمات</option><option value="taxi">🚕 سيارة</option><option value="motorcycle">🏍️ دراجة</option><option value="delivery">📦 توصيل</option></select></div></div></div><div id="rides" class="table-wrap" style="margin-top:15px"></div></div><div class="col-4 card"><span class="badge">الأسطول</span><h2 style="margin-top:8px">الكباتن</h2><div id="captains" class="table-wrap"></div></div></div></section></main><script src="assets/app.js"></script><script>(async()=>{if(token&&!requireRole('admin'))return;function show(){const ok=!!token;$('auth').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok);if(ok)load()}async function load(){try{const q=new URLSearchParams();if($('rideStatus').value)q.set('status',$('rideStatus').value);if($('service').value)q.set('serviceType',$('service').value);const[s,r,c]=await Promise.all([api('/admin/stats'),api('/admin/rides?limit=100&'+q.toString()),api('/admin/captains?limit=100')]);renderStats(s.data);renderRides(r.data.items||[]);renderCaptains(c.data.items||[])}catch(e){toast(e.message)}}function renderStats(x){const a=[['المستخدمون',x.users],['الزبائن',x.customers],['الكباتن',x.captains],['متاحون',x.onlineCaptains],['مشغولون',x.busyCaptains],['رحلات نشطة',x.activeRides],['مكتملة',x.completedRides],['ملغاة',x.cancelledRides]];$('stats').innerHTML=a.map(i=>`<div class="col-3 stat"><span class="muted">${i[0]}</span><b>${i[1]??0}</b></div>`).join('')}function renderRides(a){if(!a.length){$('rides').innerHTML='<div class="empty">لا توجد رحلات مطابقة.</div>';return}$('rides').innerHTML='<table class="table"><thead><tr><th>الرحلة</th><th>الزبون</th><th>الكابتن</th><th>الخدمة</th><th>الحالة</th><th>السعر</th></tr></thead><tbody>'+a.map(r=>`<tr><td>#${String(r._id).slice(-8)}</td><td>${r.customer?.name||'—'}</td><td>${r.captain?.user?.name||'—'}</td><td>${r.serviceType||'—'}</td><td>${statusLabel(r.status)}</td><td>${money(r.estimatedFare)}</td></tr>`).join('')+'</tbody></table>'}function renderCaptains(a){if(!a.length){$('captains').innerHTML='<div class="empty">لا يوجد كباتن.</div>';return}$('captains').innerHTML='<table class="table"><thead><tr><th>الكابتن</th><th>الحالة</th><th>التوفر</th><th>إجراء</th></tr></thead><tbody>'+a.map(c=>`<tr><td><b>${c.user?.name||'—'}</b><br><span class="muted">${c.user?.phone||''}</span></td><td>${c.status}</td><td>${c.availability}</td><td><select data-cap="${c._id}"><option value="">تغيير</option><option value="active">تفعيل</option><option value="pending">تعليق</option><option value="suspended">إيقاف</option></select></td></tr>`).join('')+'</tbody></table>';document.querySelectorAll('[data-cap]').forEach(s=>s.onchange=async()=>{if(!s.value)return;try{await api('/admin/captains/'+s.dataset.cap+'/status',{method:'PATCH',body:JSON.stringify({status:s.value})});toast('تم تحديث حالة الكابتن');load()}catch(e){toast(e.message)}})}$('login').onsubmit=async e=>{e.preventDefault();const b=e.submitter;try{setBusy(b,true);const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value.trim(),password:$('password').value})});if(d.data.user.role!=='admin')throw Error('هذا الحساب ليس حساب إدارة');saveAuth(d.data);show()}catch(e){toast(e.message)}finally{setBusy(b,false)}};$('refresh').onclick=load;$('rideStatus').onchange=load;$('service').onchange=load;show()})()</script></body></html>
