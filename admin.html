<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصلها - لوحة التحكم</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
    #map { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    .admin-bar { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.95); padding: 12px 20px; border-radius: 8px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.3); z-index: 10; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="admin-bar">مراقبة الرحلات المباشرة (دمشق)</div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoibm9tYWlsODg4ODkyIiwiYSI6ImNtdGZ2YnJ3NzA5eWsyd3BpdWNhaHR1b20ifQ.fBcCDKO-onzZat5QFZSDFw';

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v11',
      center: [36.2913, 33.5138],
      zoom: 13
    });

    map.addControl(new mapboxgl.NavigationControl());

    const socket = io('https://waslha-backend.vercel.app', {
      transports: ['websocket', 'polling']
    }); 

    const captains = {};

    socket.on('captainPositionUpdated', (data) => {
      if (captains[data.captainId]) {
        captains[data.captainId].setLngLat([data.lng, data.lat]);
      } else {
        captains[data.captainId] = new mapboxgl.Marker({ color: 'green' })
          .setLngLat([data.lng, data.lat])
          .addTo(map);
      }
    });
  </script>
</body>
</html>
