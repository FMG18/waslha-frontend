<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وصلها | الإدارة</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html" style="text-decoration:none;color:inherit"><span class="logo">و</span><span>لوحة الإدارة</span></a><button class="ghost" onclick="logout()">تسجيل الخروج</button></header><section id="auth" class="card" style="max-width:520px;margin:50px auto"><h2>دخول الإدارة</h2><p class="muted">هذه الواجهة تتطلب حساباً بدور admin.</p><form id="login" class="form"><div class="field"><label>رقم الهاتف</label><input id="phone" required autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">دخول لوحة التحكم</button></form></section><section id="app" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><span class="badge">ADMIN</span><h2>مركز التشغيل</h2><p class="muted">مراقبة المؤشرات والرحلات والكباتن.</p></div><button id="refresh" class="btn" style="width:auto">↻ تحديث</button></div></div><div id="stats" class="grid" style="margin:18px 0"></div><div class="grid"><div class="col-8 card"><h3>الرحلات</h3><div class="grid"><div class="col-6"><div class="field"><label>الحالة</label><select id="rideStatus"><option value="">الكل</option><option value="requested">مطلوب</option><option value="searching">جاري البحث</option><option value="captain_assigned">تم التعيين</option><option value="captain_arriving">في الطريق</option><option value="captain_arrived">وصل</option><option value="trip_started">بدأت الرحلة</option><option value="trip_completed">مكتملة</option><option value="cancelled">ملغاة</option></select></div></div><div class="col-6"><div class="field"><label>الخدمة</label><select id="service"><option value="">الكل</option><option value="taxi">تكسي</option><option value="motorcycle">دراجة</option><option value="delivery">توصيل</option></select></div></div></div><div id="rides" class="table-wrap" style="margin-top:15px"></div></div><div class="col-4 card"><h3>الكباتن</h3><div id="captains" class="table-wrap"></div></div></div></section></main><script src="assets/app.js"></script><script>(async()=>{if(token&&!requireRole('admin'))return;function show(){const ok=!!token;$('auth').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok);if(ok)load()}async function load(){try{const qs=new URLSearchParams();if($('rideStatus').value)qs.set('status',$('rideStatus').value);if($('service').value)qs.set('serviceType',$('service').value);const [s,r,c]=await Promise.all([api('/admin/stats'),api('/admin/rides?limit=100&'+qs),api('/admin/captains?limit=100')]);renderStats(s.data);renderRides(r.data.items||[]);renderCaptains(c.data.items||[])}catch(e){toast(e.message)}}function renderStats(x){const items=[['المستخدمون',x.users],['الزبائن',x.customers],['الكباتن',x.captains],['متاحون',x.onlineCaptains],['مشغولون',x.busyCaptains],['رحلات نشطة',x.activeRides],['مكتملة',x.completedRides],['ملغاة',x.cancelledRides]];$('stats').innerHTML=items.map(i=>`<div class="col-3 stat"><span class="muted">${i[0]}</span><b>${i[1]??0}</b></div>`).join('')}function renderRides(items){if(!items.length){$('rides').innerHTML='<div class="status">لا توجد رحلات مطابقة.</div>';return}$('rides').innerHTML='<table class="table"><thead><tr><th>الرحلة</th><th>الزبون</th><th>الكابتن</th><th>الخدمة</th><th>الحالة</th><th>السعر</th></tr></thead><tbody>'+items.map(r=>`<tr><td>${String(r._id).slice(-8)}</td><td>${r.customer?.name||'—'}</td><td>${r.captain?.user?.name||'—'}</td><td>${r.serviceType||'—'}</td><td>${statusLabel(r.status)}</td><td>${money(r.estimatedFare)}</td></tr>`).join('')+'</tbody></table>'}function renderCaptains(items){if(!items.length){$('captains').innerHTML='<div class="status">لا يوجد كباتن.</div>';return}$('captains').innerHTML='<table class="table"><thead><tr><th>الكابتن</th><th>الحالة</th><th>التوفر</th><th>إجراء</th></tr></thead><tbody>'+items.map(c=>`<tr><td>${c.user?.name||'—'}<br><span class="muted">${c.user?.phone||''}</span></td><td>${c.status}</td><td>${c.availability}</td><td><select data-cap="${c._id}"><option value="">تغيير</option><option value="active">تفعيل</option><option value="pending">تعليق</option><option value="suspended">إيقاف</option></select></td></tr>`).join('')}</tbody></table>';document.querySelectorAll('[data-cap]').forEach(s=>s.onchange=async()=>{if(!s.value)return;try{await api('/admin/captains/'+s.dataset.cap+'/status',{method:'PATCH',body:JSON.stringify({status:s.value})});toast('تم تحديث حالة الكابتن');load()}catch(e){toast(e.message)}})}$('login').onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value.trim(),password:$('password').value})});if(d.data.user.role!=='admin')throw Error('هذا الحساب ليس حساب إدارة');saveAuth(d.data);show()}catch(e){toast(e.message)}};$('refresh').onclick=load;$('rideStatus').onchange=load;$('service').onchange=load;show()})()</script></body></html>
