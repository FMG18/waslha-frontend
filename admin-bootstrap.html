<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء إدارة وصلها</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#0d0d12;color:#fff;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#171720;border:1px solid #2b2b38;border-radius:22px;padding:26px;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;font-size:26px}p{color:#aaa;line-height:1.7;margin:0 0 22px}.field{margin:12px 0}label{display:block;margin-bottom:7px;color:#ddd}input{width:100%;padding:14px;border-radius:12px;border:1px solid #383846;background:#0f0f16;color:#fff;font-size:16px;outline:none}input:focus{border-color:#8b5cf6}button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:13px;background:#8b5cf6;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:16px;padding:12px;border-radius:12px;display:none;line-height:1.6}.ok{display:block;background:#12351f;color:#8ff0ad}.err{display:block;background:#3b1717;color:#ffaaa0}.hint{font-size:13px;color:#777;margin-top:14px}</style></head><body><main class="card"><h1>إنشاء حساب الإدارة</h1><p>هذه الصفحة لإنشاء أول حساب Admin فقط. مفتاح الإنشاء لا يتم حفظه في الموقع.</p><form id="form"><div class="field"><label>اسم الإدارة</label><input id="name" value="Waslha Admin" required></div><div class="field"><label>رقم الهاتف</label><input id="phone" value="+9647814999307" inputmode="tel" required></div><div class="field"><label>كلمة مرور الإدارة</label><input id="password" type="password" minlength="8" required></div><div class="field"><label>مفتاح الإنشاء ADMIN_BOOTSTRAP_KEY</label><input id="key" type="password" autocomplete="off" required></div><button id="btn">إنشاء حساب الإدارة</button></form><div id="msg" class="msg"></div><div class="hint">بعد النجاح سيتم تحويلك إلى لوحة الإدارة.</div></main><script>const API='https://waslha-backend.vercel.app/api';const f=document.getElementById('form'),b=document.getElementById('btn'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();m.className='msg';m.textContent='';b.disabled=true;b.textContent='جارٍ إنشاء الحساب...';try{const r=await fetch(API+'/auth/bootstrap-admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-bootstrap-key':document.getElementById('key').value},body:JSON.stringify({name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),password:document.getElementById('password').value})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j?.message||j?.error?.message||'فشل إنشاء الحساب');m.className='msg ok';m.textContent='✓ تم إنشاء حساب الإدارة بنجاح. يمكنك الآن الدخول إلى لوحة الإدارة.';f.querySelectorAll('input').forEach(x=>x.disabled=true);b.textContent='تم إنشاء الحساب';setTimeout(()=>location.href='admin.html',1200)}catch(err){m.className='msg err';m.textContent='✕ '+err.message;b.disabled=false;b.textContent='إنشاء حساب الإدارة'}});</script></body></html>
