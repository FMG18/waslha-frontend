<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | الملف الشخصي</title><link rel="stylesheet" href="assets/style.css"><style>.app-nav{min-height:76px;display:flex;align-items:center;gap:25px;border-bottom:1px solid var(--line);margin-bottom:20px}.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-size:20px}.nav-brand .logo{width:42px;height:42px;border-radius:14px}.nav-links{display:flex;gap:5px;flex:1}.nav-links a{padding:10px 13px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:700}.nav-links a:hover,.nav-links a.active{background:#e9fbf3;color:var(--brand2)}.nav-actions{display:flex;align-items:center;gap:9px}.profile-chip{display:flex;align-items:center;gap:8px;text-decoration:none}.profile-chip span{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;background:#dff8ed;color:var(--brand2);font-weight:800}.profile-chip b{font-size:12px}.profile-avatar{width:78px;height:78px;border-radius:24px;display:grid;place-items:center;background:#dff8ed;color:var(--brand2);font-size:30px;font-weight:800}</style></head><body><main class="shell"><div id="nav"></div><section style="padding:25px 0 70px"><div class="card profile-hero"><div id="avatar" class="profile-avatar">و</div><div class="profile-meta"><h1 id="title">الملف الشخصي</h1><p id="subtitle" class="muted">إدارة معلومات حسابك</p></div></div><div class="grid"><div class="col-7 card"><span class="badge">المعلومات الشخصية</span><h2 style="margin-top:10px">بيانات الحساب</h2><form id="profileForm" class="form" style="margin-top:18px"><div class="field"><label>الاسم</label><input id="name" required minlength="2" maxlength="80"></div><div class="field"><label>رقم الهاتف</label><input id="phone" inputmode="tel" required></div><button class="btn">حفظ التغييرات</button></form></div><div class="col-5 card"><span class="badge">الأمان</span><h2 style="margin-top:10px">تغيير كلمة المرور</h2><form id="passwordForm" class="form" style="margin-top:18px"><div class="field"><label>كلمة المرور الحالية</label><input id="currentPassword" type="password" required></div><div class="field"><label>كلمة المرور الجديدة</label><input id="newPassword" type="password" minlength="8" required></div><div class="field"><label>تأكيد كلمة المرور</label><input id="confirmPassword" type="password" minlength="8" required></div><button class="btn secondary">تغيير كلمة المرور</button></form><div class="danger-note" style="margin-top:18px">لن يتم تغيير كلمة المرور إلا بعد التحقق من كلمة المرور الحالية.</div></div></div></section></main><script src="assets/app.js"></script><script>(async()=>{if(!token){location.href='customer.html';return}const u=user();const role=u?.role;const home=role==='captain'?'captain.html':role==='admin'?'admin.html':'customer.html';$('nav').innerHTML=`<nav class="app-nav"><a class="nav-brand" href="${home}"><span class="logo">و</span><b>وصلها</b></a><div class="nav-links"><a href="${home}">الرئيسية</a>${role==='customer'?'<a href="customer.html#newRide">رحلة جديدة</a>':''}${role==='captain'?'<a href="captain.html#requests">الطلبات</a>':''}<a class="active" href="profile.html">الملف الشخصي</a></div><div class="nav-actions"><a class="profile-chip" href="profile.html"><span>${(u?.name||'حساب').slice(0,1)}</span><b>${u?.name||'حسابي'}</b></a><button class="ghost" onclick="logout()">خروج</button></div></nav>`;try{const p=await loadProfile();$('name').value=p.name||'';$('phone').value=p.phone||'';$('title').textContent=p.name||'الملف الشخصي';$('subtitle').textContent=(p.role==='captain'?'حساب كابتن':p.role==='admin'?'حساب إدارة':'حساب زبون')+' • '+p.phone;$('avatar').textContent=(p.name||'و').slice(0,1)}catch(e){toast(e.message)}$('profileForm').onsubmit=async e=>{e.preventDefault();try{setBusy(e.submitter,true,'جارٍ الحفظ...');const p=await updateProfile({name:$('name').value.trim(),phone:$('phone').value.trim()});$('title').textContent=p.name;$('subtitle').textContent=(p.role==='captain'?'حساب كابتن':p.role==='admin'?'حساب إدارة':'حساب زبون')+' • '+p.phone;$('avatar').textContent=p.name.slice(0,1);toast('تم حفظ بيانات الحساب')}catch(e){toast(e.message)}finally{setBusy(e.submitter,false)}};$('passwordForm').onsubmit=async e=>{e.preventDefault();if($('newPassword').value!==$('confirmPassword').value)return toast('تأكيد كلمة المرور غير مطابق');try{setBusy(e.submitter,true,'جارٍ تغيير كلمة المرور...');await updateProfile({currentPassword:$('currentPassword').value,newPassword:$('newPassword').value});$('passwordForm').reset();toast('تم تغيير كلمة المرور بنجاح')}catch(e){toast(e.message)}finally{setBusy(e.submitter,false)}}})()</script></body></html>
