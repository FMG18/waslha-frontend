<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f9f6e"><title>وصلها | حسابي</title><link rel="stylesheet" href="assets/waslha3.css?v=2026.09.03"><link rel="stylesheet" href="assets/profile3.css?v=2026.09.03"></head><body class="profile3"><main class="p-shell"><a class="back" href="home.html">← العودة للرئيسية</a><section class="p-hero"><div id="avatar" class="avatar">و</div><div class="hero-copy"><small>حساب وصلها</small><h1 id="title">الملف الشخصي</h1><p id="subtitle">إدارة معلومات حسابك بأمان</p></div></section><section class="cards"><div class="card"><h2>المعلومات الشخصية</h2><form id="profileForm"><div class="field"><label class="label">الاسم</label><input id="name" required minlength="2" maxlength="80" autocomplete="name"></div><div class="field"><label class="label">رقم الهاتف</label><input id="phone" inputmode="tel" required autocomplete="tel"></div><button class="btn">حفظ التغييرات</button></form></div><div class="card"><h2>الأمان</h2><div class="security-note">استخدم كلمة مرور قوية ولا تشاركها مع أي شخص. التغيير يتم من خلال حسابك الموثّق.</div><form id="passwordForm"><div class="field"><label class="label">كلمة المرور الحالية</label><input id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label class="label">كلمة المرور الجديدة</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label class="label">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn secondary">تغيير كلمة المرور</button></form></div></section><button class="btn danger logout" id="logoutBtn" type="button">تسجيل الخروج</button></main><script src="assets/app.js?v=2026.09.03"></script><script>(async()=>{if(!token){location.replace('index.html');return}const roleLabel=r=>r==='captain'?'حساب كابتن':r==='admin'?'حساب إدارة':'حساب زبون';function render(p){$('name').value=p.name||'';$('phone').value=p.phone||'';$('title').textContent=p.name||'الملف الشخصي';$('subtitle').textContent=roleLabel(p.role)+' • '+(p.phone||'');$('avatar').textContent=(p.name||'و').trim().slice(0,1)||'و'}try{render(await loadProfile())}catch(e){toast(e.message)}$('profileForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;try{setBusy(b,true,'جارٍ الحفظ...');render(await updateProfile({name:$('name').value.trim(),phone:$('phone').value.trim()}));toast('تم حفظ بيانات الحساب')}catch(e){toast(e.message)}finally{setBusy(b,false)}};$('passwordForm').onsubmit=async e=>{e.preventDefault();if($('newPassword').value!==$('confirmPassword').value)return toast('تأكيد كلمة المرور غير مطابق');const b=e.submitter;try{setBusy(b,true,'جارٍ التغيير...');await updateProfile({currentPassword:$('currentPassword').value,newPassword:$('newPassword').value});$('passwordForm').reset();toast('تم تغيير كلمة المرور بنجاح')}catch(e){toast(e.message)}finally{setBusy(b,false)}};$('logoutBtn').onclick=logout})()</script></body></html>
