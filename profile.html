<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | حسابي</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="shell has-app-nav"><section style="padding:18px 0 45px"><div class="card profile-hero"><div id="avatar" class="profile-avatar">و</div><div class="profile-meta"><span class="badge">حسابي</span><h1 id="title">الملف الشخصي</h1><p id="subtitle" class="muted">إدارة معلومات حسابك</p></div></div><div class="grid"><div class="col-7 card"><span class="badge">المعلومات الشخصية</span><h2 style="margin-top:10px">بيانات الحساب</h2><form id="profileForm" class="form" style="margin-top:18px"><div class="field"><label>الاسم</label><input id="name" required minlength="2" maxlength="80" autocomplete="name"></div><div class="field"><label>رقم الهاتف</label><input id="phone" inputmode="tel" required autocomplete="tel"></div><button class="btn">حفظ التغييرات</button></form></div><div class="col-5 card"><span class="badge">الأمان</span><h2 style="margin-top:10px">تغيير كلمة المرور</h2><form id="passwordForm" class="form" style="margin-top:18px"><div class="field"><label>كلمة المرور الحالية</label><input id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label>كلمة المرور الجديدة</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label>تأكيد كلمة المرور</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn secondary">تغيير كلمة المرور</button></form></div><div class="col-12"><button class="btn danger" id="logoutBtn" type="button" style="max-width:260px">تسجيل الخروج</button></div></div></section></main><script src="assets/app.js"></script><script>(async()=>{if(!token){location.href='index.html';return}const roleLabel=r=>r==='captain'?'حساب كابتن':r==='admin'?'حساب إدارة':'حساب زبون';function render(p){$('name').value=p.name||'';$('phone').value=p.phone||'';$('title').textContent=p.name||'الملف الشخصي';$('subtitle').textContent=roleLabel(p.role)+' • '+(p.phone||'');$('avatar').textContent=(p.name||'و').trim().slice(0,1)||'و'}try{render(await loadProfile())}catch(e){toast(e.message)}$('profileForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;try{setBusy(b,true,'جارٍ الحفظ...');render(await updateProfile({name:$('name').value.trim(),phone:$('phone').value.trim()}));toast('تم حفظ بيانات الحساب')}catch(e){toast(e.message)}finally{setBusy(b,false)}};$('passwordForm').onsubmit=async e=>{e.preventDefault();if($('newPassword').value!==$('confirmPassword').value)return toast('تأكيد كلمة المرور غير مطابق');const b=e.submitter;try{setBusy(b,true,'جارٍ التغيير...');await updateProfile({currentPassword:$('currentPassword').value,newPassword:$('newPassword').value});$('passwordForm').reset();toast('تم تغيير كلمة المرور بنجاح')}catch(e){toast(e.message)}finally{setBusy(b,false)}};$('logoutBtn').onclick=logout})()</script></body></html>
