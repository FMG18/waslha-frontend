<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f9f6e"><title>وصلها | رحلاتي</title><link rel="stylesheet" href="assets/style.css?v=2026.09.03"><link rel="stylesheet" href="assets/rides3.css?v=2026.09.03"></head><body class="rides3"><main class="rides-shell has-app-nav"><header class="rides-head"><div><span class="eyebrow">سجل الرحلات</span><h1>رحلاتي</h1><p class="muted">كل مشاويرك في مكان واحد، من الطلب إلى الرحلة المكتملة.</p></div><div class="head-actions"><a class="new-ride" href="customer.html#newRide">＋ رحلة جديدة</a></div></header><nav class="filterbar" aria-label="تصفية الرحلات"><button id="all" class="active" type="button">الكل</button><button id="active" type="button">النشطة</button></nav><section id="list" class="ride-list"><div class="ride-card">جارٍ تحميل الرحلات...</div></section></main><script src="assets/app.js?v=2026.09.03"></script><script>(async()=>{if(!requireRole('customer'))return;let activeOnly=false;const list=$('list');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function isActive(s){return !['trip_completed','completed','cancelled'].includes(s)}function icon(s){return s==='motorcycle'||s==='bike'?'🏍️':s==='delivery'?'📦':'🚕'}async function rate(id,b){const score=Number(prompt('قيّم الرحلة من 1 إلى 5 نجوم:','5'));if(!Number.isInteger(score)||score<1||score>5){if(score!==0)toast('التقييم يجب أن يكون من 1 إلى 5');return}const comment=prompt('ملاحظة اختيارية:','')??'';try{setBusy(b,true,'جارٍ الإرسال...');await api('/ratings/rides/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({score,comment:comment.trim().slice(0,500)})});b.remove();toast('تم تسجيل التقييم بنجاح')}catch(e){toast(e.message)}finally{setBusy(b,false)}}async function load(){list.innerHTML='<div class="ride-card">جارٍ تحديث السجل...</div>';try{const d=await api('/rides?limit=100'+(activeOnly?'&active=true':''));const a=d.data?.items||d.data?.rides||[];if(!a.length){list.innerHTML='<div class="empty"><strong>لا توجد رحلات هنا</strong><span class="muted">ابدأ مشوارك الأول مع وصلها.</span><a class="new-ride" href="customer.html#newRide" style="display:block;margin-top:15px">اطلب رحلتك الأولى</a></div>';return}list.innerHTML=a.map(r=>{const active=isActive(r.status),completed=['trip_completed','completed'].includes(r.status);return `<article class="ride-card"><div class="ride-topline"><span class="status">${esc(statusLabel(r.status))}</span><b class="fare">${esc(money(r.estimatedFare??r.fare))}</b></div><div class="route"><div class="route-row"><span class="dot"></span><div><small class="meta">الانطلاق</small><b>${icon(r.serviceType)} ${esc(r.pickup?.address||r.pickupAddress||'نقطة الانطلاق')}</b></div></div><div class="route-line"></div><div class="route-row"><span class="dot drop"></span><div><small class="meta">الوجهة</small><b>${esc(r.dropoff?.address||r.dropoffAddress||'الوجهة')}</b></div></div></div><small class="meta">${r.createdAt?esc(new Date(r.createdAt).toLocaleString('ar-IQ')):''}</small>${active&&r._id?`<a href="tracking.html?ride=${encodeURIComponent(r._id)}" class="ride-action" style="margin-top:14px">متابعة الرحلة</a>`:''}${completed&&r._id?`<button class="ride-action rate-btn" data-rate="${esc(r._id)}" style="margin-top:14px">★ قيّم الرحلة</button>`:''}</article>`}).join('');document.querySelectorAll('.rate-btn').forEach(b=>b.onclick=()=>rate(b.dataset.rate,b))}catch(e){list.innerHTML=`<div class="ride-card"><b>تعذر تحميل الرحلات</b><p class="muted">${esc(e.message)}</p><button class="ride-action" id="retry">إعادة المحاولة</button></div>`;$('retry')?.addEventListener('click',load)}}$('all').onclick=()=>{activeOnly=false;$('all').classList.add('active');$('active').classList.remove('active');load()};$('active').onclick=()=>{activeOnly=true;$('active').classList.add('active');$('all').classList.remove('active');load()};load()})()</script></body></html>
