<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | رحلاتي</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="shell has-app-nav"><section style="padding:18px 0 45px"><div class="card" style="margin-bottom:18px"><span class="badge">سجل الرحلات</span><h1 style="font-size:34px;margin:10px 0 4px">رحلاتي</h1><p class="muted">تابع رحلاتك الحالية والسابقة من مكان واحد.</p><div class="actions" style="margin-top:18px"><button id="all" class="btn">الكل</button><button id="active" class="btn light">النشطة فقط</button></div></div><div id="list" class="grid"><div class="col-12 card">جارٍ تحميل الرحلات...</div></div></section></main><script src="assets/app.js"></script><script>(async()=>{if(!requireRole('customer'))return;let activeOnly=false;async function load(){try{const d=await api('/rides?limit=100'+(activeOnly?'&active=true':''));const a=d.data?.items||d.data?.rides||[];if(!a.length){$('list').innerHTML='<div class="col-12 card"><div class="empty">لا توجد رحلات حتى الآن.</div><a class="btn" href="customer.html#newRide" style="display:block;text-align:center;text-decoration:none;margin-top:15px">طلب رحلة جديدة</a></div>';return}$('list').innerHTML=a.map(r=>`<div class="col-6 card"><div style="display:flex;justify-content:space-between;gap:10px"><span class="badge">${statusLabel(r.status)}</span><b>${money(r.estimatedFare)}</b></div><h3 style="margin-top:15px">${r.serviceType==='motorcycle'?'🏍️':r.serviceType==='delivery'?'📦':'🚕'} ${r.pickup?.address||r.pickupAddress||'نقطة الانطلاق'}</h3><p class="muted" style="margin:0">↓ ${r.dropoff?.address||r.dropoffAddress||'الوجهة'}</p><small class="muted">${r.createdAt?new Date(r.createdAt).toLocaleString('ar-IQ'):''}</small>${r.status!=='completed'&&r.status!=='cancelled'&&r._id?`<a href="customer.html?ride=${r._id}" class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:15px">فتح الرحلة</a>`:''}</div>`).join('')}catch(e){$('list').innerHTML=`<div class="col-12 card"><b>تعذر تحميل الرحلات</b><p class="muted">${e.message}</p><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>`}}$('all').onclick=()=>{activeOnly=false;load()};$('active').onclick=()=>{activeOnly=true;load()};load()})()</script></body></html>
