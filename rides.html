<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | رحلاتي</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="shell has-app-nav"><section style="padding:18px 0 45px"><div class="card" style="margin-bottom:18px"><span class="badge">سجل الرحلات</span><h1 style="font-size:34px;margin:10px 0 4px">رحلاتي</h1><p class="muted">كل رحلاتك الحالية والسابقة في مكان واحد.</p><div class="actions" style="margin-top:18px"><button id="all" class="btn">الكل</button><button id="active" class="btn light">النشطة</button><a href="customer.html#newRide" class="btn secondary" style="text-decoration:none">＋ رحلة جديدة</a></div></div><div id="list" class="grid"><div class="col-12 card">جارٍ تحميل الرحلات...</div></div></section></main><script src="assets/app.js"></script><script>(async()=>{if(!requireRole('customer'))return;let activeOnly=false;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function isActive(s){return !['trip_completed','completed','cancelled'].includes(s)}async function load(){const list=$('list');list.innerHTML='<div class="col-12 card">جارٍ تحديث السجل...</div>';try{const d=await api('/rides?limit=100'+(activeOnly?'&active=true':''));const a=d.data?.items||d.data?.rides||[];if(!a.length){list.innerHTML='<div class="col-12 card"><div class="empty">لا توجد رحلات في هذا القسم.</div><a class="btn" href="customer.html#newRide" style="display:block;text-align:center;text-decoration:none;margin-top:15px">اطلب رحلتك الأولى</a></div>';return}list.innerHTML=a.map(r=>{const active=isActive(r.status);return `<article class="col-6 card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="badge">${esc(statusLabel(r.status))}</span><b>${esc(money(r.estimatedFare))}</b></div><h3 style="margin:15px 0 7px">${r.serviceType==='motorcycle'?'🏍️':r.serviceType==='delivery'?'📦':'🚕'} ${esc(r.pickup?.address||r.pickupAddress||'نقطة الانطلاق')}</h3><p class="muted" style="margin:0 0 8px">↓ ${esc(r.dropoff?.address||r.dropoffAddress||'الوجهة')}</p><small class="muted">${r.createdAt?esc(new Date(r.createdAt).toLocaleString('ar-IQ')):''}</small>${active&&r._id?`<a href="customer.html?ride=${encodeURIComponent(r._id)}" class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:15px">متابعة الرحلة</a>`:''}</article>`}).join('')}catch(e){list.innerHTML=`<div class="col-12 card"><b>تعذر تحميل الرحلات</b><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>`}}$('all').onclick=()=>{activeOnly=false;load()};$('active').onclick=()=>{activeOnly=true;load()};load()})()</script></body></html>
