<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | سجل الكابتن</title><link rel="stylesheet" href="assets/style.css?v=2026.09.01"><link rel="stylesheet" href="assets/mobile.css?v=2026.09.01"></head><body><main class="shell" style="padding:22px 0 50px"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><span class="badge">الكابتن</span><h1>سجل الرحلات والأرباح</h1><p class="muted">راجع رحلاتك المكتملة وحساب إجمالي الأجرة.</p></div><a href="captain.html" class="btn light" style="text-decoration:none">لوحة الكابتن</a></div></div><div class="grid" style="margin-top:18px"><div class="col-4 card"><small class="muted">الرحلات المكتملة</small><h2 id="count">—</h2></div><div class="col-4 card"><small class="muted">الإجمالي</small><h2 id="total">—</h2></div><div class="col-4 card"><small class="muted">متوسط الرحلة</small><h2 id="avg">—</h2></div></div><section class="card" style="margin-top:18px"><span class="badge">آخر الرحلات</span><div id="list" style="margin-top:12px"><div class="empty">جارٍ التحميل...</div></div></section></main><script src="assets/app.js?v=2026.09.04"></script><script>(async()=>{if(!requireRole('captain'))return;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const d=await api('/rides?status=trip_completed&limit=100');const x=d.data||d;const items=x.items||[];const total=items.reduce((s,r)=>s+Number(r.finalFare??r.estimatedFare??0),0);$('count').textContent=items.length;$('total').textContent=money(total);$('avg').textContent=money(items.length?total/items.length:0);$('list').innerHTML=items.length?items.map(r=>`<article class="status" style="margin:10px 0"><b>${esc(r.serviceType==='taxi'?'🚕 تاكسي':r.serviceType==='motorcycle'?'🏍️ دراجة':'📦 توصيل')}</b><div class="muted">${esc(r.pickup?.address||r.pickupAddress||'موقع الانطلاق')} ← ${esc(r.dropoff?.address||r.dropoffAddress||'الوجهة')}</div><strong>${money(r.finalFare??r.estimatedFare)}</strong><small class="muted" style="display:block">${r.createdAt?new Date(r.createdAt).toLocaleString('ar-IQ'):''}</small></article>`).join(''):'<div class="empty">لا توجد رحلات مكتملة حتى الآن.</div>'}catch(e){$('list').innerHTML=`<div class="empty">تعذر تحميل السجل: ${esc(e.message)}</div>`}})()</script></body></html>
