<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f9f6e"><title>وصلها | رحلات الكابتن</title><link rel="stylesheet" href="assets/style.css?v=2026.09.05"><link rel="stylesheet" href="assets/mobile.css?v=2026.09.05"><style>:root{--g:#0f9f6e;--bg:#f4f7f6;--bd:#e5ece9}body{background:var(--bg)}.page{max-width:900px;margin:auto;padding:14px 14px 80px}.hero{background:linear-gradient(135deg,#0f9f6e,#087653);color:#fff;border-radius:24px;padding:22px;box-shadow:0 14px 35px #08765322}.hero h1{margin:8px 0 4px}.hero p{margin:0;opacity:.85}.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.hero a{color:#fff;text-decoration:none;background:#ffffff20;border:1px solid #ffffff35;border-radius:12px;padding:9px 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--bd);border-radius:17px;padding:15px}.stat small{color:#71807a}.stat strong{display:block;font-size:20px;margin-top:5px}.panel{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools input,.tools select{flex:1;min-width:150px;border:1px solid var(--bd);border-radius:12px;padding:11px;background:#fff;font:inherit}.ride{padding:15px 0;border-bottom:1px solid #edf1ef}.ride:last-child{border-bottom:0}.ride-top{display:flex;justify-content:space-between;gap:10px}.ride-route{line-height:1.9;margin:7px 0}.ride-meta{color:#71807a;font-size:12px;line-height:1.8}.fare{font-size:18px;font-weight:800;color:#087b55;white-space:nowrap}.tag{display:inline-block;background:#e8f7f1;color:#087b55;border-radius:9px;padding:4px 8px;font-size:11px;font-weight:700}.empty{padding:25px;text-align:center;color:#7b8984;background:#f7faf9;border-radius:15px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.hero-top{align-items:flex-start}.ride-top{align-items:flex-start}}</style></head><body><main class="page"><section class="hero"><div class="hero-top"><div><span class="badge" style="background:#ffffff22;color:#fff">الكابتن</span><h1>رحلاتي</h1><p>تابع الرحلات المكتملة وأرباحك بالتفصيل.</p></div><a href="captain.html">لوحة الكابتن</a></div></section><section class="stats"><div class="stat"><small>الرحلات المكتملة</small><strong id="count">—</strong></div><div class="stat"><small>إجمالي الأرباح</small><strong id="total">—</strong></div><div class="stat"><small>متوسط الرحلة</small><strong id="avg">—</strong></div></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><span class="badge">السجل</span><h2 style="margin:7px 0 0">آخر الرحلات</h2></div><button id="refresh" class="btn light" type="button">تحديث</button></div><div class="tools"><input id="search" placeholder="ابحث بالموقع أو الوجهة..." autocomplete="off"><select id="type"><option value="">كل الخدمات</option><option value="taxi">🚕 تاكسي</option><option value="motorcycle">🏍️ دراجة</option><option value="delivery">📦 توصيل</option></select></div><div id="list"><div class="empty">جارٍ التحميل...</div></div></section></main><script src="assets/app.js?v=2026.09.05"></script><script>(async()=>{if(!requireRole('captain'))return;let items=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('ar-SY')+' ل.س';const service=r=>r.serviceType==='taxi'?'🚕 تاكسي':r.serviceType==='motorcycle'?'🏍️ دراجة':'📦 توصيل';function render(){const q=$('search').value.trim().toLowerCase(),t=$('type').value;const shown=items.filter(r=>{const text=((r.pickup?.address||r.pickupAddress||'')+' '+(r.dropoff?.address||r.dropoffAddress||'')).toLowerCase();return(!q||text.includes(q))&&(!t||r.serviceType===t)});$('list').innerHTML=shown.length?shown.map(r=>{const fare=r.finalFare??r.estimatedFare??r.fare;const when=r.createdAt?new Date(r.createdAt).toLocaleString('ar-IQ',{dateStyle:'medium',timeStyle:'short'}):'';const dist=r.estimatedDistanceKm!=null?Number(r.estimatedDistanceKm).toFixed(1)+' كم':'';const duration=r.estimatedDurationMin??r.estimatedDurationMinutes;return `<article class="ride"><div class="ride-top"><div><span class="tag">${service(r)}</span><div class="ride-route"><b>${esc(r.pickup?.address||r.pickupAddress||'موقع الانطلاق')}</b><br>↓<br><b>${esc(r.dropoff?.address||r.dropoffAddress||'الوجهة')}</b></div></div><div class="fare">${money(fare)}</div></div><div class="ride-meta">${esc(when)}${dist?' • '+esc(dist):''}${duration!=null?' • '+esc(duration)+' دقيقة':''}</div></article>`}).join(''):`<div class="empty">لا توجد رحلات مطابقة.</div>`}async function load(){ $('list').innerHTML='<div class="empty">جارٍ التحديث...</div>';try{const d=await api('/rides?status=trip_completed&limit=100');const x=d?.data||d;items=Array.isArray(x?.items)?x.items:Array.isArray(x)?x:[];const total=items.reduce((s,r)=>s+Number(r.finalFare??r.estimatedFare??r.fare??0),0);$('count').textContent=items.length;$('total').textContent=money(total);$('avg').textContent=money(items.length?total/items.length:0);render()}catch(e){$('list').innerHTML=`<div class="empty">تعذر تحميل السجل: ${esc(e.message)}</div>`}}$('search').addEventListener('input',render);$('type').addEventListener('change',render);$('refresh').onclick=load;load()})()</script></body></html>
