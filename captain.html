<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وصلها - الكابتن</title><style>body{font-family:Arial;margin:0;background:#0f172a;color:#fff}.wrap{max-width:560px;margin:auto;padding:20px}.card{background:#1e293b;padding:18px;border-radius:16px;margin-bottom:14px}input,button{width:100%;padding:12px;margin:6px 0;border:0;border-radius:10px;box-sizing:border-box}button{background:#22c55e;color:white;font-weight:bold}.secondary{background:#475569}.danger{background:#ef4444}.hidden{display:none}.status{padding:12px;background:#334155;border-radius:10px;margin:10px 0}</style></head><body><div class="wrap"><div class="card"><h2>وصلها - الكابتن 🚕</h2><div id="auth"><input id="name" placeholder="اسم الكابتن"><input id="phone" placeholder="رقم الهاتف"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="register()">تسجيل كابتن</button><button class="secondary" onclick="login()">دخول</button></div><div id="app" class="hidden"><p id="info"></p><button onclick="goOnline()">إظهار متوفر</button><button class="secondary" onclick="goOffline()">إخفاء متوفر</button><button class="secondary" onclick="logout()">تسجيل الخروج</button><div class="status" id="status">جارٍ تحميل الطلبات...</div><button id="accept" class="hidden" onclick="acceptRide()">قبول الطلب</button><button id="reject" class="hidden danger" onclick="rejectRide()">رفض الطلب</button><button id="arriving" class="hidden" onclick="action('arriving')">أنا في الطريق</button><button id="arrived" class="hidden" onclick="action('arrived')">وصلت</button><button id="start" class="hidden" onclick="action('start')">بدء الرحلة</button><button id="complete" class="hidden" onclick="action('complete')">إنهاء الرحلة</button></div></div></div><script>const API='https://waslha-backend.vercel.app/api';let token=localStorage.getItem('waslha_token'),ride=null,locationTimer=null;const $=id=>document.getElementById(id);async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(API+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d?.error?.message||'حدث خطأ');return d}function toggle(){let ok=!!token;$('auth').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok)}async function register(){try{let d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:$('name').value,phone:$('phone').value,password:$('password').value,role:'captain'})});save(d.data)}catch(e){alert(e.message)}}async function login(){try{let d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value,password:$('password').value})});if(d.data.user.role!=='captain')throw Error('هذا الحساب ليس كابتن');save(d.data)}catch(e){alert(e.message)}}function save(d){token=d.token;localStorage.setItem('waslha_token',token);localStorage.setItem('waslha_user',JSON.stringify(d.user));toggle();startLocation()}function logout(){clearInterval(locationTimer);localStorage.clear();token=null;toggle()}async function startLocation(){const send=p=>api('/captains/location',{method:'PATCH',body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude})}).catch(()=>{});if(navigator.geolocation){navigator.geolocation.getCurrentPosition(send);locationTimer=setInterval(()=>navigator.geolocation.getCurrentPosition(send),10000)}}async function goOnline(){try{await api('/captains/status',{method:'PATCH',body:JSON.stringify({availability:'online'})});$('status').textContent='أنت الآن متوفر لاستقبال الطلبات';poll()}catch(e){alert(e.message)}}async function goOffline(){try{await api('/captains/status',{method:'PATCH',body:JSON.stringify({availability:'offline'})});$('status').textContent='أنت غير متوفر'}catch(e){alert(e.message)}}async function poll(){if(ride)return;try{let d=await api('/captains/me');let c=d.data; $('info').textContent='الحالة: '+c.availability+' | المستندات: '+c.documentsStatus;setTimeout(poll,5000)}catch(e){setTimeout(poll,8000)}}async function acceptRide(){if(!ride)return;try{let d=await api('/rides/'+ride._id+'/accept',{method:'POST'});ride=d.data;render()}catch(e){alert(e.message)}}async function rejectRide(){if(!ride)return;try{await api('/rides/'+ride._id+'/reject',{method:'POST'});ride=null;render()}catch(e){alert(e.message)}}async function action(a){if(!ride)return;try{let d=await api('/rides/'+ride._id+'/'+a,{method:'POST'});ride=d.data;render()}catch(e){alert(e.message)}}function render(){if(!ride){$('status').textContent='لا يوجد طلب محدد حالياً';['accept','reject','arriving','arrived','start','complete'].forEach(x=>$(x).classList.add('hidden'));return}$('status').textContent='الرحلة: '+ride.status+' | السعر: '+ride.estimatedFare;['accept','reject','arriving','arrived','start','complete'].forEach(x=>$(x).classList.add('hidden'));const map={searching:['accept','reject'],captain_assigned:['arriving'],captain_arriving:['arrived'],captain_arrived:['start'],trip_started:['complete']};(map[ride.status]||[]).forEach(x=>$(x).classList.remove('hidden'))}toggle();if(token)startLocation();</script></body></html>
