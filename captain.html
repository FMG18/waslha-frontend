<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f9f6e"><title>وصلها | كابتن</title><link rel="stylesheet" href="assets/captain-v2.css?v=1"></head><body><main class="cv2"><section id="login" class="login"><div class="loginCard"><div class="brand">وصلها<small>منصة الكابتن</small></div><h1>دخول الكابتن</h1><p class="muted">سجّل الدخول حتى تبدأ باستقبال الرحلات.</p><form id="loginForm"><div class="field"><label>رقم الهاتف</label><input id="phone" required autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"></div><button id="loginBtn" class="btn" type="submit">دخول</button><div id="loginError" class="error"></div></form></div></section><section id="app" class="hidden"><header class="top"><div class="brand">وصلها<small id="welcome">كابتن</small></div><div><button id="onlineBtn" class="online">● غير متصل</button><button id="menuBtn" class="online" aria-label="القائمة">☰</button></div><div id="menu" class="menu"><button id="locateBtn">📍 تحديث موقعي</button><button id="logoutBtn">تسجيل الخروج</button><a href="captain-center.html" style="display:block;padding:10px 14px;color:inherit;text-decoration:none">مركز الكابتن</a></div></header><div id="map" class="map"></div><section class="bottom"><div class="sheet"><div class="handle"></div><div class="statusline"><div><span id="mode" class="pill">غير متصل</span><h2 id="headline" style="margin:8px 0 0">جاهز للعمل؟</h2></div><div id="rating" class="pill">★ —</div></div><div id="offer" class="offer"><div class="statusline"><div><span class="pill">🔔 رحلة جديدة</span><h2>طلب قريب منك</h2></div><div id="countdown" class="price">15</div></div><div id="offerPrice" class="price">—</div><div class="row"><span class="dot"></span><span id="pickupText">جاري تحميل موقع الانطلاق...</span></div><div class="row"><span class="diamond"></span><span id="dropoffText">الوجهة</span></div><div id="offerMeta" class="routeInfo muted"></div><div class="actions"><button id="acceptBtn" class="btn">قبول الرحلة</button><button id="rejectBtn" class="btn dark">رفض</button></div></div><div id="ride" class="ride"><div class="empty">فعّل حالة <b>متاح للعمل</b> حتى تستقبل الرحلات.</div></div></div></section></section></main><script src="assets/app.js?v=2026.09.03"></script><script src="assets/map.js?v=1"></script><script>(async()=>{let mapApi=null,captain=null,ride=null,offer=null,coords=null,pollTimer,locTimer,countTimer;const terminal=['trip_completed','cancelled'];const norm=d=>d?.data?.ride||d?.data||d;const money=v=>Number(v||0).toLocaleString('ar-SY')+' ل.س';const $=id=>document.getElementById(id);const point=p=>p?.coordinates?[+p.coordinates[0],+p.coordinates[1]]:p?.lat!=null?[+p.lng,+p.lat]:null;function auth(){if(!token)return false;const u=user();if(u?.role!=='captain'){logout();return false}return true}function statusText(s){return{captain_assigned:'تم قبول الرحلة',captain_arriving:'في الطريق إليك',captain_arrived:'وصلت لموقع الانطلاق',trip_started:'الرحلة بدأت',trip_completed:'اكتملت الرحلة',cancelled:'أُلغيت'}[s]||s||'—'}async function init(){if(!auth())return;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='مرحباً '+(user()?.name||'كابتن');try{mapApi=await WaslhaMap.init({container:'map',center:[36.2765,33.5138],zoom:12,followDriver:false,interactive:false})}catch{}await refreshCaptain();await restoreRide();locate();clearInterval(locTimer);locTimer=setInterval(locate,15000);startPolling()}async function refreshCaptain(){try{captain=norm(await api('/captains/me'));const on=captain.availability==='online',busy=captain.availability==='busy';$('onlineBtn').textContent=busy?'● في رحلة':on?'● متاح للعمل':'● غير متصل';$('onlineBtn').classList.toggle('on',on||busy);$('onlineBtn').disabled=captain.status!=='active'||captain.documentsStatus!=='approved'||busy;$('mode').textContent=busy?'في رحلة':on?'متاح للعمل':'غير متصل';$('headline').textContent=busy?'أكمل الرحلة الحالية':on?'بانتظار طلب قريب':'فعّل التوفر لاستقبال الرحلات';$('rating').textContent='★ '+(captain.rating?.count?Number(captain.rating.average||0).toFixed(1):'جديد')}catch(e){toast(e.message)}}async function locate(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(async p=>{coords=[p.coords.longitude,p.coords.latitude];mapApi?.setDriver(p.coords.latitude,p.coords.longitude);try{await api('/captains/location',{method:'PATCH',body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude})});if(ride)drawRide()}catch{}},()=>{}, {enableHighAccuracy:true,timeout:10000,maximumAge:10000})}async function poll(){if(!token)return;if(captain?.status!=='active'||captain?.documentsStatus!=='approved')return;try{const d=await api('/rides/available');const data=d?.data||d;const r=data?.ride;if(r&&r._id&&!ride){offer=r;renderOffer(r,data.offer)}else if(!r&&offer&&!ride){clearOffer()}else if(r&&ride&&r._id===ride._id){ride=r;renderRide()}}catch{}finally{clearTimeout(pollTimer);pollTimer=setTimeout(poll,2500)}}function startPolling(){clearTimeout(pollTimer);poll()}function renderOffer(r,o){$('offer').classList.add('show');$('offerPrice').textContent=money(r.estimatedFare??r.fare);$('pickupText').textContent=r.pickup?.address||r.pickupAddress||'موقع الانطلاق';$('dropoffText').textContent=r.dropoff?.address||r.dropoffAddress||'الوجهة';$('offerMeta').textContent=(r.estimatedDistanceKm?Number(r.estimatedDistanceKm).toFixed(1)+' كم':'')+(r.estimatedDurationMinutes?' • '+r.estimatedDurationMinutes+' دقيقة':'');mapApi?.setPoints(point(r.pickup),point(r.dropoff));if(coords&&point(r.pickup))mapApi?.directions(coords,point(r.pickup)).then(x=>x&&mapApi.setRoute(x.coordinates,true));const expires=new Date(o?.expiresAt||Date.now()+15000).getTime();clearInterval(countTimer);const tick=()=>{const n=Math.max(0,Math.ceil((expires-Date.now())/1000));$('countdown').textContent=n;if(n<=0){clearInterval(countTimer);clearOffer()}};tick();countTimer=setInterval(tick,250)}function clearOffer(){offer=null;$('offer').classList.remove('show');$('countdown').textContent='15';mapApi?.clearRoute()}async function accept(){if(!offer?._id)return;const id=offer._id;setBusy($('acceptBtn'),true,'جارٍ القبول...');try{ride=norm(await api('/rides/'+id+'/accept',{method:'POST'}));localStorage.setItem('captain_ride',ride._id);clearOffer();renderRide();await refreshCaptain()}catch(e){toast(e.message);clearOffer()}finally{setBusy($('acceptBtn'),false)}}async function reject(){if(!offer?._id)return;const id=offer._id;try{await api('/rides/'+id+'/reject',{method:'POST'});clearOffer()}catch(e){toast(e.message)}}async function restoreRide(){const id=localStorage.getItem('captain_ride');if(!id)return;try{ride=norm(await api('/rides/'+id));if(terminal.includes(ride.status)){localStorage.removeItem('captain_ride');ride=null;return}renderRide()}catch{localStorage.removeItem('captain_ride')}}async function drawRide(){if(!ride||!mapApi)return;const p=point(ride.pickup),d=point(ride.dropoff);if(!p||!d)return;mapApi.setPoints(p,d);if(ride.status!=='trip_started'&&ride.status!=='trip_completed'&&coords){const r=await mapApi.directions(coords,p);if(r)mapApi.setRoute(r.coordinates,true)}}function renderRide(){if(!ride)return;const widths={captain_assigned:25,captain_arriving:40,captain_arrived:60,trip_started:80};$('ride').innerHTML='<div class="rideTitle">'+statusText(ride.status)+'</div><div class="progress"><i style="width:'+(widths[ride.status]||100)+'%"></i></div><div class="row"><span class="dot"></span><span>'+(ride.pickup?.address||ride.pickupAddress||'موقع الانطلاق')+'</span></div><div class="row"><span class="diamond"></span><span>'+(ride.dropoff?.address||ride.dropoffAddress||'الوجهة')+'</span></div><div class="routeInfo muted"><span>'+money(ride.estimatedFare??ride.fare)+'</span><span>'+(ride.estimatedDistanceKm?Number(ride.estimatedDistanceKm).toFixed(1)+' كم':'—')+'</span></div><div class="actions"><button id="rideAction" class="btn">'+({captain_assigned:'أنا في الطريق',captain_arriving:'وصلت',captain_arrived:'بدء الرحلة',trip_started:'إنهاء الرحلة'}[ride.status]||'—')+'</button><button id="cancelRide" class="btn dark">إلغاء</button></div>';if(widths[ride.status])$('rideAction').onclick=()=>rideAction({captain_assigned:'arriving',captain_arriving:'arrived',captain_arrived:'start',trip_started:'complete'}[ride.status]);$('cancelRide').onclick=cancelRide;drawRide()}async function rideAction(a){try{ride=norm(await api('/rides/'+ride._id+'/'+a,{method:'POST'}));if(ride.status==='trip_completed'){localStorage.removeItem('captain_ride');ride=null;$('ride').innerHTML='<div class="empty"><b>اكتملت الرحلة ✓</b><br>بانتظار رحلة جديدة.</div>';await refreshCaptain()}else renderRide()}catch(e){toast(e.message)}}async function cancelRide(){if(!ride)return;try{await api('/rides/'+ride._id+'/cancel',{method:'POST',body:JSON.stringify({reason:'إلغاء من الكابتن'})});localStorage.removeItem('captain_ride');ride=null;$('ride').innerHTML='<div class="empty">تم إلغاء الرحلة.</div>';await refreshCaptain()}catch(e){toast(e.message)}}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{setBusy($('loginBtn'),true,'جارٍ الدخول...');const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value.trim(),password:$('password').value})});const s=saveAuth(d.data||d);if(s?.user?.role!=='captain')throw Error('هذا الحساب ليس حساب كابتن');await init()}catch(e){$('loginError').textContent=e.message}finally{setBusy($('loginBtn'),false)}};$('onlineBtn').onclick=async()=>{try{const v=captain?.availability==='online'?'offline':'online';await api('/captains/status',{method:'PATCH',body:JSON.stringify({availability:v})});await refreshCaptain();locate()}catch(e){toast(e.message)}};$('acceptBtn').onclick=accept;$('rejectBtn').onclick=reject;$('locateBtn').onclick=locate;$('menuBtn').onclick=()=>$('menu').classList.toggle('show');$('logoutBtn').onclick=()=>logout();if(auth())init()})()</script></body></html>
