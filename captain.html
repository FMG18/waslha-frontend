<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | الكابتن</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/mobile.css"></head><body><main class="shell has-app-nav"><section id="auth" class="grid" style="padding:28px 0 60px"><div class="col-7 card"><span class="badge">منصة الكباتن</span><h1 style="font-size:clamp(35px,5vw,58px);line-height:1.12;margin:15px 0 10px">خلّ يومك أسهل، واربح بذكاء.</h1><p class="muted">استقبل الرحلات القريبة وتابع كل رحلة من لوحة واحدة.</p></div><div class="col-5 card"><h2>دخول الكابتن</h2><form id="loginForm" class="form"><div class="field"><label>رقم الهاتف</label><input id="phone" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn">دخول</button></form></div></section><section id="app" class="hidden" style="padding:18px 0 50px"><div class="card" style="margin-bottom:18px"><span id="availability" class="badge">غير متصل</span><h1 id="welcome">لوحة الكابتن</h1><p id="profile" class="muted">جارٍ التحميل...</p><div class="actions"><button id="online" class="btn">متاح للعمل</button><button id="offline" class="btn secondary">إيقاف التوفر</button></div></div><div class="grid"><div class="col-7 card" id="requests"><span class="badge">الطلبات</span><h2>رحلات جديدة</h2><div class="empty">لا توجد طلبات جديدة حالياً.</div></div><div class="col-5"><div class="card" style="margin-bottom:18px"><h3>موقعك</h3><div id="captainMap" class="mapbox" style="height:360px"></div><button id="locate" class="btn light" style="margin-top:12px">تحديث الموقع</button></div><div class="card"><span class="badge">الرحلة الحالية</span><div id="ride" class="status">لا توجد رحلة نشطة.</div><div id="rideActions" class="actions"></div></div></div></div></section></main><script src="assets/app.js"></script><script src="assets/map.js"></script><script>(async()=>{if(token&&!requireRole('captain'))return;let activeRide=null,mapApi=null,locationTimer,notifyTimer;async function load(){try{const c=(await api('/captains/me')).data;$('availability').textContent=c.availability==='online'?'● متاح':'● غير متاح';$('profile').textContent=`الحساب: ${c.status||'قيد المراجعة'} • التوفر: ${c.availability||'offline'}`}catch(e){toast(e.message)}}async function locate(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(async p=>{try{await api('/captains/location',{method:'PATCH',body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude})});window._captainPos=[p.coords.longitude,p.coords.latitude];mapApi?.setDriver(p.coords.latitude,p.coords.longitude)}catch{}},()=>toast('تعذر تحديد الموقع'),{enableHighAccuracy:true,timeout:10000,maximumAge:10000})}async function initMap(){try{mapApi=await window.WaslhaMap.init({container:'captainMap',center:[44.3661,33.3152],zoom:12,followDriver:true})}catch(e){toast('تعذر تحميل الخريطة')}}async function notifications(){if(!token)return;try{const d=await api('/notifications?unread=true&limit=20');render((d.data?.items||[]).filter(n=>n.type==='ride_requested'&&n.ride))}catch{}clearTimeout(notifyTimer);notifyTimer=setTimeout(notifications,5000)}function render(items){if(!items.length)return;$('requests').innerHTML='<span class="badge">الطلبات</span><h2>رحلات جديدة</h2>'+items.map(n=>`<div class="status"><b>${n.title||'طلب رحلة'}</b><p class="muted">${n.message||''}</p><button class="btn" data-ride="${n.ride}">قبول الرحلة</button></div>`).join('');document.querySelectorAll('[data-ride]').forEach(b=>b.onclick=()=>claim(b.dataset.ride,b))}async function claim(id,b){try{setBusy(b,true,'جارٍ القبول...');activeRide=(await api('/matching/rides/'+id+'/claim',{method:'POST'})).data;localStorage.setItem('captain_ride',id);rideView()}catch(e){toast(e.message)}finally{setBusy(b,false)}}async function restore(){const id=localStorage.getItem('captain_ride');if(!id)return;try{activeRide=(await api('/rides/'+id)).data;rideView()}catch{localStorage.removeItem('captain_ride')}}function rideView(){const r=activeRide;if(!r)return;$('ride').innerHTML=`<b>${statusLabel(r.status)}</b><br>السعر: ${money(r.estimatedFare)}<br><span class="muted">${r.pickup?.address||'الانطلاق'} ← ${r.dropoff?.address||'الوصول'}</span>`;const a={captain_assigned:['arriving','أنا في الطريق'],captain_arriving:['arrived','وصلت'],captain_arrived:['start','بدء الرحلة'],trip_started:['complete','إنهاء الرحلة']}[r.status];$('rideActions').innerHTML=a?`<button class="btn" id="rideAction">${a[1]}</button>`:'';if(a)$('rideAction').onclick=()=>rideAction(a[0])}async function rideAction(action){try{activeRide=(await api('/rides/'+activeRide._id+'/'+action,{method:'POST'})).data;rideView();if(activeRide.status==='trip_completed'){localStorage.removeItem('captain_ride');activeRide=null;$('ride').textContent='اكتملت الرحلة'}}catch(e){toast(e.message)}}async function show(){const ok=!!token;$('auth').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok);if(!ok)return;$('welcome').textContent='مرحباً '+(user()?.name||'كابتن');await load();await initMap();await restore();await locate();clearInterval(locationTimer);locationTimer=setInterval(locate,15000);notifications()}$('loginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;try{setBusy(b,true,'جارٍ الدخول...');const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value.trim(),password:$('password').value})});if(d.data?.user?.role!=='captain')throw Error('هذا الحساب ليس حساب كابتن');saveAuth(d.data);history.replaceState(null,'','captain.html');await show()}catch(e){toast(e.message)}finally{setBusy(b,false)}};$('online').onclick=()=>api('/captains/status',{method:'PATCH',body:JSON.stringify({availability:'online'})}).then(load).catch(e=>toast(e.message));$('offline').onclick=()=>api('/captains/status',{method:'PATCH',body:JSON.stringify({availability:'offline'})}).then(load).catch(e=>toast(e.message));$('locate').onclick=locate;await show()})()</script></body></html>
