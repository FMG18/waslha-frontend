<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>وصلها - تطبيق الكابتن</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #f8f9fa; overflow: hidden; }
    #map { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* شريط الحالة العلوي */
    .top-bar {
      position: absolute; top: 15px; left: 15px; right: 15px; background: white;
      padding: 12px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: flex; justify-content: space-between; align-items: center; z-index: 10;
    }
    .status-toggle { display: flex; align-items: center; gap: 8px; font-weight: bold; }
    
    /* بطاقة استقبال الطلب */
    #request-card {
      display: none; position: absolute; bottom: 20px; left: 20px; right: 20px;
      background: white; border-radius: 16px; padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2); z-index: 20; text-align: center;
      animation: slideUp 0.3s ease-out;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .req-title { color: #28a745; margin-top: 0; font-size: 18px; }
    .req-details { display: flex; justify-content: space-around; background: #f8f9fa; padding: 10px; border-radius: 10px; margin: 15px 0; }
    .req-details div { font-weight: bold; font-size: 14px; }

    .btn-group { display: flex; gap: 10px; }
    .btn-accept { flex: 2; padding: 14px; background: #28a745; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }
    .btn-reject { flex: 1; padding: 14px; background: #dc3545; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; }

    /* بطاقة الرحلة الحالية */
    #active-trip-card {
      display: none; position: absolute; bottom: 20px; left: 20px; right: 20px;
      background: #1e293b; color: white; border-radius: 16px; padding: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3); z-index: 20; text-align: center;
    }
    .btn-finish { width: 100%; padding: 14px; background: #0d6efd; color: white; border: none; border-radius: 10px; font-weight: bold; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- الشريط العلوي -->
  <div class="top-bar">
    <div class="status-toggle">
      <span id="status-text" style="color:#28a745;">أونلاين (مستعد للطلبات)</span>
    </div>
    <div style="font-size:12px; color:#6c757d;">كابتن #101</div>
  </div>

  <!-- بطاقة إشعار الطلب الجديد -->
  <div id="request-card">
    <h3 class="req-title">وصلك طلب توصيل جديد! 🚕</h3>
    <div class="req-details">
      <div>المسافة: <span id="req-dist">--</span> كم</div>
      <div>الوجهة: ممر محدد</div>
    </div>
    <div class="btn-group">
      <button class="btn-accept" onclick="acceptTrip()">قبول الطلب</button>
      <button class="btn-reject" onclick="rejectTrip()">رفض</button>
    </div>
  </div>

  <!-- بطاقة متابعة الرحلة الحالية -->
  <div id="active-trip-card">
    <h4 style="margin:0 0 10px 0; color:#4ade80;">الرحلة قيد التنفيذ 📍</h4>
    <p style="margin: 5px 0; font-size:14px;">يتوجب عليك التوجه إلى موقع الزبون المحدد</p>
    <button class="btn-finish" onclick="finishTrip()">إنهاء الرحلة بنجاح</button>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoibm9tYWlsODg4ODkyIiwiYSI6ImNtdGZ2YnJ3NzA5eWsyd3BpdWNhaHR1b20ifQ.fBcCDKO-onzZat5QFZSDFw';

    let captainLat = 33.5138, captainLng = 36.2913; // موقع افتراضي (دمشق)
    let currentRequest = null;
    let customerMarker = null;

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v11',
      center: [captainLng, captainLat],
      zoom: 13
    });

    const captainMarker = new mapboxgl.Marker({ color: '#0d6efd' })
      .setLngLat([captainLng, captainLat])
      .addTo(map);

    const socket = io('https://waslha-backend.vercel.app', { transports: ['websocket', 'polling'] });

    // تحديث موقع الكابتن
    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(pos => {
        captainLat = pos.coords.latitude;
        captainLng = pos.coords.longitude;
        captainMarker.setLngLat([captainLng, captainLat]);
        socket.emit('updateLocation', { captainId: 'cap_101', lat: captainLat, lng: captainLng });
      });
    }

    // استقبال طلب جديد من الزبون
    socket.on('newRideRequest', (data) => {
      currentRequest = data;
      document.getElementById('req-dist').innerText = data.distanceKm || '2.5';
      document.getElementById('request-card').style.display = 'block';

      // وضع علامة موقع الزبون على خريطة الكابتن
      if(data.pickup) {
        if(customerMarker) customerMarker.remove();
        customerMarker = new mapboxgl.Marker({ color: '#dc3545' })
          .setLngLat([data.pickup.lng, data.pickup.lat])
          .addTo(map);
        map.flyTo({ center: [data.pickup.lng, data.pickup.lat], zoom: 14 });
      }
    });

    // قبول الرحلة
    function acceptTrip() {
      document.getElementById('request-card').style.display = 'none';
      document.getElementById('active-trip-card').style.display = 'block';

      socket.emit('acceptRide', {
        captainId: 'cap_101',
        name: 'أحمد السوري',
        customerId: currentRequest ? currentRequest.customerId : null
      });
    }

    // رفض الرحلة
    function rejectTrip() {
      document.getElementById('request-card').style.display = 'none';
      if(customerMarker) customerMarker.remove();
    }

    // إنهاء الرحلة
    function finishTrip() {
      document.getElementById('active-trip-card').style.display = 'none';
      if(customerMarker) customerMarker.remove();
      alert('تم إنهاء الرحلة بنجاح!');
    }
  </script>
</body>
</html>
