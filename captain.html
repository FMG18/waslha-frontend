<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | لوحة الكابتن</title><link rel="stylesheet" href="assets/style.css?v=2026.09.01"><link rel="stylesheet" href="assets/mobile.css?v=2026.09.01"></head><body><main class="shell has-app-nav"><section id="auth" class="grid" style="padding:28px 0 60px"><div class="col-7 card"><span class="badge">منصة الكباتن</span><h1 style="font-size:clamp(35px,5vw,58px);line-height:1.12;margin:15px 0 10px">خلّ يومك أسهل، واربح بذكاء.</h1><p class="muted">استقبل الرحلات القريبة وتابع كل رحلة من لوحة واحدة.</p><a href="captain-register.html" class="btn secondary" style="display:inline-block;text-decoration:none;margin-top:15px">إنشاء حساب كابتن</a></div><div class="col-5 card"><h2>دخول الكابتن</h2><form id="loginForm" class="form"><div class="field"><label>رقم الهاتف</label><input id="phone" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="btn">دخول</button></form></div></section><section id="app" class="hidden" style="padding:18px 0 50px"><div class="card" style="margin-bottom:18px"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><div><span id="availability" class="badge">غير متصل</span><h1 id="welcome">لوحة الكابتن</h1><p id="profile" class="muted">جارٍ التحميل...</p></div><div class="actions"><button id="online" class="btn">متاح للعمل</button><button id="offline" class="btn secondary">إيقاف التوفر</button><button id="logout" class="btn light">خروج</button></div></div></div><div class="grid"><div class="col-7 card" id="requests"><span class="badge">الطلبات</span><h2>رحلات جديدة</h2><div class="empty">لا توجد طلبات جديدة حالياً.</div></div><div class="col-5"><div class="grid"><div class="col-6 card"><small class="muted">رحلات اليوم</small><h2 id="statRides">—</h2></div><div class="col-6 card"><small class="muted">التقييم</small><h2 id="statRating">—</h2></div></div><div class="card" style="margin:18px 0"><h3>موقعك</h3><div id="captainMap" class="mapbox" style="height:360px"></div><button id="locate" class="btn light" style="margin-top:12px">تحديث الموقع</button></div><div class="card"><span class="badge">الرحلة الحالية</span><div id="ride" class="status">لا توجد رحلة نشطة.</div><div id="rideActions" class="actions"></div></div></div></div></section></main><script src="assets/app.js?v=2026.09.01"></script><script src="assets/map.js?v=2026.09.01"></script><script>(async()=>{let mapApi=null,activeRide=null,locationTimer,notifyTimer;const terminal=['trip_completed','cancelled'];const norm=d=>d?.data?.ride||d?.data||d;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('ar-IQ')+' د.ع';function loginView(){if(!token)return false;const u=user();if(u?.role!=='captain'){toast('هذا القسم مخصص للكباتن');logout();return false}return true}async function load(){try{const c=norm(await api('/captains/me'));$('availability').textContent=c.availability==='online'?'● متاح للعمل':c.availability==='busy'?'● في رحلة':'● غير متصل';$('profile').textContent=`الحساب: ${c.status==='active'?'مفعل':c.status==='pending'?'قيد المراجعة':'موقوف'} • التوثيق: ${c.documentsStatus||'غير مقدم'}${c.vehicle?.make?' • المركبة: '+c.vehicle.make+' '+(c.vehicle.model||''):''}`;$('statRating').textContent=c.rating?.count?`${Number(c.rating.average||0).toFixed(1)} ★`:'جديد';$('online').disabled=c.status!=='active';$('online').title=c.status!=='active'?'يجب تفعيل الحساب أولاً':''}catch(e){toast(e.message)}}async function locate(){if(!navigator.geolocation)return toast('المتصفح لا يدعم الموقع');navigator.geolocation.getCurrentPosition(async p=>{try{await api('/captains/location',{method:'PATCH',body:JSON.stringify({lat:p.coords.latitude,lng:p.coords.longitude})});mapApi?.setDriver(p.coords.latitude,p.coords.longitude)}catch(e){toast(e.message)}},()=>toast('تعذر تحديد الموقع'),{enableHighAccuracy:true,timeout:10000,maximumAge:10000})}async function initMap(){try{mapApi=await window.WaslhaMap.init({container:'captainMap',center:[44.3661,33.3152],zoom:12,followDriver:true})}catch{toast('تعذر تحميل الخريطة')}}async function notifications(){if(!token)return;try{const d=await api('/notifications?unread=true&limit=30');const items=d.data?.items||d.data||[];render(items.filter(n=>n.type==='ride_requested'&&n.ride))}catch{}clearTimeout(notifyTimer);notifyTimer=setTimeout(notifications,5000)}function render(items){if(!items.length)return;$('requests').innerHTML='<span class="badge">طلبات جديدة</span><h2>رحلات قريبة</h2>'+items.map(n=>`<div class="status"><b>${esc(n.title||'طلب رحلة')}</b><p class="muted">${esc(n.message||'يوجد طلب جديد قريب منك')}</p><button class="btn" data-ride="${esc(n.ride)}">قبول الرحلة</button></div>`).join('');document.querySelectorAll('[data-ride]').forEach(b=>b.onclick=()=>claim(b.dataset.ride,b))}async function claim(id,b){try{setBusy(b,true,'جارٍ القبول...');activeRide=norm(await api('/rides/'+id+'/accept',{method:'POST'}));localStorage.setItem('captain_ride',activeRide._id||id);rideView()}catch(e){toast(e.message)}finally{setBusy(b,false)}}async function restore(){const id=localStorage.getItem('captain_ride');if(!id)return;try{activeRide=norm(await api('/rides/'+id));if(terminal.includes(activeRide.status))return localStorage.removeItem('captain_ride');rideView()}catch{localStorage.removeItem('captain_ride')}}function rideView(){const r=activeRide;if(!r)return;$('ride').innerHTML=`<b>${esc(statusLabel(r.status))}</b><br>السعر: ${esc(money(r.estimatedFare??r.fare))}<br><span class="muted">${esc(r.pickup?.address||r.pickupAddress||'الانطلاق')} ← ${esc(r.dropoff?.address||r.dropoffAddress||'الوجهة')}</span>`;const a={captain_assigned:['arriving','أنا في الطريق'],captain_arriving:['arrived','وصلت'],captain_arrived:['start','بدء الرحلة'],trip_started:['complete','إنهاء الرحلة']}[r.status];$('rideActions').innerHTML=a?`<button class="btn" id="rideAction">${a[1]}</button><button class="btn secondary" id="cancelRide">إلغاء</button>`:'';if(a)$('rideAction').onclick=()=>rideAction(a[0]);$('cancelRide')?.addEventListener('click',cancelRide)}async function rideAction(action){try{activeRide=norm(await api('/rides/'+activeRide._id+'/'+action,{method:'POST'}));if(activeRide.status==='trip_completed'){localStorage.removeItem('captain_ride');activeRide=null;$('ride').innerHTML='<b>اكتملت الرحلة ✓</b>';$('rideActions').innerHTML=''}else rideView()}catch(e){toast(e.message)}}async function cancelRide(){if(!activeRide?._id)return;try{activeRide=norm(await api('/rides/'+activeRide._id+'/cancel',{method:'POST'}));localStorage.removeItem('captain_ride');rideView()}catch(e){toast(e.message)}}async function show(){if(!loginView())return;const u=user();$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='مرحباً '+(u?.name||'كابتن');await load();await initMap();await restore();await locate();clearInterval(locationTimer);locationTimer=setInterval(locate,15000);notifications()}$('loginForm').onsubmit=async e=>{e.preventDefault();const b=$('loginBtn');try{setBusy(b,true,'جارٍ الدخول...');const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value.trim(),password:$('password').value})});const saved=saveAuth(d.data||d),r=saved?.user?.role;if(r!=='captain')throw Error('هذا الحساب ليس حساب كابتن');await show()}catch(e){toast(e.message)}finally{setBusy(b,false)}};$('online').onclick=()=>api('/captains/status',{method:'PATCH',body:JSON.stringify({availability:'online'})}).then(load).catch(e=>toast(e.message));$('offline').onclick=()=>api('/captains/status',{method:'PATCH',body:JSON.stringify({availability:'offline'})}).then(load).catch(e=>toast(e.message));$('locate').onclick=locate;$('logout').onclick=logout;if(token)await show()})()</script></body></html>
