<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | طلب الانضمام ككابتن</title><link rel="stylesheet" href="assets/style.css?v=2026.09.01"><link rel="stylesheet" href="assets/mobile.css?v=2026.09.01"></head><body><main class="shell"><section class="grid" style="min-height:100vh;align-items:center;padding:22px 0"><div class="col-5"><div class="card"><span class="badge">انضم إلى وصلها</span><h1 style="font-size:42px;margin:12px 0">ابدأ مشوارك معنا.</h1><p class="muted" style="line-height:2">أنشئ حسابك وأكمل بيانات المركبة. سيبقى الحساب قيد المراجعة حتى توافق الإدارة.</p><div class="status" style="margin-top:18px"><b>مراحل الانضمام</b><p class="muted">الحساب ← المركبة ← مراجعة الإدارة ← التفعيل</p></div></div></div><div class="col-7"><div class="card"><h2>طلب كابتن جديد</h2><form id="form" class="form"><div class="grid"><div class="col-6"><div class="field"><label>الاسم الكامل</label><input id="name" required minlength="2" maxlength="80"></div></div><div class="col-6"><div class="field"><label>رقم الهاتف</label><input id="phone" required inputmode="tel"></div></div></div><div class="grid"><div class="col-6"><div class="field"><label>كلمة المرور</label><input id="password" required minlength="8" type="password"></div></div><div class="col-6"><div class="field"><label>تأكيد كلمة المرور</label><input id="confirm" required minlength="8" type="password"></div></div></div><div class="field"><label>نوع الخدمة</label><select id="vehicleType"><option value="taxi">🚕 سيارة</option><option value="motorcycle">🏍️ دراجة</option><option value="delivery">📦 توصيل</option></select></div><div class="grid"><div class="col-6"><div class="field"><label>ماركة المركبة</label><input id="make" required maxlength="80"></div></div><div class="col-6"><div class="field"><label>الموديل</label><input id="model" required maxlength="80"></div></div></div><div class="field"><label>رقم اللوحة</label><input id="plate" required maxlength="30"></div><button id="submit" class="btn" type="submit">إرسال الطلب</button><div id="status" class="muted" style="min-height:22px;text-align:center"></div></form><a href="index.html" class="rides-link">العودة لتسجيل الدخول ←</a></div></div></section></main><script src="assets/app.js?v=2026.09.01"></script><script>const $=id=>document.getElementById(id);$('form').onsubmit=async e=>{e.preventDefault();const b=$('submit'),s=$('status');if($('password').value!==$('confirm').value){s.textContent='كلمتا المرور غير متطابقتين.';return}const vehicle={type:$('vehicleType').value,make:$('make').value.trim(),model:$('model').value.trim(),plateNumber:$('plate').value.trim()};try{setBusy(b,true,'جارٍ إنشاء الحساب...');const d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:$('name').value.trim(),phone:$('phone').value.trim(),password:$('password').value,role:'captain'})});const saved=saveAuth(d.data||d);if(saved?.user?.role!=='captain')throw Error('تعذر إنشاء حساب كابتن');await api('/captains/profile',{method:'PATCH',body:JSON.stringify({vehicle})});s.textContent='✓ تم إرسال الطلب وحفظ بيانات المركبة. الحساب بانتظار مراجعة الإدارة.';setTimeout(()=>location.replace('captain.html'),700)}catch(e){s.textContent=e.message||'تعذر إرسال الطلب'}finally{setBusy(b,false)}};</script></body></html>
