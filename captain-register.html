<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | انضم ككابتن</title><link rel="stylesheet" href="assets/style.css?v=2026.09.01"><link rel="stylesheet" href="assets/mobile.css?v=2026.09.01"></head><body><main class="shell"><section class="grid" style="min-height:100vh;align-items:center;padding:22px 0"><div class="col-5"><div class="card"><span class="badge">منصة الكباتن</span><h1 style="margin:12px 0">انضم إلى وصلها</h1><p class="muted">سجّل حساب كابتن الآن. بعد التسجيل يظهر حسابك ككابتن ويمكن استكمال بيانات المركبة من لوحة الكابتن.</p><div class="status" style="margin-top:18px"><b>قبل البدء</b><p class="muted">استخدم رقم هاتف صحيح وكلمة مرور لا تقل عن 8 أحرف.</p></div></div></div><div class="col-7"><div class="card"><h2>تقديم كابتن</h2><form id="form" class="form"><div class="field"><label>الاسم الكامل</label><input id="name" required minlength="2" placeholder="اسمك الكامل"></div><div class="field"><label>رقم الهاتف</label><input id="phone" required inputmode="tel" placeholder="07xxxxxxxxx"></div><div class="field"><label>كلمة المرور</label><input id="password" required minlength="8" type="password" placeholder="8 أحرف أو أكثر"></div><div class="field"><label>تأكيد كلمة المرور</label><input id="confirm" required minlength="8" type="password"></div><button id="submit" class="btn" type="submit">إرسال الطلب</button><div id="status" class="muted" style="min-height:22px;text-align:center"></div></form><a href="index.html" class="rides-link">لديك حساب؟ تسجيل الدخول ←</a></div></div></section></main><script src="assets/app.js?v=2026.09.01"></script><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),s=document.getElementById('status');if(document.getElementById('password').value!==document.getElementById('confirm').value){s.textContent='كلمتا المرور غير متطابقتين.';return}try{setBusy(b,true,'جارٍ إنشاء الطلب...');const d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),password:document.getElementById('password').value,role:'captain'})});saveAuth(d.data||d);s.textContent='✓ تم إنشاء حساب الكابتن. جارٍ فتح لوحة الكابتن...';setTimeout(()=>location.replace('captain.html'),500)}catch(e){s.textContent=e.message||'تعذر إرسال الطلب'}finally{setBusy(b,false)}};</script></body></html>
