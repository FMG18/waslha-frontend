<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | طلب الانضمام ككابتن</title><link rel="stylesheet" href="assets/style.css?v=2026.09.02"><link rel="stylesheet" href="assets/mobile.css?v=2026.09.02"></head><body><main class="shell"><section class="grid" style="min-height:100vh;align-items:center;padding:22px 0"><div class="col-5"><div class="card"><span class="badge">انضم إلى وصلها</span><h1 style="font-size:42px;margin:12px 0">ابدأ مشوارك معنا.</h1><p class="muted" style="line-height:2">أنشئ حسابك وأرسل بيانات مركبتك مرة واحدة. سيبقى الحساب قيد المراجعة حتى توافق الإدارة.</p><div class="status" style="margin-top:18px"><b>مراحل الانضمام</b><p class="muted">الحساب ← المركبة ← الوثائق ← مراجعة الإدارة ← التفعيل</p></div></div></div><div class="col-7"><div class="card"><h2>طلب كابتن جديد</h2><form id="form" class="form" novalidate><div class="grid"><div class="col-6"><div class="field"><label>الاسم الكامل</label><input id="name" required minlength="2" maxlength="80" autocomplete="name"></div></div><div class="col-6"><div class="field"><label>رقم الهاتف</label><input id="phone" required inputmode="tel" autocomplete="tel"></div></div></div><div class="grid"><div class="col-6"><div class="field"><label>كلمة المرور</label><input id="password" required minlength="8" type="password" autocomplete="new-password"></div></div><div class="col-6"><div class="field"><label>تأكيد كلمة المرور</label><input id="confirm" required minlength="8" type="password" autocomplete="new-password"></div></div></div><div class="field"><label>نوع الخدمة</label><select id="vehicleType"><option value="taxi">🚕 سيارة</option><option value="motorcycle">🏍️ دراجة</option><option value="delivery">📦 توصيل</option></select></div><div class="grid"><div class="col-6"><div class="field"><label>ماركة المركبة</label><input id="make" required maxlength="80"></div></div><div class="col-6"><div class="field"><label>الموديل</label><input id="model" required maxlength="80"></div></div></div><div class="field"><label>رقم اللوحة</label><input id="plate" required maxlength="30"></div><button id="submit" class="btn" type="submit">إرسال الطلب</button><div id="status" class="muted" style="min-height:44px;text-align:center;margin-top:10px"></div></form><a href="captain-login.html" class="rides-link">لديك حساب ككابتن؟ تسجيل الدخول ←</a></div></div></section></main><script>(()=>{'use strict';const API='https://waslha-backend.vercel.app/api';const $=id=>document.getElementById(id);const form=$('form'),button=$('submit'),status=$('status');let sending=false;const message=t=>{status.textContent=t};form.addEventListener('submit',async e=>{e.preventDefault();e.stopImmediatePropagation();if(sending)return false;const name=$('name').value.trim(),phone=$('phone').value.trim(),password=$('password').value,confirm=$('confirm').value,make=$('make').value.trim(),model=$('model').value.trim(),plate=$('plate').value.trim();if(!name||name.length<2||!phone||!password||password.length<8||!make||!model||!plate){message('⚠️ يرجى إكمال جميع الحقول بشكل صحيح.');return false}if(password!==confirm){message('⚠️ كلمتا المرور غير متطابقتين.');return false}sending=true;button.disabled=true;button.textContent='جارٍ إرسال الطلب...';message('جارٍ إرسال طلبك إلى الخادم...');try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);const r=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({name,phone,password,role:'captain',vehicle:{type:$('vehicleType').value,make,model,plateNumber:plate}}),signal:controller.signal});clearTimeout(timeout);let d={};try{d=await r.json()}catch{}if(!r.ok){const err=d?.error?.message||d?.message||d?.error||`فشل التسجيل (${r.status})`;throw new Error(err)}const p=d.data||d;if(p.token)localStorage.setItem('waslha_token',p.token);if(p.user)localStorage.setItem('waslha_user',JSON.stringify(p.user));message('✓ تم إرسال طلبك بنجاح. حسابك الآن قيد مراجعة الإدارة.');button.textContent='تم إرسال الطلب';setTimeout(()=>location.href='captain.html',1200)}catch(err){message(err.name==='AbortError'?'انتهت مهلة الاتصال بالخادم. حاول مرة أخرى.':`❌ ${err.message||'تعذر إرسال الطلب'}`);button.disabled=false;button.textContent='إرسال الطلب';sending=false}});})();</script></body></html>
