name: Fix Mapbox Destination Request

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Patch destination coordinates
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/waslha/app/MainActivity.kt')
          s = p.read_text()
          old = 'destination = selected.coordinates,\n                                    vehicleType'
          new = 'destination = mapDestination ?: selected.coordinates,\n                                    vehicleType'
          if old not in s:
              raise SystemExit('destination request line not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/waslha/app/MainActivity.kt
          git commit -m "fix: submit selected Mapbox destination" 
          git push
          git rm .github/workflows/mapbox-request-fix.yml
          git commit -m "chore: remove one-time Mapbox request fix"
          git push
