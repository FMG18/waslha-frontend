name: Waslha Captain Android

on:
  push:
    paths:
      - 'captain/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-captain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore persistent Captain signing key
        shell: bash
        env:
          WASLHA_KEYSTORE_BASE64: ${{ secrets.WASLHA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$WASLHA_KEYSTORE_BASE64"
          printf '%s' "$WASLHA_KEYSTORE_BASE64" | base64 --decode > captain/waslha-captain-release.keystore
          test -s captain/waslha-captain-release.keystore

      - name: Build signed Captain release APK
        env:
          WASLHA_KEYSTORE_PATH: waslha-captain-release.keystore
          WASLHA_KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          WASLHA_KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
          WASLHA_KEY_PASSWORD: ${{ secrets.WASLHA_KEY_PASSWORD }}
        run: gradle :captain:assembleRelease --stacktrace

      - name: Verify Captain APK signature
        shell: bash
        env:
          WASLHA_KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          WASLHA_KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="$(find captain/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          test -n "$apk"
          echo "Found signed APK: $apk"
          apksigner=$(find "$ANDROID_HOME" -type f -name apksigner | head -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Prepare Captain APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find captain/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "No signed Captain APK found"
            find captain/build/outputs -type f -maxdepth 5 || true
            exit 1
          fi
          cp "$apk" captain/build/outputs/apk/release/waslha-captain-beta.apk

      - name: Upload Captain APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-captain-beta
          path: captain/build/outputs/apk/release/waslha-captain-beta.apk
          if-no-files-found: error
