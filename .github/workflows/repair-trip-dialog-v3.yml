name: Repair Trip Dialog V3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Remove duplicate MainActivity dialog
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/main/java/com/waslha/app/MainActivity.kt')
          s = p.read_text()

          marker = '@Composable\nprivate fun CancelTripDialog('
          start = s.find(marker)
          if start != -1:
              end = s.find('\n@Composable\nprivate fun TripsScreen(', start)
              if end == -1:
                  raise SystemExit('Could not find end of MainActivity CancelTripDialog block')
              s = s[:start] + s[end + 1:]

          old = '''onConfirm = {\n                cancelOpen = false\n                val trip = (state as? TripUiState.Success)?.trip ?: return@CancelTripDialog\n                onCancel(trip.id, it)\n            }'''
          new = '''onConfirm = { reason ->\n                cancelOpen = false\n                val trip = (state as? TripUiState.Success)?.trip ?: return@CancelTripDialog\n                onCancel(trip.id, reason)\n            }'''
          if old not in s:
              raise SystemExit('Expected cancel callback was not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/waslha/app/MainActivity.kt
          git commit -m 'fix: remove duplicate cancel trip dialog' || exit 0
          git push origin main
      - name: Remove temporary repair workflows
        shell: bash
        run: |
          git rm .github/workflows/repair-trip-dialog.yml .github/workflows/repair-trip-dialog-v3.yml 2>/dev/null || true
          git commit -m 'chore: remove temporary trip dialog repair workflows' || exit 0
          git push origin main
