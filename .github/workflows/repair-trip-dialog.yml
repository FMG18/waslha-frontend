name: Repair Trip Dialog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Repair duplicate dialog and lambda
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/waslha/app/MainActivity.kt')
          s = p.read_text()

          marker = '@Composable\nprivate fun CancelTripDialog('
          starts = [m.start() for m in re.finditer(re.escape(marker), s)]
          if len(starts) < 2:
              raise SystemExit(f'Expected duplicate CancelTripDialog, found {len(starts)}')

          second = starts[1]
          next_marker = s.find('\n@Composable\n', second + len(marker))
          if next_marker == -1:
              raise SystemExit('Could not find end of duplicate dialog')
          s = s[:second] + s[next_marker + 1:]

          s = s.replace('onConfirm = {\n                cancelOpen = false\n                val trip = (state as? TripUiState.Success)?.trip ?: return@CancelTripDialog\n                onCancel(trip.id, it)\n            }',
                        'onConfirm = { reason ->\n                cancelOpen = false\n                val trip = (state as? TripUiState.Success)?.trip ?: return@CancelTripDialog\n                onCancel(trip.id, reason)\n            }', 1)

          p.write_text(s)
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/waslha/app/MainActivity.kt
          git commit -m 'fix: remove duplicate trip dialog definition' || exit 0
          git push origin main
      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-trip-dialog.yml
          git commit -m 'chore: remove one-time trip dialog repair workflow'
          git push origin main
