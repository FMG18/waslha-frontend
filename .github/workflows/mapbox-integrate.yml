name: Integrate Mapbox Ride Map

on:
  push:
    branches: [main]

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Integrate Mapbox into passenger home
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/src/main/java/com/waslha/app/MainActivity.kt')
          s = p.read_text()

          s = s.replace(
              'var locationDenied by remember { mutableStateOf(false) }\n    val locationScope',
              'var locationDenied by remember { mutableStateOf(false) }\n    var mapDestination by remember { mutableStateOf<Coordinates?>(null) }\n    val locationScope',
              1
          )

          s = s.replace(
              'onDestination = { destinationOpen = true },\n                    onRefreshLocation',
              'onDestination = { destinationOpen = true },\n                    mapDestination = mapDestination,\n                    onMapDestinationPicked = { mapDestination = it },\n                    onRefreshLocation',
              1
          )

          s = s.replace(
              'destination = selected,\n                                    vehicleType',
              'destination = mapDestination ?: selected.coordinates,\n                                    vehicleType',
              1
          )

          s = s.replace(
              'onSelect = { destination = it; destinationOpen = false }',
              'onSelect = { destination = it; mapDestination = it.coordinates; destinationOpen = false }',
              1
          )

          s = s.replace(
              '    destination: PlaceOption?,\n    pickup: Coordinates,',
              '    destination: PlaceOption?,\n    mapDestination: Coordinates?,\n    pickup: Coordinates,',
              1
          )

          s = s.replace(
              '    onDestination: () -> Unit,\n    onRefreshLocation:',
              '    onDestination: () -> Unit,\n    onMapDestinationPicked: (Coordinates) -> Unit,\n    onRefreshLocation:',
              1
          )

          old = '''        Box(Modifier.fillMaxWidth().weight(1f).background(MapBg)) {\n            Column(Modifier.align(Alignment.Center), horizontalAlignment = Alignment.CenterHorizontally) {\n                Box(Modifier.size(94.dp).background(Green.copy(alpha = .14f), CircleShape), Alignment.Center) {\n                    Icon(Icons.Default.LocationOn, null, tint = Green, modifier = Modifier.size(52.dp))\n                }\n                Spacer(Modifier.height(12.dp))\n                Text("موقع الانطلاق", fontWeight = FontWeight.Black, color = Ink, fontSize = 18.sp)\n                Text("${"%.4f".format(pickup.lat)} • ${"%.4f".format(pickup.lng)}", color = Muted, fontSize = 10.sp)\n            }\n            Row(Modifier.fillMaxWidth().padding(14.dp), verticalAlignment = Alignment.CenterVertically) {\n'''
          new = '''        Box(Modifier.fillMaxWidth().weight(1f)) {\n            WaslhaRideMap(\n                pickup = pickup,\n                destination = mapDestination ?: destination?.coordinates,\n                modifier = Modifier.fillMaxSize(),\n                onDestinationPicked = onMapDestinationPicked\n            )\n            Row(Modifier.fillMaxWidth().padding(14.dp), verticalAlignment = Alignment.CenterVertically) {\n'''
          if old not in s:
              raise SystemExit('Home map placeholder block not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/waslha/app/MainActivity.kt
          git commit -m "feat: integrate interactive Mapbox ride map" || true
          git push
          git rm .github/workflows/mapbox-integrate.yml
          git commit -m "chore: remove one-time Mapbox integration workflow"
          git push
