name: Build Android APK

on:
  push:
    branches: [main, fix/google-sha-fingerprints]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '402670996635-cojr4khl41le3ermkojkojdkv03arpd6.apps.googleusercontent.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Mapbox token resource
        shell: bash
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN" || { echo "MAPBOX_PUBLIC_TOKEN is not configured in repository variables"; exit 1; }
          mkdir -p app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' "    <string name=\"mapbox_access_token\" translatable=\"false\">${MAPBOX_PUBLIC_TOKEN}</string>" '</resources>' > app/src/main/res/values/mapbox_access_token.xml

      - name: Prepare Google web client ID resource
        shell: bash
        run: |
          test -n "$GOOGLE_WEB_CLIENT_ID" || { echo "GOOGLE_WEB_CLIENT_ID is empty"; exit 1; }
          mkdir -p app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' "    <string name=\"google_web_client_id\" translatable=\"false\">${GOOGLE_WEB_CLIENT_ID}</string>" '</resources>' > app/src/main/res/values/google_auth.xml
          echo "Google Web Client ID configured."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Print APK signing fingerprints
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK" || { echo "Debug APK not found"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)
          test -n "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          echo "=== APK ==="
          echo "$APK"
          echo "=== SIGNING CERTIFICATES ==="
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-debug-apk
          path: app/build/outputs/apk/debug/*.apk
