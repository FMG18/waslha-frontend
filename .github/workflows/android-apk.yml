name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Mapbox token resource
        shell: bash
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN" || { echo "MAPBOX_PUBLIC_TOKEN is not configured in repository variables"; exit 1; }
          mkdir -p app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' "    <string name=\"mapbox_access_token\" translatable=\"false\">${MAPBOX_PUBLIC_TOKEN}</string>" '</resources>' > app/src/main/res/values/mapbox_access_token.xml
      - name: Prepare Google web client ID resource
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          mkdir -p app/src/main/res/values
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            python3 - <<'PY'
            from pathlib import Path
            import os
            value = os.environ["GOOGLE_WEB_CLIENT_ID"].replace("&", "&amp;").replace("<", "&lt;").replace("\"", "&quot;")
            Path("app/src/main/res/values/google_auth.xml").write_text(
                '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
                f'    <string name="google_web_client_id" translatable="false">{value}</string>\n'
                '</resources>\n', encoding="utf-8"
            )
            PY
          else
            echo "GOOGLE_WEB_CLIENT_ID is not configured; Google sign-in will remain disabled at runtime."
          fi
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-debug-apk
          path: app/build/outputs/apk/debug/*.apk
