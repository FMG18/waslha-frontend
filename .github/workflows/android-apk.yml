name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Mapbox token resource
        shell: bash
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN" || { echo "MAPBOX_PUBLIC_TOKEN is not configured in repository variables"; exit 1; }
          mkdir -p app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' "    <string name=\"mapbox_access_token\" translatable=\"false\">${MAPBOX_PUBLIC_TOKEN}</string>" '</resources>' > app/src/main/res/values/mapbox_access_token.xml

      - name: Prepare Google web client ID resource
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$GOOGLE_WEB_CLIENT_ID" || { echo "GOOGLE_WEB_CLIENT_ID is not configured in repository variables"; exit 1; }
          mkdir -p app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' "    <string name=\"google_web_client_id\" translatable=\"false\">${GOOGLE_WEB_CLIENT_ID}</string>" '</resources>' > app/src/main/res/values/google_auth.xml

      - name: Prepare stable release signing
        shell: bash
        env:
          WASLHA_KEYSTORE_BASE64: ${{ secrets.WASLHA_KEYSTORE_BASE64 }}
          WASLHA_KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          WASLHA_KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
          WASLHA_KEY_PASSWORD: ${{ secrets.WASLHA_KEY_PASSWORD }}
        run: |
          test -n "$WASLHA_KEYSTORE_BASE64" || { echo "Missing WASLHA_KEYSTORE_BASE64"; exit 1; }
          test -n "$WASLHA_KEYSTORE_PASSWORD" || { echo "Missing WASLHA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$WASLHA_KEY_ALIAS" || { echo "Missing WASLHA_KEY_ALIAS"; exit 1; }
          test -n "$WASLHA_KEY_PASSWORD" || { echo "Missing WASLHA_KEY_PASSWORD"; exit 1; }
          printf '%s' "$WASLHA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waslha-release.jks"
          test -s "$RUNNER_TEMP/waslha-release.jks" || { echo "Release keystore is empty"; exit 1; }
          echo "WASLHA_KEYSTORE_FILE=$RUNNER_TEMP/waslha-release.jks" >> "$GITHUB_ENV"
          echo "WASLHA_KEYSTORE_PASSWORD=$WASLHA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "WASLHA_KEY_ALIAS=$WASLHA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "WASLHA_KEY_PASSWORD=$WASLHA_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Patch customer Kotlin compatibility and normalize customer sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          patch('app/src/main/java/com/waslha/app/TaxiBookingActivity.kt', [
              ('import androidx.compose.foundation.layout.weight\n', ''),
              ('import androidx.compose.foundation.layout.Row\n', 'import androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.RowScope\n'),
              ('private fun BottomItem(icon:', 'private fun RowScope.BottomItem(icon:')
          ])

          patch('app/src/main/java/com/waslha/app/TripExperience.kt', [
              ('import androidx.compose.material.icons.filled.LocationOn\n', 'import androidx.compose.material.icons.filled.LocationOn\nimport androidx.compose.material.icons.filled.MyLocation\n')
          ])

          patch('app/src/main/java/com/waslha/app/PassengerFeatures.kt', [
              ('import androidx.compose.foundation.layout.weight\n', '')
          ])

          patch('app/src/main/java/com/waslha/app/WaslhaCustomerActivity.kt', [
              ('CustomerPage.About -> CustomerSubPage("عن وصلها", { page = CustomerPage.Profile }) { AboutPage() }', 'CustomerPage.About -> CustomerSubPage("عن وصلها", { page = CustomerPage.Profile }) { CurrentAboutScreen { page = CustomerPage.Profile } }'),
              ('val sessionStore = SessionStore(this)\n        val locationProvider = LocationProvider(this)', 'val sessionStore = SessionStore(this)\n        FcmRegistration.register(applicationContext)\n        val locationProvider = LocationProvider(this)'),
              ('"1.4.5"', 'BuildConfig.VERSION_NAME'),
              ('"v1.4.5"', '"v${BuildConfig.VERSION_NAME}"')
          ])

          patch('app/src/main/java/com/waslha/app/CustomerRideExperienceActivity.kt', [
              ('import com.mapbox.maps.MapboxOptions\n', 'import com.mapbox.common.MapboxOptions\n'),
              ('import androidx.compose.ui.unit.sp\n', 'import androidx.compose.ui.unit.sp\nimport androidx.compose.ui.text.font.FontWeight\n'),
              ('Card(Modifier.weight(1f).clickable(enabled = enabled, onClick = onClick),', 'Card(Modifier.fillMaxWidth().clickable(enabled = enabled, onClick = onClick),')
          ])
          PY

      - name: Verify customer source invariants
        shell: bash
        run: |
          ! grep -R --fixed-strings '1.4.5' app/src/main/java/com/waslha/app || { echo 'Legacy version literal remains'; exit 1; }
          grep -q 'class CustomerRideExperienceActivity' app/src/main/java/com/waslha/app/CustomerRideExperienceActivity.kt
          grep -q 'fun nearbyDrivers' app/src/main/java/com/waslha/app/CustomerRepository.kt

      - name: Build signed release APK
        run: |
          gradle :app:assembleRelease --stacktrace \
            -PWASLHA_KEYSTORE_FILE="$WASLHA_KEYSTORE_FILE" \
            -PWASLHA_KEYSTORE_PASSWORD="$WASLHA_KEYSTORE_PASSWORD" \
            -PWASLHA_KEY_ALIAS="$WASLHA_KEY_ALIAS" \
            -PWASLHA_KEY_PASSWORD="$WASLHA_KEY_PASSWORD"

      - name: Print APK signing fingerprints
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$APK"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-final-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

# Customer-only release workflow: captain and admin modules are intentionally excluded.
