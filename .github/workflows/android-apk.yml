name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Mapbox token resource
        shell: bash
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN" || { echo "MAPBOX_PUBLIC_TOKEN is not configured in repository variables"; exit 1; }
          mkdir -p app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' "    <string name=\"mapbox_access_token\" translatable=\"false\">${MAPBOX_PUBLIC_TOKEN}</string>" '</resources>' > app/src/main/res/values/mapbox_access_token.xml

      - name: Prepare Google web client ID resource
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$GOOGLE_WEB_CLIENT_ID" || { echo "GOOGLE_WEB_CLIENT_ID is not configured in repository variables"; exit 1; }
          mkdir -p app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' "    <string name=\"google_web_client_id\" translatable=\"false\">${GOOGLE_WEB_CLIENT_ID}</string>" '</resources>' > app/src/main/res/values/google_auth.xml

      - name: Prepare stable release signing
        shell: bash
        env:
          WASLHA_KEYSTORE_BASE64: ${{ secrets.WASLHA_KEYSTORE_BASE64 }}
          WASLHA_KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          WASLHA_KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
          WASLHA_KEY_PASSWORD: ${{ secrets.WASLHA_KEY_PASSWORD }}
        run: |
          test -n "$WASLHA_KEYSTORE_BASE64" || { echo "Missing WASLHA_KEYSTORE_BASE64"; exit 1; }
          test -n "$WASLHA_KEYSTORE_PASSWORD" || { echo "Missing WASLHA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$WASLHA_KEY_ALIAS" || { echo "Missing WASLHA_KEY_ALIAS"; exit 1; }
          test -n "$WASLHA_KEY_PASSWORD" || { echo "Missing WASLHA_KEY_PASSWORD"; exit 1; }
          printf '%s' "$WASLHA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/waslha-release.jks"
          test -s "$RUNNER_TEMP/waslha-release.jks" || { echo "Release keystore is empty"; exit 1; }
          echo "WASLHA_KEYSTORE_FILE=$RUNNER_TEMP/waslha-release.jks" >> "$GITHUB_ENV"
          echo "WASLHA_KEYSTORE_PASSWORD=$WASLHA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "WASLHA_KEY_ALIAS=$WASLHA_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "WASLHA_KEY_PASSWORD=$WASLHA_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Patch passenger Kotlin compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          taxi = Path('app/src/main/java/com/waslha/app/TaxiBookingActivity.kt')
          s = taxi.read_text(encoding='utf-8')
          s = s.replace('import androidx.compose.foundation.layout.weight\n', '')
          if 'import androidx.compose.foundation.layout.RowScope\n' not in s:
              s = s.replace('import androidx.compose.foundation.layout.Row\n', 'import androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.RowScope\n')
          s = s.replace('private fun BottomItem(icon:', 'private fun RowScope.BottomItem(icon:')
          taxi.write_text(s, encoding='utf-8')

          trip = Path('app/src/main/java/com/waslha/app/TripExperience.kt')
          s = trip.read_text(encoding='utf-8')
          if 'import androidx.compose.material.icons.filled.MyLocation\n' not in s:
              s = s.replace('import androidx.compose.material.icons.filled.LocationOn\n', 'import androidx.compose.material.icons.filled.LocationOn\nimport androidx.compose.material.icons.filled.MyLocation\n')
          trip.write_text(s, encoding='utf-8')

          pf = Path('app/src/main/java/com/waslha/app/PassengerFeatures.kt')
          s = pf.read_text(encoding='utf-8')
          s = s.replace('import androidx.compose.foundation.layout.weight\n', '')
          pf.write_text(s, encoding='utf-8')
          PY

      - name: Build signed release APK
        run: |
          gradle assembleRelease --stacktrace \
            -PWASLHA_KEYSTORE_FILE="$WASLHA_KEYSTORE_FILE" \
            -PWASLHA_KEYSTORE_PASSWORD="$WASLHA_KEYSTORE_PASSWORD" \
            -PWASLHA_KEY_ALIAS="$WASLHA_KEY_ALIAS" \
            -PWASLHA_KEY_PASSWORD="$WASLHA_KEY_PASSWORD"

      - name: Print APK signing fingerprints
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$APK"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-final-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
