name: Waslha Android Beta APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-beta-*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode release keystore
        env:
          WASLHA_KEYSTORE_BASE64: ${{ secrets.WASLHA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$WASLHA_KEYSTORE_BASE64" ]; then
            echo "WASLHA_KEYSTORE_BASE64 GitHub secret is required for a signed release build."
            exit 1
          fi
          echo "$WASLHA_KEYSTORE_BASE64" | base64 --decode > android/waslha-release.jks

      - name: Build signed release APK
        working-directory: android
        env:
          WASLHA_KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          WASLHA_KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
          WASLHA_KEY_PASSWORD: ${{ secrets.WASLHA_KEY_PASSWORD }}
        run: |
          if [ -z "$WASLHA_KEYSTORE_PASSWORD" ] || [ -z "$WASLHA_KEY_ALIAS" ] || [ -z "$WASLHA_KEY_PASSWORD" ]; then
            echo "Release signing secrets are required."
            exit 1
          fi
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/waslha-release.jks" \
            -Pandroid.injected.signing.store.password="$WASLHA_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$WASLHA_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$WASLHA_KEY_PASSWORD" \
            --no-daemon

      - name: Upload signed Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-beta-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: rm -f android/waslha-release.jks
