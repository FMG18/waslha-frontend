name: Waslha Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build signed Waslha APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          test -s index.html
          cp index.html www/index.html
          if [ -d assets ]; then cp -R assets www/assets; fi

      - name: Add Android platform
        run: npx cap add android

      - name: Install image tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          test -n "$(command -v convert || true)"

      - name: Generate Android launcher icons
        run: |
          set -euo pipefail
          test -s icon.png
          CONVERT=$(command -v convert)
          ANDROID_RES=android/app/src/main/res
          rm -rf "$ANDROID_RES/mipmap-anydpi" "$ANDROID_RES/mipmap-anydpi-v26"
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="$ANDROID_RES/mipmap-$density"
            mkdir -p "$dir"
            "$CONVERT" icon.png -auto-orient -resize "${size}x${size}" -gravity center -background none -extent "${size}x${size}" PNG32:"$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            test -s "$dir/ic_launcher.png"
          done
          echo 'Android launcher icons generated.'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Re-apply launcher icons after Capacitor sync
        run: |
          set -euo pipefail
          test -s icon.png
          CONVERT=$(command -v convert)
          ANDROID_RES=android/app/src/main/res
          rm -rf "$ANDROID_RES/mipmap-anydpi" "$ANDROID_RES/mipmap-anydpi-v26"
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="$ANDROID_RES/mipmap-$density"
            mkdir -p "$dir"
            "$CONVERT" icon.png -auto-orient -resize "${size}x${size}" -gravity center -background none -extent "${size}x${size}" PNG32:"$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            test -s "$dir/ic_launcher.png"
          done
          echo 'Final launcher resources:'
          find "$ANDROID_RES" -type f \( -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' -o -name 'ic_launcher*.xml' \) -print | sort

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.WASLHA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WASLHA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.WASLHA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/waslha-release.keystore"
          test -s "$RUNNER_TEMP/waslha-release.keystore"

      - name: Configure Android release
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('app/build.gradle')
          s = p.read_text()
          n = int(os.environ['BUILD_NUMBER'])
          s = re.sub(r'versionCode\s+\d+', f'versionCode {100+n}', s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', f'versionName "1.0.{n}"', s, count=1)
          if 'signingConfigs {' not in s:
              block = '''    signingConfigs {
          release {
              storeFile file(System.getenv("WASLHA_KEYSTORE"))
              storePassword System.getenv("WASLHA_KEYSTORE_PASSWORD")
              keyAlias System.getenv("WASLHA_KEY_ALIAS")
              keyPassword System.getenv("WASLHA_KEY_PASSWORD")
          }
      }

  '''
              s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          WASLHA_KEYSTORE: ${{ runner.temp }}/waslha-release.keystore
          WASLHA_KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          WASLHA_KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
          WASLHA_KEY_PASSWORD: ${{ secrets.WASLHA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK and launcher icon
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          set +e
          "$APKSIGNER" verify --verbose "$APK" > /tmp/apksigner.txt 2>&1
          SIGN_STATUS=$?
          set -e
          cat /tmp/apksigner.txt
          if [ "$SIGN_STATUS" -ne 0 ] && ! grep -Eq 'Verified using v2 scheme \(APK Signature Scheme v2\): true|Verified using v3 scheme \(APK Signature Scheme v3\): true' /tmp/apksigner.txt; then
            echo 'ERROR: APK signature verification failed.'
            exit "$SIGN_STATUS"
          fi

          echo 'Verifying launcher resources before packaging:'
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done

          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)
          test -n "$AAPT2"
          "$AAPT2" dump resources "$APK" > /tmp/resources.txt
          grep -q 'ic_launcher' /tmp/resources.txt

          if grep -Eq 'mipmap-anydpi(-v26)?/ic_launcher.*\.(xml|png)' /tmp/resources.txt; then
            echo 'ERROR: adaptive launcher resources are still present.'
            exit 1
          fi

          echo 'SIGNED APK AND LAUNCHER ICON VERIFIED.'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Clean signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/waslha-release.keystore"
