name: Waslha Android Beta APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-beta-*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web assets
        run: |
          mkdir -p www
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>وصلها</title></head><body></body></html>' > www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-beta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
