name: Waslha Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>وصلها</title></head><body></body></html>' > www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare app icon
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png
          npx @capacitor/assets@latest generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.WASLHA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
        run: |
          set -e
          test -n "$KEYSTORE_B64" || { echo "Missing WASLHA_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing WASLHA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing WASLHA_KEY_ALIAS"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/waslha-release.keystore"
          test -s "$RUNNER_TEMP/waslha-release.keystore"
          echo "Keystore decoded successfully."
          if keytool -list -keystore "$RUNNER_TEMP/waslha-release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "Keystore password and alias verified."
          else
            echo "Keystore was decoded, but the configured password or alias does not match the keystore."
            echo "Available aliases (names only):"
            keytool -list -keystore "$RUNNER_TEMP/waslha-release.keystore" -storepass "$KEYSTORE_PASSWORD" 2>&1 | sed -E 's/([A-Fa-f0-9]{16,})/[redacted]/g' || true
            exit 1
          fi

      - name: Configure release signing and version
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('app/build.gradle')
          s = p.read_text()
          n = int(os.environ['BUILD_NUMBER'])
          s = re.sub(r'versionCode\s+\d+', f'versionCode {100+n}', s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', f'versionName "1.0.{n}"', s, count=1)
          block = '''    signingConfigs {\n        release {\n            storeFile file(System.getenv("WASLHA_KEYSTORE"))\n            storePassword System.getenv("WASLHA_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("WASLHA_KEY_ALIAS")\n            keyPassword System.getenv("WASLHA_KEY_PASSWORD")\n        }\n    }\n\n'''
          if 'signingConfigs {' not in s:
              s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = s.replace('    release {', '    release {\n            signingConfig signingConfigs.release', 1)
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          WASLHA_KEYSTORE: ${{ runner.temp }}/waslha-release.keystore
          WASLHA_KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          WASLHA_KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
          WASLHA_KEY_PASSWORD: ${{ secrets.WASLHA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -f "$APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Clean signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/waslha-release.keystore"
