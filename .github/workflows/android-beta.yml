name: Waslha Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build signed Waslha APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          set -e
          rm -rf www
          mkdir -p www
          test -f index.html
          cp index.html www/index.html
          if [ -d assets ]; then cp -R assets www/assets; fi

      - name: Add Android platform
        run: npx cap add android

      - name: Install image tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y imagemagick
          command -v magick

      - name: Generate Android app icon
        run: |
          set -e
          test -s icon.png
          ANDROID_RES=android/app/src/main/res
          rm -f "$ANDROID_RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$ANDROID_RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          for spec in \
            'mdpi:48' \
            'hdpi:72' \
            'xhdpi:96' \
            'xxhdpi:144' \
            'xxxhdpi:192'; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="$ANDROID_RES/mipmap-$density"
            mkdir -p "$dir"
            magick icon.png -auto-orient -resize "${size}x${size}" -gravity center -background none -extent "${size}x${size}" PNG32:"$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done
          test -s "$ANDROID_RES/mipmap-mdpi/ic_launcher.png"
          test -s "$ANDROID_RES/mipmap-hdpi/ic_launcher.png"
          test -s "$ANDROID_RES/mipmap-xhdpi/ic_launcher.png"
          test -s "$ANDROID_RES/mipmap-xxhdpi/ic_launcher.png"
          test -s "$ANDROID_RES/mipmap-xxxhdpi/ic_launcher.png"
          echo 'Launcher icon generated successfully.'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.WASLHA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WASLHA_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_B64" || { echo 'Missing WASLHA_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing WASLHA_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing WASLHA_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing WASLHA_KEY_PASSWORD'; exit 1; }

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.WASLHA_KEYSTORE_BASE64 }}
        run: |
          set -e
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/waslha-release.keystore"
          test -s "$RUNNER_TEMP/waslha-release.keystore"

      - name: Configure Android release
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('app/build.gradle')
          s = p.read_text()
          n = int(os.environ['BUILD_NUMBER'])
          s = re.sub(r'versionCode\s+\d+', f'versionCode {100+n}', s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', f'versionName "1.0.{n}"', s, count=1)
          if 'signingConfigs {' not in s:
              block = '''    signingConfigs {\n        release {\n            storeFile file(System.getenv("WASLHA_KEYSTORE"))\n            storePassword System.getenv("WASLHA_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("WASLHA_KEY_ALIAS")\n            keyPassword System.getenv("WASLHA_KEY_PASSWORD")\n        }\n    }\n\n'''
              s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
          if 'signingConfig signingConfigs.release' not in s:
              s = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          WASLHA_KEYSTORE: ${{ runner.temp }}/waslha-release.keystore
          WASLHA_KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          WASLHA_KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
          WASLHA_KEY_PASSWORD: ${{ secrets.WASLHA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Verify launcher icon inside APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -E 'mipmap-(mdpi|hdpi|xhdpi|xxhdpi|xxxhdpi)/ic_launcher\.png' | tee /tmp/icon-check.txt
          test "$(wc -l < /tmp/icon-check.txt)" -ge 5
          echo 'Launcher icon files verified inside APK.'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-release-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Clean signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/waslha-release.keystore"
