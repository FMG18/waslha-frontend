name: Waslha Android Release APK

# Release build: persistent signing + automatic versioning

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'android-beta-*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web assets
        run: |
          mkdir -p www
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>وصلها</title></head><body></body></html>' > www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare Waslha app icon
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png
          npx @capacitor/assets@latest generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare release signing
        env:
          WASLHA_KEYSTORE_BASE64: ${{ secrets.WASLHA_KEYSTORE_BASE64 }}
          WASLHA_KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          WASLHA_KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
          WASLHA_KEY_PASSWORD: ${{ secrets.WASLHA_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$WASLHA_KEYSTORE_BASE64" || { echo "Missing WASLHA_KEYSTORE_BASE64"; exit 1; }
          test -n "$WASLHA_KEYSTORE_PASSWORD" || { echo "Missing WASLHA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$WASLHA_KEY_ALIAS" || { echo "Missing WASLHA_KEY_ALIAS"; exit 1; }
          test -n "$WASLHA_KEY_PASSWORD" || { echo "Missing WASLHA_KEY_PASSWORD"; exit 1; }
          printf '%s' "$WASLHA_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/waslha-release.keystore"
          test -s "$GITHUB_WORKSPACE/waslha-release.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/waslha-release.keystore" -storepass "$WASLHA_KEYSTORE_PASSWORD" -alias "$WASLHA_KEY_ALIAS" >/dev/null

      - name: Configure Android release and version
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = Path('app/build.gradle')
          s = p.read_text()
          n = int(os.environ['BUILD_NUMBER'])

          s = re.sub(r'versionCode\s+\d+', f'versionCode {100 + n}', s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', f'versionName "1.0.{n}"', s, count=1)

          signing = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("WASLHA_KEYSTORE"))
                  storePassword System.getenv("WASLHA_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("WASLHA_KEY_ALIAS")
                  keyPassword System.getenv("WASLHA_KEY_PASSWORD")
              }
          }

'''

          if 'signingConfigs {' not in s:
              marker = '    buildTypes {'
              if marker not in s:
                  raise SystemExit('Could not find buildTypes block')
              s = s.replace(marker, signing + marker, 1)
          elif 'signingConfigs {\n              release {' not in s:
              raise SystemExit('Unexpected existing signingConfigs block')

          build_types = s.find('buildTypes {')
          release = s.find('release {', build_types)
          if build_types == -1 or release == -1:
              raise SystemExit('Could not find release build type')

          release_line_end = s.find('\n', release)
          if release_line_end == -1:
              raise SystemExit('Invalid release block')

          if 'signingConfig signingConfigs.release' not in s[release:]:
              s = s[:release_line_end + 1] + '            signingConfig signingConfigs.release\n' + s[release_line_end + 1:]

          p.write_text(s)
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          WASLHA_KEYSTORE: ${{ github.workspace }}/waslha-release.keystore
          WASLHA_KEYSTORE_PASSWORD: ${{ secrets.WASLHA_KEYSTORE_PASSWORD }}
          WASLHA_KEY_ALIAS: ${{ secrets.WASLHA_KEY_ALIAS }}
          WASLHA_KEY_PASSWORD: ${{ secrets.WASLHA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signed APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Clean signing key
        if: always()
        run: rm -f waslha-release.keystore
