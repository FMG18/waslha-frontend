name: Waslha Android Beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'android-beta-*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor web assets
        run: |
          mkdir -p www
          printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>وصلها</title></head><body></body></html>' > www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare Waslha app icon
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png
          npx @capacitor/assets@latest generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > waslha-release.keystore
          test -s waslha-release.keystore

      - name: Set Android version
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('app/build.gradle')
          s = p.read_text()
          n = int(os.environ['BUILD_NUMBER'])
          s = re.sub(r'versionCode\s+\d+', f'versionCode {n}', s, count=1)
          s = re.sub(r'versionName\s+"[^"]*"', f'versionName "1.0.{n}"', s, count=1)
          p.write_text(s)
          PY

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Sign APK with Waslha release key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          "$ZIPALIGN" -f 4 "$APK" android/app-release-unsigned.apk
          "$APKSIGNER" sign --ks waslha-release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$KEYSTORE_PASSWORD" --key-pass pass:"$KEYSTORE_PASSWORD" --out android/app-release.apk android/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose android/app-release.apk

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: waslha-beta-apk
          path: android/app-release.apk
          if-no-files-found: error
          retention-days: 90
