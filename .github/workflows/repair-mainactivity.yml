name: Repair MainActivity

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Patch Kotlin sources
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/src/main/java/com/waslha/app/MainActivity.kt')
          s = p.read_text()

          if 'val locationScope = rememberCoroutineScope()' not in s:
              s = s.replace(
                  '    var locationDenied by remember { mutableStateOf(false) }\n\n    val context = androidx.compose.ui.platform.LocalContext.current',
                  '    var locationDenied by remember { mutableStateOf(false) }\n    val locationScope = rememberCoroutineScope()\n\n    val context = androidx.compose.ui.platform.LocalContext.current',
                  1
              )

          s = s.replace(
              '                            location = locationProvider.lastKnown()?.let { Coordinates(it.latitude, it.longitude) }',
              '                            locationScope.launch {\n                                location = locationProvider.lastKnown()?.let { Coordinates(it.latitude, it.longitude) }\n                            }',
              1
          )

          s = s.replace(
              'private fun VehicleCard(',
              'private fun androidx.compose.foundation.layout.RowScope.VehicleCard(',
              1
          )
          s = s.replace(
              'private fun EmptyTrips(',
              'private fun androidx.compose.foundation.layout.ColumnScope.EmptyTrips(',
              1
          )
          s = s.replace('Icons.Default.Place', 'Icons.Default.LocationOn')

          marker = '\n@Composable\nprivate fun CenterTripState('
          first = s.find('\n@Composable\nprivate fun CancelTripDialog(')
          second = s.find(marker)
          if first != -1 and second != -1 and first < second:
              s = s[:first] + s[second:]

          p.write_text(s)
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/waslha/app/MainActivity.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: repair MainActivity compile errors'
          git push origin main
      - name: Remove repair workflow
        shell: bash
        run: |
          git rm .github/workflows/repair-mainactivity.yml
          git commit -m 'chore: remove one-time repair workflow'
          git push origin main
