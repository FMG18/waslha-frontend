name: Release Android APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode'
        required: true
        default: '4'
      version_name:
        description: 'Android versionName'
        required: true
        default: '1.3.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Mapbox token resource
        shell: bash
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ vars.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN" || { echo "MAPBOX_PUBLIC_TOKEN is not configured"; exit 1; }
          mkdir -p app/src/main/res/values
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' "    <string name=\"mapbox_access_token\" translatable=\"false\">${MAPBOX_PUBLIC_TOKEN}</string>" '</resources>' > app/src/main/res/values/mapbox_access_token.xml

      - name: Prepare Google web client ID resource
        shell: bash
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          mkdir -p app/src/main/res/values
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<resources>' "    <string name=\"google_web_client_id\" translatable=\"false\">${GOOGLE_WEB_CLIENT_ID}</string>" '</resources>' > app/src/main/res/values/google_auth.xml
          fi

      - name: Resolve release version
        shell: bash
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION_NAME="${GIT_TAG#v}"
            VERSION_CODE=$(python3 - <<'PY'
            import re, sys
            v=sys.argv[1]
            print(int(re.sub(r'[^0-9]', '', v.replace('.', '')) or '1'))
            PY
            "$VERSION_NAME")
          else
            VERSION_NAME="$INPUT_VERSION_NAME"
            VERSION_CODE="$INPUT_VERSION_CODE"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Release version: $VERSION_NAME ($VERSION_CODE)"

      - name: Set release version in Gradle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p=Path('app/build.gradle.kts')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'versionCode\s*=\s*\d+', f"versionCode = {os.environ['VERSION_CODE']}", s)
          s=re.sub(r'versionName\s*=\s*"[^"]+"', f"versionName = \"{os.environ['VERSION_NAME']}\"", s)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APKs by ABI
        run: gradle assembleRelease --stacktrace

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          test ${#apks[@]} -gt 0 || { echo "No release APKs found"; exit 1; }
          for apk in "${apks[@]}"; do
            name=$(basename "$apk")
            sha256sum "$apk" > "release-assets/$name.sha256"
            cp "$apk" "release-assets/$name"
          done
          printf '%s\n' "Version: $VERSION_NAME" "Version code: $VERSION_CODE" > release-assets/release-info.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Waslha ${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: release-assets/*
