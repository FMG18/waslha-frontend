<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وصلها | تقييمات الكابتن</title><link rel="stylesheet" href="assets/style.css?v=2026.09.01"><link rel="stylesheet" href="assets/mobile.css?v=2026.09.01"></head><body><main class="shell" style="padding:22px 0 50px"><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><span class="badge">الكابتن</span><h1>تقييماتي</h1><p class="muted">تابع تقييمات العملاء ومتوسط أدائك.</p></div><a href="captain.html" class="btn light" style="text-decoration:none">لوحة الكابتن</a></div></section><div class="grid" style="margin-top:18px"><div class="col-6 card"><small class="muted">متوسط التقييم</small><h2 id="average">—</h2></div><div class="col-6 card"><small class="muted">عدد التقييمات</small><h2 id="count">—</h2></div></div><section class="card" style="margin-top:18px"><span class="badge">آراء العملاء</span><div id="list" style="margin-top:12px"><div class="empty">جارٍ التحميل...</div></div></section></main><script src="assets/app.js?v=2026.09.01"></script><script>(async()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!token){location.href='captain.html';return}try{const d=await api('/captains/reviews?limit=100');const x=d.data||d,items=x.items||x.reviews||[];const avg=Number(x.averageRating??x.average??0);$('average').textContent=avg?avg.toFixed(1)+' ★':'جديد';$('count').textContent=x.total??items.length;$('list').innerHTML=items.length?items.map(r=>`<article class="status" style="margin:10px 0"><b>${'★'.repeat(Math.max(0,Math.min(5,Number(r.rating||0))))}${'☆'.repeat(Math.max(0,5-Number(r.rating||0)))}</b><p>${esc(r.comment||'بدون تعليق')}</p><small class="muted">${r.createdAt?new Date(r.createdAt).toLocaleString('ar-IQ'):''}</small></article>`).join(''):'<div class="empty">لا توجد تقييمات حتى الآن.</div>'}catch(e){$('list').innerHTML='<div class="empty">تعذر تحميل التقييمات.</div>'}})()</script></body></html>
