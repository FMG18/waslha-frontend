<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f9f6e"><title>وصلها | متابعة الرحلة</title><link rel="stylesheet" href="assets/style.css?v=2026.09.01"><link rel="stylesheet" href="assets/mobile.css?v=2026.09.01"><link rel="stylesheet" href="assets/customer.css?v=2026.09.01"><style>body{background:#f5faf8}.track{max-width:620px;margin:auto;padding:18px 16px 40px}.track-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.track-card{background:#fff;border:1px solid #e3eeea;border-radius:28px;padding:22px;box-shadow:0 12px 35px #12321b12}.track-map{height:310px;border-radius:22px;overflow:hidden;background:#eaf3ef;margin-bottom:18px}.timeline{display:grid;gap:14px;margin:20px 0}.step{display:flex;align-items:center;gap:12px}.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e8f6f0;color:#0f9f6e;font-weight:800}.step.done .dot{background:#0f9f6e;color:#fff}.muted2{color:#71807a}.back{display:block;text-align:center;margin-top:15px}</style></head><body><main class="track"><div class="track-head"><a href="rides.html">← رحلاتي</a><b>وصلها</b></div><section class="track-card"><div class="track-map" id="trackMap"></div><h1 style="margin:0 0 5px">متابعة الرحلة</h1><p id="status" class="muted2">جارٍ تحميل حالة الرحلة...</p><div class="timeline"><div id="requested" class="step"><span class="dot">1</span><div><b>تم استلام الطلب</b><small class="muted2" style="display:block">نبحث عن كابتن قريب</small></div></div><div id="accepted" class="step"><span class="dot">2</span><div><b>الكابتن</b><small id="captain" class="muted2" style="display:block">بانتظار قبول الرحلة</small></div></div><div id="arrived" class="step"><span class="dot">3</span><div><b>في الطريق إليك</b><small class="muted2" style="display:block">ستظهر حركة الكابتن على الخريطة</small></div></div></div><button id="cancel" class="btn danger hidden" style="width:100%" type="button">إلغاء الرحلة</button><a class="back" href="customer.html">＋ طلب رحلة جديدة</a></section></main><script src="assets/app.js?v=2026.09.02"></script><script src="assets/map.js?v=2026.09.02"></script><script>(async()=>{if(!requireRole('customer'))return;const id=new URLSearchParams(location.search).get('ride')||localStorage.getItem('waslha_ride');if(!id){location.replace('rides.html');return}localStorage.setItem('waslha_ride',id);let mapApi=null,timer=null,ride=null;const $=x=>document.getElementById(x);const active=s=>!['trip_completed','completed','cancelled'].includes(s);function mark(el,on){el.classList.toggle('done',on)}function show(r){ride=r;const s=r.status;$('status').textContent=statusLabel(s);$('captain').textContent=r.captain?.user?.name||'بانتظار قبول الرحلة';mark($('requested'),true);mark($('accepted'),!!r.captain||['accepted','arrived','in_progress'].includes(s));mark($('arrived'),['arrived','in_progress'].includes(s));$('cancel').classList.toggle('hidden',!active(s));const lat=r.captain?.location?.lat??r.captain?.currentLocation?.lat,lng=r.captain?.location?.lng??r.captain?.currentLocation?.lng;if(mapApi&&Number.isFinite(+lat)&&Number.isFinite(+lng))mapApi.setDriver(lat,lng)}async function load(){try{const d=await api('/rides/'+encodeURIComponent(id));const r=d?.data?.ride||d?.data||d;if(!r)throw Error('الرحلة غير موجودة');show(r);if(!active(r.status)){clearInterval(timer);$('cancel').classList.add('hidden');if(r.status==='trip_completed'||r.status==='completed')toast('اكتملت الرحلة')}}catch(e){$('status').textContent=e.message||'تعذر تحميل الرحلة'}}$('cancel').onclick=async()=>{try{setBusy($('cancel'),true,'جارٍ الإلغاء...');await api('/rides/'+encodeURIComponent(id)+'/cancel',{method:'POST'});toast('تم إلغاء الرحلة');await load()}catch(e){toast(e.message)}finally{setBusy($('cancel'),false)}};mapApi=await WaslhaMap.init({container:'trackMap',interactive:false,routingMode:'drive'});await load();timer=setInterval(load,5000)})()</script></body></html>
