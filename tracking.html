<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f9f6e">
<title>وصلها | متابعة الرحلة</title>
<link rel="stylesheet" href="assets/style.css?v=2026.09.05">
<link rel="stylesheet" href="assets/mobile.css?v=2026.09.05">
<link rel="stylesheet" href="assets/customer.css?v=2026.09.05">
<style>
:root{--g:#0f9f6e;--g2:#087b55;--ink:#10231d;--muted:#71807a;--bg:#f4f7f6;--line:#e2ebe7;--danger:#c53d3d}
body{margin:0;background:var(--bg);color:var(--ink)}.track{max-width:900px;margin:auto;padding:10px 14px 35px}.head{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 14px}.head a{color:var(--g2);text-decoration:none;font-weight:800}.brand{font-size:20px;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 8px 28px #10231d0a}.map{height:390px;border-radius:18px;overflow:hidden;background:#e7efec;position:relative}.mapbox{height:100%!important}.map-badge{position:absolute;top:12px;right:12px;z-index:3;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-weight:800}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:15px 0}.eyebrow{font-size:12px;color:var(--g2);font-weight:900}.status{font-size:22px;font-weight:900;margin:4px 0}.fare{font-size:21px;font-weight:900}.route{background:#f7faf9;border-radius:16px;padding:12px;margin:12px 0;line-height:1.8}.route small{color:var(--muted);display:block}.captain{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px}.avatar{width:46px;height:46px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900}.captain-info{flex:1}.captain-info b{display:block}.muted{color:var(--muted);font-size:13px}.rating{font-weight:900}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:17px 0}.step{padding:9px 4px;text-align:center;border-radius:12px;background:#f0f4f2;color:#7a8782;font-size:11px}.step.active{background:#e8f7f1;color:var(--g2);font-weight:900}.step.current{outline:2px solid #b8e3d3}.actions{display:flex;gap:8px}.btn{border:0;border-radius:14px;padding:12px 15px;font:inherit;font-weight:900;cursor:pointer;flex:1;background:var(--g);color:#fff}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #efcccc}.hidden{display:none!important}.notice{margin-top:12px;padding:11px 12px;border-radius:14px;background:#f7faf9;color:var(--muted);font-size:13px;text-align:center}.back{display:block;text-align:center;margin-top:14px;color:var(--g2);text-decoration:none;font-weight:800}@media(max-width:650px){.track{padding:6px 10px 25px}.map{height:330px}.timeline{grid-template-columns:repeat(2,1fr)}.hero{align-items:flex-start}.status{font-size:19px}.fare{font-size:18px}}
</style>
</head>
<body>
<main class="track">
<header class="head"><a href="rides.html">← رحلاتي</a><div class="brand">وصلها</div><a href="customer.html">طلب جديد</a></header>
<section class="card">
<div class="map"><div id="trackMap" class="mapbox"></div><div class="map-badge" id="mapBadge">متابعة مباشرة</div></div>
<div class="hero"><div><span class="eyebrow">الرحلة الحالية</span><div id="status" class="status">جارٍ تحميل الرحلة...</div><div id="substatus" class="muted">نتابع حالة طلبك تلقائياً</div></div><div id="fare" class="fare">—</div></div>
<div id="route" class="route"><small>المسار</small><b id="pickup">—</b><br>↓<br><b id="dropoff">—</b></div>
<div id="captainBox" class="captain hidden"><div id="avatar" class="avatar">ك</div><div class="captain-info"><b id="captainName">الكابتن</b><span id="vehicle" class="muted">بانتظار قبول الرحلة</span></div><span id="rating" class="rating">★ —</span></div>
<div class="timeline">
<div id="s1" class="step">1<br>تم الطلب</div><div id="s2" class="step">2<br>تم الإسناد</div><div id="s3" class="step">3<br>بالطريق</div><div id="s4" class="step">4<br>وصل الكابتن</div><div id="s5" class="step">5<br>بدأت الرحلة</div>
</div>
<div id="notice" class="notice">جارٍ البحث عن كابتن قريب منك...</div>
<div class="actions"><button id="cancel" class="btn danger" type="button">إلغاء الرحلة</button></div>
<a class="back" href="rides.html">عرض سجل الرحلات</a>
</section>
</main>
<script src="assets/app.js?v=2026.09.05"></script>
<script src="assets/map.js?v=2026.09.05"></script>
<script>
(async()=>{
 if(!requireRole('customer'))return;
 const id=new URLSearchParams(location.search).get('ride')||localStorage.getItem('waslha_ride');
 if(!id){location.replace('rides.html');return}
 localStorage.setItem('waslha_ride',id);
 const $=x=>document.getElementById(x),terminal=['trip_completed','cancelled'];
 const labels={requested:'تم استلام الطلب',searching:'جاري البحث عن كابتن',captain_assigned:'تم إسناد الرحلة',captain_arriving:'الكابتن في الطريق',captain_arrived:'الكابتن وصل إلى موقعك',trip_started:'الرحلة بدأت',trip_completed:'اكتملت الرحلة',cancelled:'أُلغيت الرحلة'};
 let mapApi=null,timer=null,ride=null,loading=false;
 const normalize=d=>d?.data?.ride||d?.data||d;
 const money=v=>Number(v||0).toLocaleString('ar-SY')+' ل.س';
 function captainPoint(c){const l=c?.currentLocation||c?.location;if(Array.isArray(l?.coordinates)&&l.coordinates.length===2)return{lat:+l.coordinates[1],lng:+l.coordinates[0]};if(Number.isFinite(+l?.lat)&&Number.isFinite(+l?.lng))return{lat:+l.lat,lng:+l.lng};return null}
 function setStep(id,on,current){$(id).classList.toggle('active',!!on);$(id).classList.toggle('current',!!current)}
 function render(r){ride=r;const s=r.status;const active=!terminal.includes(s);$('status').textContent=labels[s]||s;$('fare').textContent=money(r.finalFare??r.estimatedFare);$('pickup').textContent=r.pickup?.address||r.pickupAddress||'نقطة الانطلاق';$('dropoff').textContent=r.dropoff?.address||r.dropoffAddress||'الوجهة';
 setStep('s1',true,s==='requested'||s==='searching');setStep('s2',['captain_assigned','captain_arriving','captain_arrived','trip_started','trip_completed'].includes(s),s==='captain_assigned');setStep('s3',['captain_arriving','captain_arrived','trip_started','trip_completed'].includes(s),s==='captain_arriving');setStep('s4',['captain_arrived','trip_started','trip_completed'].includes(s),s==='captain_arrived');setStep('s5',['trip_started','trip_completed'].includes(s),s==='trip_started');
 const c=r.captain; if(c){$('captainBox').classList.remove('hidden');const n=c.user?.name||c.name||'الكابتن';$('captainName').textContent=n;$('avatar').textContent=n.trim().charAt(0)||'ك';$('rating').textContent=c.rating?.average?`★ ${Number(c.rating.average).toFixed(1)}`:'★ جديد';const v=c.vehicle||{};$('vehicle').textContent=[v.type,v.make,v.model,v.plateNumber&&('لوحة '+v.plateNumber)].filter(Boolean).join(' • ')||'كابتن وصلها'}
 else $('captainBox').classList.add('hidden');
 $('substatus').textContent=s==='searching'?'نبحث عن أقرب كابتن مناسب':s==='captain_arriving'?'الكابتن متجه إليك الآن':s==='captain_arrived'?'الكابتن وصل، استعد للرحلة':s==='trip_started'?'رحلة آمنة! نحن نتابعها معك':s==='trip_completed'?'تم إنهاء الرحلة بنجاح':s==='cancelled'?'تم إلغاء الرحلة':'سنحدّث الحالة تلقائياً';
 $('notice').textContent=s==='searching'?'جاري البحث عن كابتن قريب منك...':s==='captain_assigned'?'تم اختيار الكابتن، بانتظار انطلاقه.':s==='captain_arriving'?'الكابتن في الطريق إليك، راقب موقعه على الخريطة.':s==='captain_arrived'?'الكابتن وصل إلى نقطة الانطلاق.':s==='trip_started'?'الرحلة قيد التنفيذ.':s==='trip_completed'?'انتهت الرحلة. شكراً لاستخدام وصلها.':s==='cancelled'?'تم إلغاء هذه الرحلة.':'طلبك قيد المعالجة.';
 $('cancel').classList.toggle('hidden',!active);if(terminal.includes(s)){clearInterval(timer);localStorage.removeItem('waslha_ride');if(s==='trip_completed')toast('اكتملت الرحلة بنجاح');if(s==='cancelled')toast('تم إلغاء الرحلة')}
 const p=captainPoint(c);if(mapApi&&p)mapApi.setDriver(p.lat,p.lng);
 }
 async function load(){if(loading)return;loading=true;try{const d=await api('/rides/'+encodeURIComponent(id));const r=normalize(d);if(!r)throw Error('الرحلة غير موجودة');render(r)}catch(e){$('status').textContent=e.message||'تعذر تحميل الرحلة'}finally{loading=false}}
 $('cancel').onclick=async()=>{if(!ride?. _id||terminal.includes(ride.status))return;if(!confirm('هل تريد إلغاء الرحلة؟'))return;try{setBusy($('cancel'),true,'جارٍ الإلغاء...');await api('/rides/'+encodeURIComponent(id)+'/cancel',{method:'POST'});await load()}catch(e){toast(e.message)}finally{setBusy($('cancel'),false)}};
 try{mapApi=await WaslhaMap.init({container:'trackMap',interactive:false,routingMode:'drive'})}catch{toast('تعذر تحميل الخريطة')}
 await load();timer=setInterval(load,4000);
})();
</script>
</body>
</html>
