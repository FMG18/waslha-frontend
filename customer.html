<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | حساب الزبون</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/mobile.css"></head><body><main class="shell has-app-nav"><section id="app" style="padding:18px 0 45px"><div class="card" style="margin-bottom:18px"><span class="badge">● وصلها</span><h1 id="welcome" style="font-size:clamp(30px,5vw,48px);margin:10px 0 3px">لوحة الزبون</h1><p class="muted">حدد نقطة الانطلاق والوجهة من الخريطة.</p></div><div class="grid"><div id="newRide" class="col-8 card"><span class="badge">رحلة جديدة</span><h2 style="margin-top:8px">إلى أين تريد الذهاب؟</h2><div class="field" style="margin-top:18px"><label>نوع الخدمة</label><select id="service"><option value="taxi">🚕 سيارة</option><option value="motorcycle">🏍️ دراجة نارية</option><option value="delivery">📦 توصيل</option></select></div><div id="rideMap" class="mapbox" style="height:420px;margin-top:16px"></div><div id="mapHint" class="status" style="margin-top:12px">حدد نقطة الانطلاق على الخريطة، ثم حدد الوجهة.</div><div class="form" style="margin-top:14px"><div class="field"><label>عنوان الانطلاق <span class="muted">اختياري</span></label><input id="pickupAddress" maxlength="300" placeholder="مثال: شارع أو منطقة"></div><div class="field"><label>عنوان الوصول <span class="muted">اختياري</span></label><input id="dropoffAddress" maxlength="300" placeholder="مثال: شارع أو منطقة"></div><button id="locateBtn" class="btn light" type="button">📍 استخدام موقعي كنقطة انطلاق</button><button id="requestBtn" class="btn" type="button">🚕 تأكيد طلب الرحلة</button></div></div><div class="col-4"><div class="card" style="margin-bottom:18px"><span class="badge">تتبع مباشر</span><h3 style="margin-top:12px">حالة الرحلة</h3><div id="status" class="status">لا توجد رحلة نشطة.</div><div id="eta" class="stat hidden"><span class="muted">الوصول المتوقع</span><b>—</b></div><div id="distance" class="stat hidden"><span class="muted">المسافة</span><b>—</b></div><div id="fare" class="stat hidden"><span class="muted">السعر التقديري</span><b>—</b></div><button id="cancelBtn" class="btn danger hidden" style="margin-top:12px">إلغاء الرحلة</button></div><div class="card"><h3>رحلاتي</h3><a class="ghost" href="rides.html" style="display:block;text-align:center">عرض سجل الرحلات</a></div></div></div></section></main><script src="assets/app.js"></script><script src="assets/map.js"></script><script>(async()=>{if(!requireRole('customer'))return;const u=user();$('welcome').textContent='مرحباً '+(u?.name||'');let activeRide=null,rideTimer=null,mapApi=null,pickup=null,dropoff=null;const terminal=['trip_completed','cancelled'];const normalizeRide=d=>d?.data?.ride||d?.data||d;function syncMapPoints(){const p=mapApi?.getPoints?.()||{};pickup=p.pickup??null;dropoff=p.dropoff??null;return{pickup,dropoff}}function renderRide(){const r=activeRide;if(!r)return;$('status').innerHTML='<b>'+statusLabel(r.status)+'</b><br><span class="muted">'+(r.captain?.user?.name?'الكابتن: '+r.captain.user.name:'بانتظار تحديث الكابتن...')+'</span>';if(r.estimatedFare!=null){$('fare').classList.remove('hidden');$('fare').querySelector('b').textContent=money(r.estimatedFare)}const eta=r.etaMinutes??r.estimatedArrivalMinutes??r.estimatedTimeMinutes;if(eta!=null){$('eta').classList.remove('hidden');$('eta').querySelector('b').textContent=String(eta)+' دقيقة'}const dist=r.distanceKm??r.remainingDistanceKm;if(dist!=null){$('distance').classList.remove('hidden');$('distance').querySelector('b').textContent=Number(dist).toFixed(1)+' كم'}const lat=r.captain?.location?.lat??r.captain?.currentLocation?.lat??r.captain?.lat,lng=r.captain?.location?.lng??r.captain?.currentLocation?.lng??r.captain?.lng;if(Number.isFinite(Number(lat))&&Number.isFinite(Number(lng)))mapApi?.setDriver(lat,lng);if(terminal.includes(r.status)){clearInterval(rideTimer);$('cancelBtn').classList.add('hidden')}}async function refreshRide(){if(!activeRide?._id)return;try{activeRide=normalizeRide(await api('/rides/'+activeRide._id));renderRide()}catch(e){}}async function restoreRide(){const id=localStorage.getItem('waslha_ride');if(!id)return;try{activeRide=normalizeRide(await api('/rides/'+id));renderRide();if(activeRide&&!terminal.includes(activeRide.status)){clearInterval(rideTimer);rideTimer=setInterval(refreshRide,5000)}}catch(e){localStorage.removeItem('waslha_ride')}}mapApi=await window.WaslhaMap?.init({container:'rideMap',interactive:true,onMapClick:()=>{syncMapPoints();const mode=mapApi?.getSelectionMode?.();$('mapHint').textContent=mode==='pickup'?'حدد نقطة الانطلاق على الخريطة.':mode==='dropoff'?'حدد الوجهة على الخريطة.':'تم تحديد الموقعين. استخدم وضع التحديد على الخريطة لتعديل أي نقطة.'}});syncMapPoints();$('locateBtn').onclick=()=>navigator.geolocation?.getCurrentPosition(pos=>{pickup=[pos.coords.longitude,pos.coords.latitude];mapApi?.setPoints(pickup,dropoff);mapApi?.setSelectionMode?.('dropoff');$('mapHint').textContent='تم تحديد موقعك كنقطة انطلاق. حدد الوجهة على الخريطة.'},()=>toast('تعذر الحصول على موقعك الحالي'),{enableHighAccuracy:true,timeout:10000});$('requestBtn').onclick=async()=>{const b=$('requestBtn');try{syncMapPoints();if(!pickup||!dropoff)throw Error('حدد نقطة الانطلاق والوجهة من الخريطة أولاً');setBusy(b,true,'جارٍ إرسال الطلب...');const d=await api('/rides',{method:'POST',body:JSON.stringify({serviceType:$('service').value,pickup:{lat:pickup[1],lng:pickup[0]},dropoff:{lat:dropoff[1],lng:dropoff[0]},pickupAddress:$('pickupAddress').value.trim(),dropoffAddress:$('dropoffAddress').value.trim()})});activeRide=normalizeRide(d);if(!activeRide?._id)throw Error('تم إنشاء الطلب لكن لم يصل معرّف الرحلة');localStorage.setItem('waslha_ride',activeRide._id);renderRide();$('cancelBtn').classList.remove('hidden');clearInterval(rideTimer);rideTimer=setInterval(refreshRide,5000);toast('تم إرسال طلب الرحلة')}catch(e){toast(e.message)}finally{setBusy(b,false)}};$('cancelBtn').onclick=async()=>{if(!activeRide?._id)return;const b=$('cancelBtn');try{setBusy(b,true,'جارٍ الإلغاء...');await api('/rides/'+activeRide._id+'/cancel',{method:'POST'});activeRide=null;localStorage.removeItem('waslha_ride');clearInterval(rideTimer);$('status').textContent='تم إلغاء الرحلة';$('cancelBtn').classList.add('hidden')}catch(e){toast(e.message)}finally{setBusy(b,false)}};await restoreRide()})()</script></body></html>
