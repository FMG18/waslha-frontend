<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وصلها - الزبون</title><style>body{font-family:Arial;background:#f5f6f8;margin:0}.wrap{max-width:520px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 3px 16px #0001}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #ddd;font-size:15px}button{border:0;background:#16a34a;color:#fff;font-weight:700}.secondary{background:#475569}.danger{background:#dc2626}.hidden{display:none}.status{margin:12px 0;padding:12px;border-radius:10px;background:#eef6ff}</style><div class="wrap"><div class="card"><h2>وصلها 🚕</h2><section id="auth"><input id="name" placeholder="الاسم"><input id="phone" placeholder="رقم الهاتف مثال +9647701234567"><input id="password" type="password" placeholder="كلمة المرور - 8 أحرف على الأقل"><button type="button" id="registerBtn">إنشاء حساب</button><button type="button" class="secondary" id="loginBtn">تسجيل الدخول</button></section><section id="app" class="hidden"><b id="userInfo"></b><button type="button" class="secondary" id="logoutBtn">تسجيل الخروج</button><select id="service"><option value="taxi">تكسي</option><option value="motorcycle">دراجة نارية</option><option value="delivery">توصيل</option></select><input id="pickupLat" type="number" step="any" placeholder="خط عرض الانطلاق"><input id="pickupLng" type="number" step="any" placeholder="خط طول الانطلاق"><input id="dropLat" type="number" step="any" placeholder="خط عرض الوصول"><input id="dropLng" type="number" step="any" placeholder="خط طول الوصول"><input id="pickupAddress" placeholder="عنوان الانطلاق"><input id="dropoffAddress" placeholder="عنوان الوصول"><button type="button" id="requestBtn">طلب رحلة</button><div id="status" class="status">لا توجد رحلة</div><button type="button" id="cancelBtn" class="danger hidden">إلغاء الرحلة</button></section></div></div><script>(()=>{const API='https://waslha-backend.vercel.app/api';let token=localStorage.getItem('waslha_token'),rideId=localStorage.getItem('waslha_ride');const $=id=>document.getElementById(id);function showApp(){const ok=!!token;$('auth').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok);if(ok){const u=JSON.parse(localStorage.getItem('waslha_user')||'{}');$('userInfo').textContent='مرحباً '+(u.name||'');if(rideId){refresh();setInterval(refresh,5000)}}}async function api(path,opts={}){opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{},token?{Authorization:'Bearer '+token}:{});const r=await fetch(API+path,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d?.error?.message||d?.message||'تعذر تنفيذ الطلب');return d}function save(d){token=d.token;localStorage.setItem('waslha_token',token);localStorage.setItem('waslha_user',JSON.stringify(d.user));showApp()}$('registerBtn').onclick=async()=>{try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:$('name').value.trim(),phone:$('phone').value,password:$('password').value,role:'customer'})});save(d.data)}catch(e){alert(e.message)}};$('loginBtn').onclick=async()=>{try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value,password:$('password').value})});if(d.data.user.role!=='customer')throw Error('هذا الحساب ليس حساب زبون');save(d.data)}catch(e){alert(e.message)}};$('logoutBtn').onclick=()=>{localStorage.clear();location.reload()};$('requestBtn').onclick=async()=>{try{const nums=['pickupLat','pickupLng','dropLat','dropLng'].map(x=>Number($(x).value));if(nums.some(x=>!Number.isFinite(x)))throw Error('أدخل إحداثيات الانطلاق والوصول');const d=await api('/rides',{method:'POST',body:JSON.stringify({serviceType:$('service').value,pickup:{lat:nums[0],lng:nums[1]},dropoff:{lat:nums[2],lng:nums[3]},pickupAddress:$('pickupAddress').value,dropoffAddress:$('dropoffAddress').value})});rideId=d.data.ride._id;localStorage.setItem('waslha_ride',rideId);render(d.data.ride)}catch(e){alert(e.message)}};async function refresh(){try{const d=await api('/rides/'+rideId);render(d.data)}catch(e){rideId=null;localStorage.removeItem('waslha_ride')}}function render(r){$('status').textContent='حالة الرحلة: '+r.status+' | السعر التقديري: '+(r.estimatedFare??'-');$('cancelBtn').classList.toggle('hidden',['trip_completed','cancelled'].includes(r.status))}$('cancelBtn').onclick=async()=>{try{const d=await api('/rides/'+rideId+'/cancel',{method:'POST',body:JSON.stringify({reason:'إلغاء من الزبون'})});render(d.data)}catch(e){alert(e.message)}};showApp()})()</script>
