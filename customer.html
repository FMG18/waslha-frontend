<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وصلها | الزبون</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html" style="text-decoration:none;color:inherit"><span class="logo">و</span><span>وصلها</span></a><button class="ghost" onclick="logout()">تسجيل الخروج</button></header><section id="auth" class="grid"><div class="col-6 card"><h2>مرحباً بك 👋</h2><p class="muted">سجّل دخولك أو أنشئ حساب زبون جديد.</p><form id="loginForm" class="form"><div class="field"><label>رقم الهاتف</label><input id="loginPhone" autocomplete="username" placeholder="+9647701234567" required></div><div class="field"><label>كلمة المرور</label><input id="loginPassword" autocomplete="current-password" type="password" required></div><button class="btn">تسجيل الدخول</button></form></div><div class="col-6 card"><h2>حساب جديد</h2><form id="registerForm" class="form"><div class="field"><label>الاسم</label><input id="regName" autocomplete="name" required></div><div class="field"><label>رقم الهاتف</label><input id="regPhone" placeholder="+964..." required></div><div class="field"><label>كلمة المرور</label><input id="regPassword" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn">إنشاء حساب</button></form></div></section><section id="app" class="hidden"><div class="card" style="margin-bottom:18px"><span class="badge">● متصل</span><h2 id="welcome">لوحة الزبون</h2><p class="muted">اطلب رحلتك وتابعها لحظة بلحظة.</p></div><div class="grid"><div class="col-8 card"><h3>طلب رحلة جديدة</h3><div class="field"><label>نوع الخدمة</label><select id="service"><option value="taxi">🚕 تكسي</option><option value="motorcycle">🏍️ دراجة نارية</option><option value="delivery">📦 توصيل</option></select></div><div class="grid" style="margin-top:12px"><div class="col-6"><div class="field"><label>خط عرض الانطلاق</label><input id="pickupLat" type="number" step="any" required></div></div><div class="col-6"><div class="field"><label>خط طول الانطلاق</label><input id="pickupLng" type="number" step="any" required></div></div><div class="col-12"><button class="btn light" type="button" onclick="fillLocation('pickupLat','pickupLng')">📍 استخدام موقعي الحالي</button></div><div class="col-6"><div class="field"><label>خط عرض الوصول</label><input id="dropLat" type="number" step="any" required></div></div><div class="col-6"><div class="field"><label>خط طول الوصول</label><input id="dropLng" type="number" step="any" required></div></div></div><div class="form" style="margin-top:12px"><div class="field"><label>عنوان الانطلاق</label><input id="pickupAddress" maxlength="300" placeholder="مثال: شارع فلسطين"></div><div class="field"><label>عنوان الوصول</label><input id="dropoffAddress" maxlength="300" placeholder="مثال: المنصور"></div><button id="requestBtn" class="btn">🚕 اطلب الرحلة</button></div></div><div class="col-4 card"><h3>حالة الرحلة</h3><div id="status" class="status">لا توجد رحلة نشطة.</div><div id="fare" class="stat hidden"><span class="muted">السعر التقديري</span><b>—</b></div><button id="cancelBtn" class="btn danger hidden" style="margin-top:12px">إلغاء الرحلة</button></div></div></section></main><script src="assets/app.js"></script><script>(async()=>{let rideId=localStorage.getItem('waslha_ride'),timer=null;function show(){const u=user();$('auth').classList.toggle('hidden',!!token);$('app').classList.toggle('hidden',!token);if(u)$('welcome').textContent='مرحباً '+(u.name||'');if(token&&rideId){refresh();clearInterval(timer);timer=setInterval(refresh,5000)}}async function refresh(){try{const d=await api('/rides/'+rideId);render(d.data)}catch(e){if(/401|403|not found/i.test(e.message)){localStorage.removeItem('waslha_ride');rideId=null;clearInterval(timer)}else toast(e.message)}}function render(r){$('status').innerHTML='<b>'+statusLabel(r.status)+'</b><br><span class="muted">رقم الرحلة: '+r._id+'</span>';if(r.estimatedFare!=null){$('fare').classList.remove('hidden');$('fare').querySelector('b').textContent=money(r.estimatedFare)}$('cancelBtn').classList.toggle('hidden',['trip_completed','cancelled'].includes(r.status));if(['trip_completed','cancelled'].includes(r.status)){clearInterval(timer);localStorage.removeItem('waslha_ride');rideId=null}}$('loginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;try{setBusy(b,true);const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('loginPhone').value.trim(),password:$('loginPassword').value})});if(d.data.user.role!=='customer')throw Error('هذا الحساب ليس حساب زبون');saveAuth(d.data);show()}catch(e){toast(e.message)}finally{setBusy(b,false)}};$('registerForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;try{setBusy(b,true);const d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:$('regName').value.trim(),phone:$('regPhone').value.trim(),password:$('regPassword').value,role:'customer'})});saveAuth(d.data);show()}catch(e){toast(e.message)}finally{setBusy(b,false)}};$('requestBtn').onclick=async()=>{try{if(rideId)throw Error('لديك رحلة نشطة حالياً');setBusy($('requestBtn'),true);const [a,b,c,d]=coordsFromForm(['pickupLat','pickupLng','dropLat','dropLng']);if(a===c&&b===d)throw Error('موقع الوصول يجب أن يختلف عن الانطلاق');const res=await api('/rides',{method:'POST',body:JSON.stringify({serviceType:$('service').value,pickup:{lat:a,lng:b},dropoff:{lat:c,lng:d},pickupAddress:$('pickupAddress').value.trim(),dropoffAddress:$('dropoffAddress').value.trim()})});rideId=res.data.ride._id;localStorage.setItem('waslha_ride',rideId);render(res.data.ride);clearInterval(timer);timer=setInterval(refresh,5000);toast(res.data.offer?'تم إرسال الطلب إلى كابتن قريب':'تم إنشاء الطلب، نبحث عن كابتن')}catch(e){toast(e.message)}finally{setBusy($('requestBtn'),false)}};$('cancelBtn').onclick=async()=>{try{setBusy($('cancelBtn'),true);const d=await api('/rides/'+rideId+'/cancel',{method:'POST',body:JSON.stringify({reason:'إلغاء من الزبون'})});render(d.data);toast('تم إلغاء الرحلة')}catch(e){toast(e.message)}finally{setBusy($('cancelBtn'),false)}};show()})()</script></body></html>
