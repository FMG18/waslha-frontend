<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | حساب الزبون</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="shell has-app-nav"><section id="app" style="padding:18px 0 45px"><div class="card" style="margin-bottom:18px"><span class="badge">● وصلها</span><h1 id="welcome" style="font-size:clamp(30px,5vw,48px);margin:10px 0 3px">لوحة الزبون</h1><p class="muted">حدد وجهتك وسنرسل طلبك إلى النظام.</p></div><div class="grid"><div id="newRide" class="col-8 card"><span class="badge">رحلة جديدة</span><h2 style="margin-top:8px">إلى أين تريد الذهاب؟</h2><div class="field" style="margin-top:18px"><label>نوع الخدمة</label><select id="service"><option value="taxi">🚕 سيارة</option><option value="motorcycle">🏍️ دراجة نارية</option><option value="delivery">📦 توصيل</option></select></div><div id="rideMap" class="mapbox" style="height:340px;margin-top:16px"></div><div class="grid" style="margin-top:14px"><div class="col-6"><div class="field"><label>خط عرض الانطلاق</label><input id="pickupLat" type="number" step="any"></div></div><div class="col-6"><div class="field"><label>خط طول الانطلاق</label><input id="pickupLng" type="number" step="any"></div></div><div class="col-12"><button id="locateBtn" class="btn light" type="button">📍 استخدام موقعي الحالي</button></div><div class="col-6"><div class="field"><label>خط عرض الوصول</label><input id="dropLat" type="number" step="any"></div></div><div class="col-6"><div class="field"><label>خط طول الوصول</label><input id="dropLng" type="number" step="any"></div></div></div><div class="form" style="margin-top:14px"><div class="field"><label>عنوان الانطلاق <span class="muted">اختياري</span></label><input id="pickupAddress" maxlength="300"></div><div class="field"><label>عنوان الوصول <span class="muted">اختياري</span></label><input id="dropoffAddress" maxlength="300"></div><button id="requestBtn" class="btn">🚕 تأكيد طلب الرحلة</button></div></div><div class="col-4"><div class="card" style="margin-bottom:18px"><span class="badge">تتبع مباشر</span><h3 style="margin-top:12px">حالة الرحلة</h3><div id="status" class="status">لا توجد رحلة نشطة.</div><div id="fare" class="stat hidden"><span class="muted">السعر التقديري</span><b>—</b></div><button id="cancelBtn" class="btn danger hidden" style="margin-top:12px">إلغاء الرحلة</button></div><div class="card"><h3>رحلاتي</h3><a class="ghost" href="rides.html" style="display:block;text-align:center">عرض سجل الرحلات</a></div></div></div></section></main><script src="assets/app.js"></script><script src="assets/map.js"></script><script>(async()=>{if(!requireRole('customer'))return;const u=user();$('welcome').textContent='مرحباً '+(u?.name||'');let activeRide=null,rideTimer=null;async function restoreRide(){const id=localStorage.getItem('waslha_ride');if(!id)return;try{const d=await api('/rides/'+id);activeRide=d.data;renderRide();if(activeRide&&!['trip_completed','cancelled'].includes(activeRide.status)){clearInterval(rideTimer);rideTimer=setInterval(refreshRide,6000)}}catch(e){localStorage.removeItem('waslha_ride')}}async function refreshRide(){if(!activeRide?._id)return;try{const d=await api('/rides/'+activeRide._id);activeRide=d.data;renderRide()}catch(e){}}function renderRide(){const r=activeRide;if(!r)return;$('status').innerHTML='<b>'+statusLabel(r.status)+'</b><br><span class="muted">'+(r.captain?.user?.name?('الكابتن: '+r.captain.user.name):'بانتظار التحديث...')+'</span>';if(r.estimatedFare!=null){$('fare').classList.remove('hidden');$('fare').querySelector('b').textContent=money(r.estimatedFare)}if(['trip_completed','cancelled'].includes(r.status)){$('cancelBtn').classList.add('hidden');clearInterval(rideTimer)}}$('locateBtn').onclick=()=>fillLocation('pickupLat','pickupLng');$('requestBtn').onclick=async()=>{const b=$('requestBtn');try{const c=['pickupLat','pickupLng','dropLat','dropLng'].map(id=>Number($(id).value));if(c.some(x=>!Number.isFinite(x)))throw Error('حدد موقع الانطلاق والوصول أولاً');setBusy(b,true,'جارٍ إرسال الطلب...');const d=await api('/rides',{method:'POST',body:JSON.stringify({serviceType:$('service').value,pickup:{lat:c[0],lng:c[1],address:$('pickupAddress').value.trim()},dropoff:{lat:c[2],lng:c[3],address:$('dropoffAddress').value.trim()}})});activeRide=d.data;localStorage.setItem('waslha_ride',activeRide._id);renderRide();$('cancelBtn').classList.remove('hidden');clearInterval(rideTimer);rideTimer=setInterval(refreshRide,6000);toast('تم إرسال طلب الرحلة')}catch(e){toast(e.message)}finally{setBusy(b,false)}};$('cancelBtn').onclick=async()=>{if(!activeRide?._id)return;const b=$('cancelBtn');try{setBusy(b,true,'جارٍ الإلغاء...');await api('/rides/'+activeRide._id+'/cancel',{method:'POST'});activeRide=null;localStorage.removeItem('waslha_ride');clearInterval(rideTimer);$('status').textContent='تم إلغاء الرحلة';$('cancelBtn').classList.add('hidden')}catch(e){toast(e.message)}finally{setBusy(b,false)}};setTimeout(()=>window.WaslhaMap?.init({container:'rideMap',pickupLat:'pickupLat',pickupLng:'pickupLng',dropLat:'dropLat',dropLng:'dropLng'}),100);await restoreRide()})()</script></body></html>
