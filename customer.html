 class="service-title"><b>اختر الخدمة</b><span>حسب احتياجك</span></div><div class="service-options"><button class="service-option selected" data-service="taxi" type="button"><span>🚕</span><b>سيارة</b><small>رحلة مريحة</small></button><button class="service-option" data-service="motorcycle" type="button"><span>🏍️</span><b>دراجة</b><small>أسرع داخل المدينة</small></button><button class="service-option" data-service="delivery" type="button"><span>📦</span><b>توصيل</b><small>طرود وطلبات</small></button></div><div id="routeSummary" class="route-summary hidden"><div><small>المسافة</small><b id="distanceValue">—</b></div><div><small>الوقت المتوقع</small><b id="durationValue">—</b></div><div><small>السعر التقديري</small><b id="fareValue">—</b></div></div><input id="pickupAddress" type="hidden"><input id="dropoffAddress" type="hidden"><button id="requestBtn" class="request-btn" type="button" disabled>حدد الوجهة أولاً</button><div id="status" class="ride-status">جاهز لطلب رحلة.</div><button id="cancelBtn" class="btn danger hidden" type="button">إلغاء الرحلة</button><a class="rides-link" href="rides.html">سجل رحلاتي ←</a></aside></section></main><script src="assets/app.js?v=2026.09.03"></script><script src="assets/map.js?v=2026.09.03"></script><script>(async()=>{if(!requireRole('customer'))return;const u=user();$('welcome').textContent='مرحباً '+(u?.name||'');let mapApi=null,pickup=null,dropoff=null,service=localStorage.getItem('waslha_service')||'taxi',activeRide=null,rideTimer=null,searchTimer=null,mode='pickup',settingMode=false;window.__waslhaCustomerState={get pickup(){return pickup},get dropoff(){return dropoff},get service(){return service},get mapApi(){return mapApi}};const terminal=['trip_completed','cancelled'];const normalize=d=>d?.data?.ride||d?.data||d;const money=v=>Number(v||0).toLocaleString('ar-SY')+' ل.س';const pricing={taxi:{baseFare:25000,pricePerKm:5000,pricePerMinute:700,minimumFare:30000,multiplier:1},motorcycle:{baseFare:12000,pricePerKm:3000,pricePerMinute:450,minimumFare:15000,multiplier:0.8},delivery:{baseFare:15000,pricePerKm:3500,pricePerMinute:500,minimumFare:18000,multiplier:0.9}};function updateButton(){const ok=!!(pickup&&dropoff);$('requestBtn').disabled=!ok;$('requestBtn').textContent=ok?'🚕 اطلب الرحلة الآن':'حدد الوجهة أولاً';$('resetMapBtn').classList.toggle('hidden',!ok)}function updateText(){$('pickupText').textContent=pickup?($('pickupAddress').value||'تم تحديد الموقع'):'حدد موقع الانطلاق';$('dropoffText').textContent=dropoff?($('dropoffAddress').value||'تم تحديد الوجهة'):'إلى أين؟';updateButton()}function paintMode(m){mode=m;$('mapHint').textContent=m==='pickup'?'اضغط على الخريطة لتحديد الانطلاق.':m==='dropoff'?'اضغط على الخريطة لتحديد الوجهة.':'تم تحديد نقاط الرحلة.';$('pickupFocus').classList.toggle('active',m==='pickup');$('dropoffFocus').classList.toggle('active',m==='dropoff')}function setMode(m){mode=m;paintMode(m);if(mapApi&&!settingMode){settingMode=true;try{mapApi.setSelectionMode(m)}finally{settingMode=false}}}function setAddress(type,p){const value=p?.formatted||p?.address_line1||p?.city||'تم تحديد الموقع';$(type==='pickup'?'pickupAddress':'dropoffAddress').value=value;updateText()}function renderRoute(r){const box=$('routeSummary');if(!r){box.classList.add('hidden');return}box.classList.remove('hidden');$('distanceValue').textContent=Number(r.distanceKm||0).toFixed(1)+' كم';$('durationValue').textContent=(r.durationMinutes||1)+' دقيقة';const p=pricing[service]||pricing.taxi;const distance=Number(r.distanceKm||0),minutes=Number(r.durationMinutes||0);const fare=Math.max(p.minimumFare,Math.round((p.baseFare+distance*p.pricePerKm+minutes*p.pricePerMinute)*p.multiplier));$('fareValue').textContent=money(fare)}function selectResult(r){const p=[Number(r.lon),Number(r.lat)];if(mode==='pickup'){pickup=p;mapApi.setPoints(p,null);setAddress('pickup',r);setMode('dropoff')}else{dropoff=p;mapApi.setPoints(pickup,p);setAddress('dropoff',r);mapApi.route().then(renderRoute).catch(()=>{})}$('searchResult sList.add('selected')}b.onclick=()=>{document.querySelectorAll('.service-option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');service=b.dataset.service;localStorage.setItem('waslha_service',service);if(pickup&&dropoff)mapApi?.route().then(renderRoute).catch(()=>{})}});async function requestRide(){const b=$('requestBtn');try{if(!pickup||!dropoff){const p=mapApi?.getPoints?.()||{};pickup=pickup||p.pickup;dropoff=dropoff||p.dropoff;updateText()}if(!pickup||!dropoff)throw Error('حدد الانطلاق والوجهة أولاً');if(!token){throw Error('انتهت جلسة الدخول، سجّل الدخول من جديد')}setBusy(b,true,'جارٍ إرسال الطلب...');const d=await api('/rides',{method:'POST',body:JSON.stringify({serviceType:service,pickup:{lat:Number(pickup[1]),lng:Number(pickup[0])},dropoff:{lat:Number(dropoff[1]),lng:Number(dropoff[0])},pickupAddress:$('pickupAddress').value,dropoffAddress:$('dropoffAddress').value,couponCode:localStorage.getItem('waslha_coupon')||undefined})});activeRide=normalize(d);if(!activeRide?._id)throw Error('لم يصل رقم الرحلة');localStorage.setItem('waslha_ride',activeRide._id);renderRide();$('cancelBtn').classList.remove('hidden');clearInterval(rideTimer);rideTimer=setInterval(refreshRide,5000);toast('تم إرسال طلب الرحلة')}catch(e){console.error('Waslha ride request failed',e);toast(e?.message||'تعذر إرسال طلب الرحلة')}finally{setBusy(b,false)}}$('requestBtn').onclick=requestRide;async function refreshRide(){if(!activeRide?._id)return;try{activeRide=normalize(await api('/rides/'+activeRide._id));renderRide()}catch{}}function renderRide(){const r=activeRide;if(!r)return;$('status').innerHTML='<b>'+statusLabel(r.status)+'</b>'+(r.captain?.user?.name?'<br><small>الكابتن: '+r.captain.user.name+'</small>':'');const lat=r.captain?.location?.lat??r.captain?.currentLocation?.lat,lng=r.captain?.location?.lng??r.captain?.currentLocation?.lng;if(Number.isFinite(+lat)&&Number.isFinite(+lng))mapApi?.setDriver(lat,lng);if(terminal.includes(r.status)){clearInterval(rideTimer);$('cancelBtn').classList.add('hidden')}}$('cancelBtn').onclick=async()=>{if(!activeRide?._id)return;try{await api('/rides/'+activeRide._id+'/cancel',{method:'POST'});activeRide=null;clearInterval(rideTimer);localStorage.removeItem('waslha_ride');$('status').textContent='تم إلغاء الرحلة';$('cancelBtn').classList.add('hidden')}catch(e){toast(e.message)}};mapApi=await window.WaslhaMap.init({container:'rideMap',interactive:true,routingMode:'drive',onSelectionModeChange:m=>{if(m==='pickup'||m==='dropoff'){mode=m;paintMode(m)}},onMapClick:(p,type)=>{if(type==='pickup')pickup=p;if(type==='dropoff')dropoff=p;updateText()},onAddress:setAddress,onRoute:renderRoute,onRouteError:e=>toast(e.message)});if(!mapApi)return;paintMode(mapApi.getPoints().mode||'pickup');updateText()})()</script></body></html>
