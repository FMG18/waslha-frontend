<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>وصلها - الزبون</title><style>body{font-family:Arial;margin:0;background:#f5f6f8;color:#222}.wrap{max-width:520px;margin:auto;padding:20px}.card{background:#fff;padding:18px;border-radius:16px;margin-bottom:14px;box-shadow:0 2px 10px #0001}input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{background:#28a745;color:#fff;border:0;font-weight:bold}.secondary{background:#555}.danger{background:#dc3545}.hidden{display:none}.status{padding:12px;background:#eef7ff;border-radius:10px;margin:10px 0}</style></head><body><div class="wrap"><div class="card"><h2>وصلها 🚕</h2><div id="auth"><input id="name" placeholder="الاسم"><input id="phone" placeholder="رقم الهاتف"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="register()">إنشاء حساب</button><button class="secondary" onclick="login()">تسجيل الدخول</button></div><div id="app" class="hidden"><p id="userInfo"></p><button class="secondary" onclick="logout()">تسجيل الخروج</button><select id="service"><option value="taxi">تكسي</option><option value="motorcycle">دراجة نارية</option><option value="delivery">شحن بري</option></select><input id="pickupLat" type="number" step="any" placeholder="خط عرض الانطلاق"><input id="pickupLng" type="number" step="any" placeholder="خط طول الانطلاق"><input id="dropLat" type="number" step="any" placeholder="خط عرض الوصول"><input id="dropLng" type="number" step="any" placeholder="خط طول الوصول"><input id="pickupAddress" placeholder="عنوان الانطلاق"><input id="dropoffAddress" placeholder="عنوان الوصول"><button onclick="requestRide()">طلب الرحلة</button><div id="status" class="status">لا توجد رحلة حالياً</div><button id="cancel" class="danger hidden" onclick="cancelRide()">إلغاء الرحلة</button></div></div></div><script>const API='https://waslha-backend.vercel.app/api';let token=localStorage.getItem('waslha_token'),ride=null;const $=id=>document.getElementById(id);function setAuth(){const ok=!!token;$('auth').classList.toggle('hidden',ok);$('app').classList.toggle('hidden',!ok);if(ok){const u=JSON.parse(localStorage.getItem('waslha_user')||'{}');$('userInfo').textContent='مرحباً '+(u.name||'');}}async function api(path,options={}){options.headers={...(options.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(API+path,options);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d?.error?.message||d?.message||'حدث خطأ');return d;}async function register(){try{const d=await api('/auth/register',{method:'POST',body:JSON.stringify({name:$('name').value,phone:$('phone').value,password:$('password').value,role:'customer'})});save(d.data)}catch(e){alert(e.message)}}async function login(){try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value,password:$('password').value})});save(d.data)}catch(e){alert(e.message)}}function save(d){token=d.token;localStorage.setItem('waslha_token',token);localStorage.setItem('waslha_user',JSON.stringify(d.user));setAuth()}function logout(){localStorage.clear();token=null;setAuth()}async function requestRide(){try{const body={serviceType:$('service').value,pickup:{lat:+$('pickupLat').value,lng:+$('pickupLng').value},dropoff:{lat:+$('dropLat').value,lng:+$('dropLng').value},pickupAddress:$('pickupAddress').value,dropoffAddress:$('dropoffAddress').value};const d=await api('/rides',{method:'POST',body:JSON.stringify(body)});ride=d.data.ride;renderRide();}catch(e){alert(e.message)}}async function refreshRide(){if(!ride)return;try{const d=await api('/rides/'+ride._id);ride=d.data;renderRide()}catch(e){console.log(e.message)}}function renderRide(){if(!ride)return;$('status').textContent='حالة الرحلة: '+ride.status+' | السعر التقديري: '+(ride.estimatedFare??'-');$('cancel').classList.toggle('hidden',['trip_completed','cancelled'].includes(ride.status))}async function cancelRide(){if(!ride)return;try{const d=await api('/rides/'+ride._id+'/cancel',{method:'POST',body:JSON.stringify({reason:'إلغاء من الزبون'})});ride=d.data;renderRide()}catch(e){alert(e.message)}}setAuth();if(ride)setInterval(refreshRide,5000);</script></body></html>
