<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f9f6e"><title>وصلها | اطلب رحلتك</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/mobile.css"><style>
.ride-page{background:#f5f7f6;min-height:100vh}.ride-shell{max-width:1280px;margin:auto;padding:16px}.ride-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.ride-brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;font-size:20px}.ride-logo{width:38px;height:38px;border-radius:12px;background:#0f9f6e;color:#fff;display:grid;place-items:center;font-weight:900}.ride-user{display:flex;gap:12px;align-items:center}.ride-user a,.rides-link{color:#0f9f6e;font-weight:800;text-decoration:none}.ride-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.7fr);gap:16px}.ride-map-card{position:relative;height:620px;border-radius:22px;overflow:hidden;background:#e8efeb;box-shadow:0 10px 30px #0001}.ride-map{position:absolute;inset:0}.map-action{position:absolute;z-index:5;border:0;border-radius:13px;background:#fff;box-shadow:0 5px 18px #0002;padding:11px 14px;font-weight:800;cursor:pointer}.map-action.locate{top:14px;right:14px;width:48px;height:48px;padding:0;font-size:23px}.map-action.reset{top:14px;left:14px}.map-status{position:absolute;z-index:5;right:14px;left:14px;bottom:14px;padding:11px 13px;border-radius:13px;background:#ffffffe8;backdrop-filter:blur(8px);font-size:13px;font-weight:700}.ride-panel{background:#fff;border-radius:22px;padding:20px;box-shadow:0 10px 30px #0000000d}.ride-panel-head .eyebrow{color:#0f9f6e;font-weight:900;font-size:13px}.ride-panel-head h1{margin:5px 0;font-size:29px}.ride-panel-head p{margin:0 0 16px;color:#6b7280;font-size:14px}.place-picker{border:1px solid #e4e8e6;border-radius:15px;padding:4px}.place-row{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:11px 7px;text-align:right;cursor:pointer}.place-row.active{background:#f1faf6;border-radius:11px}.place-dot{width:12px;height:12px;border-radius:50%;flex:none}.pickup-dot{background:#0f9f6e}.dropoff-dot{background:#2563eb}.place-copy{flex:1;min-width:0;display:grid;gap:3px}.place-copy small{color:#7a828a}.place-copy b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.place-line{height:1px;background:#edf0ef;margin:0 20px}.search-box{position:relative;display:flex;align-items:center;gap:7px;margin-top:11px;border:1px solid #e4e8e6;border-radius:14px;padding:0 11px}.search-box input{width:100%;border:0;outline:0;padding:13px 0;background:transparent}.search-box>button{border:0;background:transparent;font-size:21px;cursor:pointer}.search-results{position:absolute;z-index:30;top:52px;right:0;left:0;background:#fff;border:1px solid #e4e8e6;border-radius:13px;box-shadow:0 12px 28px #0002;overflow:hidden}.search-results button{display:block;width:100%;border:0;background:#fff;text-align:right;padding:11px;cursor:pointer}.search-results b,.search-results small{display:block}.search-results small{color:#77808a;margin-top:3px}.search-empty{padding:13px;color:#77808a}.service-title{display:flex;justify-content:space-between;margin:17px 2px 8px}.service-title span{color:#8a929a;font-size:12px}.service-options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.service-option{border:1px solid #e3e7e5;border-radius:13px;background:#fff;padding:10px 5px;display:grid;gap:3px;text-align:center;cursor:pointer}.service-option.selected{border-color:#0f9f6e;background:#f1faf6}.service-option span{font-size:21px}.service-option small{font-size:10px;color:#818991}.route-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.route-summary div{background:#f5f7f6;border-radius:11px;padding:9px}.route-summary small,.route-summary b{display:block}.route-summary small{font-size:10px;color:#7b838b}.route-summary b{margin-top:3px;font-size:13px}.request-btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:13px;background:#0f9f6e;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.request-btn:disabled{opacity:.5;cursor:not-allowed}.ride-status{margin-top:9px;padding:10px;border-radius:11px;background:#f6f8f7;color:#5f6871;font-size:13px}.hidden{display:none!important}@media(max-width:850px){.ride-shell{padding:9px}.ride-layout{display:flex;flex-direction:column}.ride-map-card{height:48vh;min-height:380px;border-radius:19px}.ride-panel{border-radius:19px;padding:15px}.ride-panel-head h1{font-size:25px}}
</style></head><body class="ride-page"><main class="ride-shell"><header class="ride-top"><a class="ride-brand" href="index.html"><span class="ride-logo">و</span><b>وصلها</b></a><div class="ride-user"><span id="welcome">مرحباً</span><a href="profile.html">حسابي</a></div></header><section class="ride-layout"><div class="ride-map-card"><div id="rideMap" class="ride-map"></div><button id="locateBtn" class="map-action locate" type="button">⌖</button><button id="resetMapBtn" class="map-action reset hidden" type="button">تعديل المواقع</button><div id="mapHint" class="map-status">حدد نقطة الانطلاق، ثم الوجهة.</div></div><aside class="ride-panel"><div class="ride-panel-head"><span class="eyebrow">رحلة جديدة</span><h1>إلى أين تريد الذهاب؟</h1><p>حدد الانطلاق والوجهة واحصل على الطريق والوقت والتكلفة التقديرية.</p></div><div class="place-picker"><button id="pickupFocus" class="place-row active" type="button"><span class="place-dot pickup-dot"></span><span class="place-copy"><small>نقطة الانطلاق</small><b id="pickupText">حدد موقع الانطلاق</b></span><span>‹</span></button><div class="place-line"></div><button id="dropoffFocus" class="place-row" type="button"><span class="place-dot dropoff-dot"></span><span class="place-copy"><small>الوجهة</small><b id="dropoffText">إلى أين؟</b></span><span>‹</span></button></div><div class="search-box"><span>⌕</span><input id="placeSearch" autocomplete="off" placeholder="ابحث عن شارع، منطقة أو مكان"><button id="clearSearch" class="hidden" type="button">×</button><div id="searchResults" class="search-results hidden"></div></div><div class="service-title"><b>اختر الخدمة</b><span>حسب احتياجك</span></div><div class="service-options"><button class="service-option selected" data-service="taxi" type="button"><span>🚕</span><b>سيارة</b><small>رحلة مريحة</small></button><button class="service-option" data-service="motorcycle" type="button"><span>🏍️</span><b>دراجة</b><small>سريعة</small></button><button class="service-option" data-service="delivery" type="button"><span>📦</span><b>توصيل</b><small>طلبات وطرود</small></button></div><div id="routeSummary" class="route-summary hidden"><div><small>المسافة</small><b id="distanceValue">—</b></div><div><small>الوقت</small><b id="durationValue">—</b></div><div><small>التقديري</small><b id="fareValue">—</b></div></div><input id="pickupAddress" type="hidden"><input id="dropoffAddress" type="hidden"><button id="requestBtn" class="request-btn" type="button" disabled>حدد الوجهة أولاً</button><div id="status" class="ride-status">جاهز لطلب رحلة.</div><button id="cancelBtn" class="btn danger hidden" type="button">إلغاء الرحلة</button><a class="rides-link" href="rides.html">سجل رحلاتي ←</a></aside></section></main><script src="assets/app.js?v=stable-customer"></script><script src="assets/map.js?v=stable-customer"></script><script>(async()=>{try{if(!requireRole('customer'))return;const u=user();$('welcome').textContent='مرحباً '+(u?.name||'');let mapApi=null,pickup=null,dropoff=null,service='taxi',activeRide=null,rideTimer=null,searchTimer=null;const terminal=['trip_completed','cancelled'];const money=v=>Number(v||0).toLocaleString('ar-IQ')+' د.ع';const ui=()=>{const ok=!!(pickup&&dropoff);$('pickupText').textContent=pickup?($('pickupAddress').value||'تم تحديد الموقع'):'حدد موقع الانطلاق';$('dropoffText').textContent=dropoff?($('dropoffAddress').value||'تم تحديد الوجهة'):'إلى أين؟';$('requestBtn').disabled=!ok;$('requestBtn').textContent=ok?'🚕 اطلب الرحلة الآن':'حدد الوجهة أولاً';$('resetMapBtn').classList.toggle('hidden',!ok)};const setMode=m=>{mapApi?.setSelectionMode?.(m);$('pickupFocus').classList.toggle('active',m==='pickup');$('dropoffFocus').classList.toggle('active',m==='dropoff');$('mapHint').textContent=m==='pickup'?'حدد نقطة الانطلاق من الخريطة.':'حدد الوجهة من الخريطة.'};const setAddr=(t,p)=>{$(t==='pickup'?'pickupAddress':'dropoffAddress').value=p?.formatted||p?.address_line1||p?.city||'تم تحديد الموقع';ui()};const showRoute=r=>{if(!r){$('routeSummary').classList.add('hidden');return}$('routeSummary').classList.remove('hidden');$('distanceValue').textContent=Number(r.distanceKm||0).toFixed(1)+' كم';$('durationValue').textContent=(r.durationMinutes||1)+' دقيقة';const base=service==='motorcycle'?900:service==='delivery'?1500:2000;$('fareValue').textContent=money(Math.max(base,Math.round(base+(r.distanceKm||0)*700)))};mapApi=await window.WaslhaMap?.init({container:'rideMap',interactive:true,routingMode:'drive',onSelectionModeChange:m=>{if(m==='pickup'||m==='dropoff'){$('pickupFocus').classList.toggle('active',m==='pickup');$('dropoffFocus').classList.toggle('active',m==='dropoff')}},onMapClick:(p,t)=>{if(t==='pickup')pickup=p;if(t==='dropoff')dropoff=p;ui()},onAddress:setAddr,onRoute:showRoute,onRouteError:e=>toast(e.message)});if(!mapApi){$('mapHint').textContent='تعذر تشغيل الخريطة. تحقق من إعداد Geoapify.';return}const sync=()=>{const p=mapApi.getPoints?.()||{};pickup=p.pickup||pickup;dropoff=p.dropoff||dropoff;ui()};sync();setMode(mapApi.getPoints?.().mode||'pickup');$('pickupFocus').onclick=()=>setMode('pickup');$('dropoffFocus').onclick=()=>setMode('dropoff');$('locateBtn').onclick=()=>navigator.geolocation?.getCurrentPosition(async p=>{pickup=[p.coords.longitude,p.coords.latitude];mapApi.setPoints(pickup,null);try{setAddr('pickup',await mapApi.reverseGeocode(pickup[1],pickup[0]))}catch{}setMode('dropoff');ui()},()=>toast('تعذر الوصول إلى موقعك'),{enableHighAccuracy:true,timeout:12000,maximumAge:10000});$('resetMapBtn').onclick=()=>{pickup=null;dropoff=null;$('pickupAddress').value='';$('dropoffAddress').value='';mapApi.setPoints(null,null);setMode('pickup');ui()};$('placeSearch').oninput=()=>{clearTimeout(searchTimer);const q=$('placeSearch').value.trim();$('clearSearch').classList.toggle('hidden',!q);if(q.length<2){$('searchResults').classList.add('hidden');return}searchTimer=setTimeout(async()=>{try{const rs=await mapApi.autocomplete(q,pickup||undefined),box=$('searchResults');box.innerHTML='';if(!rs.length)box.innerHTML='<div class="search-empty">لا توجد نتائج مناسبة</div>';rs.forEach(r=>{const b=document.createElement('button');b.type='button';b.innerHTML='<b>'+String(r.address_line1||r.name||'مكان').replace(/</g,'&lt;')+'</b><small>'+String(r.address_line2||r.city||r.formatted||'').replace(/</g,'&lt;')+'</small>';b.onclick=()=>{const p=[Number(r.lon),Number(r.lat)];if(mapApi.getPoints().mode==='pickup'){pickup=p;mapApi.setPoints(p,null);setAddr('pickup',r);setMode('dropoff')}else{dropoff=p;mapApi.setPoints(pickup,p);setAddr('dropoff',r)}$('searchResults').classList.add('hidden');$('placeSearch').value='';$('clearSearch').classList.add('hidden');ui()};box.appendChild(b)});box.classList.remove('hidden')}catch(e){toast(e.message)}},250)};$('clearSearch').onclick=()=>{$('placeSearch').value='';$('searchResults').classList.add('hidden');$('clearSearch').classList.add('hidden')};document.querySelectorAll('.service-option').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.service-option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');service=b.dataset.service;if(pickup&&dropoff)showRoute(await mapApi.route())});$('requestBtn').onclick=async()=>{const b=$('requestBtn');try{sync();if(!pickup||!dropoff)throw Error('حدد الانطلاق والوجهة أولاً');setBusy(b,true,'جارٍ إرسال الطلب...');const d=await api('/rides',{method:'POST',body:JSON.stringify({serviceType:service,pickup:{lat:pickup[1],lng:pickup[0]},dropoff:{lat:dropoff[1],lng:dropoff[0]},pickupAddress:$('pickupAddress').value,dropoffAddress:$('dropoffAddress').value})});activeRide=d.data?.ride||d.data;if(!activeRide?._id)throw Error('لم يصل رقم الرحلة');localStorage.setItem('waslha_ride',activeRide._id);renderRide();$('cancelBtn').classList.remove('hidden');clearInterval(rideTimer);rideTimer=setInterval(refreshRide,5000);toast('تم إرسال طلب الرحلة')}catch(e){toast(e.message)}finally{setBusy(b,false)}};function renderRide(){if(!activeRide)return;$('status').innerHTML='<b>'+statusLabel(activeRide.status)+'</b>'+(activeRide.captain?.user?.name?'<br><small>الكابتن: '+activeRide.captain.user.name+'</small>':'');const lat=activeRide.captain?.location?.lat??activeRide.captain?.currentLocation?.lat,lng=activeRide.captain?.location?.lng??activeRide.captain?.currentLocation?.lng;if(Number.isFinite(+lat)&&Number.isFinite(+lng))mapApi.setDriver(lat,lng);if(terminal.includes(activeRide.status)){clearInterval(rideTimer);$('cancelBtn').classList.add('hidden')}}async function refreshRide(){if(!activeRide?._id)return;try{activeRide=(await api('/rides/'+activeRide._id)).data;renderRide()}catch{}}$('cancelBtn').onclick=async()=>{if(!activeRide?._id)return;try{await api('/rides/'+activeRide._id+'/cancel',{method:'POST'});activeRide=null;clearInterval(rideTimer);$('status').textContent='تم إلغاء الرحلة';$('cancelBtn').classList.add('hidden')}catch(e){toast(e.message)}};ui()}catch(e){const s=document.getElementById('status');if(s)s.textContent='تعذر تشغيل صفحة الطلب: '+e.message}})();</script></body></html>
