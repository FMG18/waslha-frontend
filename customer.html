<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وصلها - تطبيق الزبون</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
    #map { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    .panel { position: absolute; bottom: 30px; right: 20px; left: 20px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10; text-align: center; }
    button { width: 100%; padding: 14px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h3 style="margin-top:0;">طلب كابتن توصيل</h3>
    <button onclick="requestCaptain()">اطلب الآن (سوريا - دمشق)</button>
  </div>

  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoibm9tYWlsODg4ODkyIiwiYSI6ImNtdGZ2YnJ3NzA5eWsyd3BpdWNhaHR1b20ifQ.fBcCDKO-onzZat5QFZSDFw';
    
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v11',
      center: [36.2913, 33.5138],
      zoom: 13
    });

    map.addControl(new mapboxgl.NavigationControl());

    const socket = io('https://waslha-backend.vercel.app', {
      transports: ['websocket', 'polling']
    }); 

    function requestCaptain() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          const { latitude, longitude } = pos.coords;
          socket.emit('requestRide', { customerId: 'cust_1', lat: latitude, lng: longitude });
          alert('تم إرسال طلبك بنجاح!');
        }, () => {
          socket.emit('requestRide', { customerId: 'cust_1', lat: 33.5138, lng: 36.2913 });
          alert('تم إرسال الطلب بإحداثيات موقعك في دمشق!');
        });
      } else {
        socket.emit('requestRide', { customerId: 'cust_1', lat: 33.5138, lng: 36.2913 });
        alert('تم إرسال الطلب!');
      }
    }
  </script>
</body>
</html>
