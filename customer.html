<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f9f6e">
<title>وصلها | طلب رحلة</title>
<link rel="stylesheet" href="assets/style.css?v=customer-final-1">
<link rel="stylesheet" href="assets/mobile.css?v=customer-final-1">
<style>
:root{--w-green:#0f9f6e;--w-green-dark:#087d56;--w-bg:#f4f7f5;--w-border:#e3e9e5;--w-text:#17211c;--w-muted:#6f7974;--w-blue:#2563eb}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--w-bg);color:var(--w-text);font-family:Arial,"Noto Sans Arabic",sans-serif}button,input{font:inherit}.customer-page{min-height:100vh;background:var(--w-bg)}
.customer-wrap{max-width:1380px;margin:auto;padding:14px 18px 24px}.customer-head{height:58px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-size:20px;font-weight:900}.brand-mark{width:40px;height:40px;border-radius:13px;background:var(--w-green);color:#fff;display:grid;place-items:center;font-size:22px}.head-user{display:flex;align-items:center;gap:12px;font-size:14px}.head-user a{color:var(--w-green);text-decoration:none;font-weight:800}
.booking{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(340px,.75fr);gap:14px;align-items:stretch}.map-card{position:relative;min-height:650px;height:calc(100vh - 98px);max-height:780px;background:#dfe8e3;border:1px solid var(--w-border);border-radius:24px;overflow:hidden;box-shadow:0 10px 35px #10251b12}.map{position:absolute;inset:0}.map-cover{position:absolute;z-index:4;inset:0;display:grid;place-items:center;background:#eef4f0;color:var(--w-muted);padding:25px;text-align:center}.map-cover.hidden{display:none}.map-cover strong{display:block;color:var(--w-text);margin-bottom:6px}.map-cover small{display:block}.map-tools{position:absolute;z-index:10;top:14px;right:14px;display:flex;flex-direction:column;gap:8px}.map-btn{width:46px;height:46px;border:0;border-radius:14px;background:#fff;box-shadow:0 5px 18px #0002;cursor:pointer;font-size:20px}.map-btn:hover{transform:translateY(-1px)}.map-message{position:absolute;z-index:10;left:14px;right:14px;bottom:14px;background:#fffffff0;border:1px solid #ffffff;padding:11px 13px;border-radius:14px;box-shadow:0 6px 20px #0001;font-size:13px;font-weight:700;backdrop-filter:blur(8px)}
.panel{background:#fff;border:1px solid var(--w-border);border-radius:24px;padding:20px;box-shadow:0 10px 35px #10251b0c;display:flex;flex-direction:column;min-width:0}.eyebrow{color:var(--w-green);font-weight:900;font-size:13px}.panel h1{font-size:29px;line-height:1.2;margin:6px 0}.panel-intro{color:var(--w-muted);font-size:14px;line-height:1.6;margin:0 0 16px}
.points{border:1px solid var(--w-border);border-radius:16px;padding:5px}.point{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;text-align:right;padding:12px 8px;border-radius:12px;cursor:pointer}.point.active{background:#f0faf5}.point-dot{width:12px;height:12px;border-radius:50%;flex:none}.point-dot.from{background:var(--w-green);box-shadow:0 0 0 4px #0f9f6e18}.point-dot.to{background:var(--w-blue);box-shadow:0 0 0 4px #2563eb18}.point-body{min-width:0;flex:1}.point-body small{display:block;color:#858d88;font-size:11px;margin-bottom:3px}.point-body strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.point-arrow{color:#9aa29e;font-size:20px}.point-divider{height:1px;background:#edf1ef;margin:0 20px}
.search{position:relative;margin-top:11px}.search-input{width:100%;height:48px;border:1px solid var(--w-border);border-radius:14px;background:#fff;outline:none;padding:0 42px 0 38px}.search-input:focus{border-color:#9bd4bd;box-shadow:0 0 0 3px #0f9f6e12}.search-icon{position:absolute;right:13px;top:13px}.clear-search{position:absolute;left:8px;top:8px;width:32px;height:32px;border:0;background:transparent;cursor:pointer;color:#6d7671}.results{position:absolute;z-index:30;top:54px;right:0;left:0;background:#fff;border:1px solid var(--w-border);border-radius:14px;box-shadow:0 14px 35px #0002;overflow:hidden}.results.hidden{display:none}.result{display:block;width:100%;border:0;border-bottom:1px solid #eef1ef;background:#fff;text-align:right;padding:12px;cursor:pointer}.result:last-child{border-bottom:0}.result strong,.result small{display:block}.result small{color:#7c8580;margin-top:4px;font-size:11px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.section-title b{font-size:14px}.section-title span{font-size:11px;color:#8a928e}.services{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.service{border:1px solid var(--w-border);border-radius:14px;background:#fff;padding:10px 5px;text-align:center;cursor:pointer}.service.selected{border-color:var(--w-green);background:#effaf5;box-shadow:inset 0 0 0 1px var(--w-green)}.service .emoji{display:block;font-size:23px;margin-bottom:4px}.service b{display:block;font-size:12px}.service small{display:block;color:#8a928e;font-size:9px;margin-top:3px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.summary-item{background:#f5f8f6;border-radius:12px;padding:10px}.summary-item small{display:block;color:#818985;font-size:10px}.summary-item strong{display:block;font-size:13px;margin-top:4px}.primary{width:100%;border:0;border-radius:15px;background:var(--w-green);color:#fff;font-weight:900;padding:14px;margin-top:12px;cursor:pointer}.primary:hover{background:var(--w-green-dark)}.primary:disabled{opacity:.48;cursor:not-allowed}.secondary{width:100%;border:1px solid var(--w-border);background:#fff;color:var(--w-text);border-radius:14px;padding:11px;margin-top:8px;cursor:pointer}.status{margin-top:10px;border-radius:12px;background:#f5f8f6;padding:10px;font-size:12px;color:#5f6964;line-height:1.55}.rides{display:block;color:var(--w-green);font-size:13px;font-weight:800;text-decoration:none;margin-top:12px;text-align:center}.hidden{display:none!important}.waslha-center-pin{position:absolute;z-index:8;left:50%;top:50%;width:30px;height:40px;transform:translate(-50%,-100%);pointer-events:none}.waslha-center-pin span{position:absolute;left:7px;top:0;width:16px;height:16px;background:var(--w-green);border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 7px #0004}.waslha-marker{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 4px 12px #0003;font-size:14px}.waslha-marker::first-letter{transform:rotate(45deg)}.waslha-marker.pickup{background:var(--w-green);color:#fff}.waslha-marker.dropoff{background:var(--w-blue);color:#fff}.waslha-driver-marker{font-size:27px;filter:drop-shadow(0 3px 4px #0005)}
@media(max-width:900px){.customer-wrap{padding:8px}.customer-head{height:52px}.booking{display:flex;flex-direction:column}.map-card{height:53vh;min-height:360px;max-height:none;border-radius:20px}.panel{border-radius:20px;padding:14px}.panel h1{font-size:24px}.head-user span{display:none}.customer-head{margin-bottom:8px}.summary{grid-template-columns:repeat(3,1fr)}.services{gap:6px}}
@media(max-width:520px){.map-card{height:48vh;min-height:330px}.panel-intro{font-size:13px}.summary-item{padding:8px 7px}.summary-item strong{font-size:12px}.primary{padding:13px}}
</style>
</head>
<body class="customer-page">
<div class="customer-wrap">
<header class="customer-head"><a class="brand" href="index.html"><span class="brand-mark">و</span><span>وصلها</span></a><div class="head-user"><span id="welcome">مرحباً</span><a href="profile.html">حسابي</a></div></header>
<main class="booking">
<section class="map-card"><div id="rideMap" class="map"></div><div id="mapCover" class="map-cover"><div><strong>جاري تشغيل الخريطة…</strong><small>لحظات فقط</small></div></div><div class="map-tools"><button id="locateBtn" class="map-btn" type="button" title="موقعي">⌖</button><button id="resetBtn" class="map-btn hidden" type="button" title="إعادة الاختيار">↻</button></div><div id="mapMessage" class="map-message">حدد نقطة الانطلاق من الخريطة أو استخدم البحث.</div></section>
<aside class="panel">
<div><span class="eyebrow">رحلة جديدة</span><h1>إلى أين تريد الذهاب؟</h1><p class="panel-intro">اختر الانطلاق والوجهة، وسنحسب لك الطريق والوقت والتكلفة التقديرية.</p></div>
<div class="points"><button id="fromBtn" class="point active" type="button"><span class="point-dot from"></span><span class="point-body"><small>نقطة الانطلاق</small><strong id="fromText">حدد موقع الانطلاق</strong></span><span class="point-arrow">‹</span></button><div class="point-divider"></div><button id="toBtn" class="point" type="button"><span class="point-dot to"></span><span class="point-body"><small>الوجهة</small><strong id="toText">إلى أين؟</strong></span><span class="point-arrow">‹</span></button></div>
<div class="search"><span class="search-icon">⌕</span><input id="searchInput" class="search-input" autocomplete="off" placeholder="ابحث عن شارع، منطقة أو مكان"><button id="clearSearch" class="clear-search hidden" type="button">×</button><div id="results" class="results hidden"></div></div>
<div class="section-title"><b>نوع الخدمة</b><span>اختر ما يناسبك</span></div>
<div class="services"><button class="service selected" data-service="taxi" type="button"><span class="emoji">🚕</span><b>سيارة</b><small>مريحة</small></button><button class="service" data-service="motorcycle" type="button"><span class="emoji">🏍️</span><b>دراجة</b><small>سريعة</small></button><button class="service" data-service="delivery" type="button"><span class="emoji">📦</span><b>توصيل</b><small>طلبات وطرود</small></button></div>
<div id="summary" class="summary hidden"><div class="summary-item"><small>المسافة</small><strong id="distance">—</strong></div><div class="summary-item"><small>الوقت</small><strong id="duration">—</strong></div><div class="summary-item"><small>التقديري</small><strong id="fare">—</strong></div></div>
<button id="requestBtn" class="primary" type="button" disabled>حدد الوجهة أولاً</button><button id="cancelBtn" class="secondary hidden" type="button">إلغاء الرحلة</button><div id="status" class="status">جاهز لطلب رحلة.</div><a class="rides" href="rides.html">سجل رحلاتي ←</a>
</aside>
</main>
</div>
<script src="assets/app.js?v=customer-final-1"></script>
<script src="assets/map.js?v=customer-final-1"></script>
<script>
document.addEventListener('DOMContentLoaded',async()=>{
  if(typeof requireRole==='function'&&!requireRole('customer'))return;
  const $id=id=>document.getElementById(id), u=typeof user==='function'?user():null;
  $id('welcome').textContent='مرحباً '+(u?.name||'');
  let map=null,from=null,to=null,mode='pickup',service='taxi',ride=null,timer=null,searchTimer=null;
  const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const money=v=>Number(v||0).toLocaleString('ar-IQ')+' د.ع';
  function paint(){
    const ready=!!(from&&to);
    $id('fromText').textContent=from?($id('fromAddress').value||'تم تحديد الموقع'):'حدد موقع الانطلاق';
    $id('toText').textContent=to?($id('toAddress').value||'تم تحديد الوجهة'):'إلى أين؟';
    $id('requestBtn').disabled=!ready;
    $id('requestBtn').textContent=ready?'🚕 اطلب الرحلة الآن':'حدد الوجهة أولاً';
    $id('resetBtn').classList.toggle('hidden',!from&&!to);
    $id('fromBtn').classList.toggle('active',mode==='pickup');$id('toBtn').classList.toggle('active',mode==='dropoff');
  }
  function setMode(m){mode=m;map?.setSelectionMode?.(m);$id('mapMessage').textContent=m==='pickup'?'حدد نقطة الانطلاق من الخريطة.':'حدد الوجهة من الخريطة.';paint()}
  function address(kind,p){$id(kind==='pickup'?'fromAddress':'toAddress').value=p?.formatted||p?.address_line1||p?.city||'تم تحديد الموقع';paint()}
  function routeView(r){if(!r){$id('summary').classList.add('hidden');return}$id('summary').classList.remove('hidden');$id('distance').textContent=Number(r.distanceKm||0).toFixed(1)+' كم';$id('duration').textContent=(r.durationMinutes||1)+' دقيقة';const base=service==='motorcycle'?900:service==='delivery'?1500:2000;$id('fare').textContent=money(Math.max(base,Math.round(base+(r.distanceKm||0)*700)))}
  $id('fromAddress').value='';$id('toAddress').value='';
  try{
    map=await window.WaslhaMap.init({container:'rideMap',interactive:true,routingMode:'drive',onMapClick:(p,k)=>{if(k==='pickup')from=p;else if(k==='dropoff')to=p;paint()},onAddress:address,onRoute:routeView,onRouteError:e=>{if(typeof toast==='function')toast(e.message)},onSelectionModeChange:k=>{if(k==='pickup'||k==='dropoff'){mode=k;paint()}}});
    $id('mapCover').classList.add('hidden');
    if(!map){$id('mapMessage').textContent='تعذر تشغيل الخريطة. يمكنك المحاولة مجدداً.';return}
    setMode('pickup');
  }catch(e){$id('mapCover').innerHTML='<div><strong>تعذر تشغيل الخريطة</strong><small>'+esc(e.message)+'</small></div>';}
  $id('fromBtn').onclick=()=>setMode('pickup');$id('toBtn').onclick=()=>setMode('dropoff');
  $id('resetBtn').onclick=()=>{from=null;to=null;$id('fromAddress').value='';$id('toAddress').value='';map?.setPoints?.(null,null);setMode('pickup');routeView(null);paint()};
  $id('locateBtn').onclick=()=>navigator.geolocation?.getCurrentPosition(async p=>{from=[p.coords.longitude,p.coords.latitude];map?.setPoints?.(from,null);try{address('pickup',await map.reverseGeocode(p.coords.latitude,p.coords.longitude))}catch{}setMode('dropoff');paint()},()=>typeof toast==='function'&&toast('تعذر الوصول إلى موقعك'),{enableHighAccuracy:true,timeout:12000,maximumAge:10000});
  $id('searchInput').oninput=()=>{clearTimeout(searchTimer);const q=$id('searchInput').value.trim();$id('clearSearch').classList.toggle('hidden',!q);if(q.length<2){$id('results').classList.add('hidden');return}searchTimer=setTimeout(async()=>{try{const rs=await map.autocomplete(q,from||undefined),box=$id('results');box.innerHTML='';if(!rs.length){box.innerHTML='<div class="result">لا توجد نتائج مناسبة</div>'}rs.forEach(r=>{const b=document.createElement('button');b.className='result';b.type='button';b.innerHTML='<strong>'+esc(r.address_line1||r.name||'مكان')+'</strong><small>'+esc(r.address_line2||r.city||r.formatted||'')+'</small>';b.onclick=()=>{const p=[Number(r.lon),Number(r.lat)];if(mode==='pickup'){from=p;map.setPoints(p,null);address('pickup',r);setMode('dropoff')}else{to=p;map.setPoints(from,p);address('dropoff',r)}box.classList.add('hidden');$id('searchInput').value='';$id('clearSearch').classList.add('hidden');paint()};box.appendChild(b)});box.classList.remove('hidden')}catch(e){if(typeof toast==='function')toast(e.message)}},250)};
  $id('clearSearch').onclick=()=>{$id('searchInput').value='';$id('results').classList.add('hidden');$id('clearSearch').classList.add('hidden')};
  document.querySelectorAll('.service').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.service').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');service=b.dataset.service;if(from&&to)routeView(await map.route())});
  $id('requestBtn').onclick=async()=>{try{if(!from||!to)throw Error('حدد الانطلاق والوجهة أولاً');setBusy($id('requestBtn'),true,'جارٍ إرسال الطلب...');const d=await api('/rides',{method:'POST',body:JSON.stringify({serviceType:service,pickup:{lat:from[1],lng:from[0]},dropoff:{lat:to[1],lng:to[0]},pickupAddress:$id('fromAddress').value,dropoffAddress:$id('toAddress').value})});ride=d.data?.ride||d.data;if(!ride?._id)throw Error('لم يصل رقم الرحلة');localStorage.setItem('waslha_ride',ride._id);$id('cancelBtn').classList.remove('hidden');$id('status').textContent=statusLabel(ride.status);clearInterval(timer);timer=setInterval(async()=>{try{ride=(await api('/rides/'+ride._id)).data;$id('status').textContent=statusLabel(ride.status);if(['trip_completed','cancelled'].includes(ride.status))clearInterval(timer)}catch{}},5000);if(typeof toast==='function')toast('تم إرسال طلب الرحلة')}catch(e){if(typeof toast==='function')toast(e.message)}finally{setBusy($id('requestBtn'),false)}};
  $id('cancelBtn').onclick=async()=>{if(!ride?._id)return;try{await api('/rides/'+ride._id+'/cancel',{method:'POST'});clearInterval(timer);ride=null;$id('cancelBtn').classList.add('hidden');$id('status').textContent='تم إلغاء الرحلة'}catch(e){if(typeof toast==='function')toast(e.message)}};
  const fromInput=document.createElement('input');fromInput.id='fromAddress';fromInput.type='hidden';document.body.appendChild(fromInput);const toInput=document.createElement('input');toInput.id='toAddress';toInput.type='hidden';document.body.appendChild(toInput);paint();
});
</script>
</body>
</html>
