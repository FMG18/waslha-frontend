<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f9f6e"><title>وصلها | أرباح الكابتن</title><link rel="stylesheet" href="assets/style.css?v=2026.09.05"><link rel="stylesheet" href="assets/mobile.css?v=2026.09.05"><style>:root{--g:#0f9f6e;--bg:#f4f7f6;--bd:#e5ece9}body{background:var(--bg)}.page{max-width:900px;margin:auto;padding:14px 14px 80px}.hero{background:linear-gradient(135deg,#0f9f6e,#087653);color:#fff;border-radius:24px;padding:22px;box-shadow:0 14px 35px #08765322}.hero h1{margin:8px 0 4px}.hero p{margin:0;opacity:.85}.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.hero a{color:#fff;text-decoration:none;background:#ffffff20;border:1px solid #ffffff35;border-radius:12px;padding:9px 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:15px}.stat small{color:#71807a}.stat strong{display:block;font-size:20px;margin-top:6px}.panel{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:16px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.toolbar select{border:1px solid var(--bd);border-radius:11px;padding:9px;font:inherit;background:#fff}.summary{background:#f5faf8;border-radius:16px;padding:14px;margin-bottom:12px}.summary-row{display:flex;justify-content:space-between;padding:6px 0}.summary-row strong{color:#087b55}.tx{padding:14px 0;border-bottom:1px solid #edf1ef}.tx:last-child{border-bottom:0}.tx-top{display:flex;justify-content:space-between;gap:10px}.fare{font-size:18px;font-weight:800;color:#087b55;white-space:nowrap}.muted2{color:#71807a;font-size:12px;line-height:1.8}.tag{display:inline-block;background:#e8f7f1;color:#087b55;border-radius:9px;padding:4px 8px;font-size:11px;font-weight:700}.empty{padding:25px;text-align:center;color:#7b8984;background:#f7faf9;border-radius:15px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.hero-top{align-items:flex-start}}</style></head><body><main class="page"><section class="hero"><div class="hero-top"><div><span class="badge" style="background:#ffffff22;color:#fff">الكابتن</span><h1>الأرباح والمحفظة</h1><p>تابع دخلك من الرحلات المكتملة بشكل واضح.</p></div><a href="captain.html">العودة</a></div></section><section class="stats"><div class="stat"><small>أرباح اليوم</small><strong id="today">0 ل.س</strong></div><div class="stat"><small>أرباح الشهر</small><strong id="month">0 ل.س</strong></div><div class="stat"><small>إجمالي الأرباح</small><strong id="all">0 ل.س</strong></div></section><section class="panel"><div class="toolbar"><div><span class="badge">المعاملات</span><h2 style="margin:7px 0 0">سجل الأرباح</h2></div><select id="period"><option value="all">كل الفترة</option><option value="today">اليوم</option><option value="month">هذا الشهر</option></select></div><div class="summary"><div class="summary-row"><span>عدد الرحلات</span><strong id="count">0</strong></div><div class="summary-row"><span>متوسط الرحلة</span><strong id="avg">0 ل.س</strong></div></div><div id="list"><div class="empty">جارٍ التحميل...</div></div></section></main><script src="assets/app.js?v=2026.09.05"></script><script>(async()=>{if(!requireRole('captain'))return;let items=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('ar-SY')+' ل.س';const service=r=>r.serviceType==='taxi'?'🚕 تاكسي':r.serviceType==='motorcycle'?'🏍️ دراجة':'📦 توصيل';function dates(){const n=new Date(),d=new Date(n);d.setHours(0,0,0,0);return{now:n,day:d,month:new Date(n.getFullYear(),n.getMonth(),1)}}function render(){const p=$('period').value,{day,month}=dates();const shown=items.filter(r=>{const dt=new Date(r.completedAt||r.updatedAt||r.createdAt);return p==='today'?dt>=day:p==='month'?dt>=month:true});const total=shown.reduce((s,r)=>s+Number(r.finalFare??r.estimatedFare??r.fare??0),0);$('count').textContent=shown.length;$('avg').textContent=money(shown.length?total/shown.length:0);$('list').innerHTML=shown.length?shown.slice(0,50).map(r=>{const fare=Number(r.finalFare??r.estimatedFare??r.fare??0),dt=new Date(r.completedAt||r.updatedAt||r.createdAt);return `<article class="tx"><div class="tx-top"><div><span class="tag">${service(r)} • مكتملة</span><div style="margin-top:7px"><b>${esc(r.pickup?.address||'موقع الانطلاق')}</b> ← <b>${esc(r.dropoff?.address||'الوجهة')}</b></div></div><div class="fare">+${money(fare)}</div></div><div class="muted2">${dt.toLocaleString('ar-IQ')}</div></article>`}).join(''):'<div class="empty">لا توجد أرباح ضمن الفترة المحددة.</div>'}async function load(){try{const d=await api('/rides?status=trip_completed&limit=100');const x=d?.data||d;items=Array.isArray(x?.items)?x.items:Array.isArray(x)?x:[];const {day,month}=dates();let all=0,today=0,monthly=0;items.forEach(r=>{const n=Number(r.finalFare??r.estimatedFare??r.fare??0),dt=new Date(r.completedAt||r.updatedAt||r.createdAt);all+=n;if(dt>=day)today+=n;if(dt>=month)monthly+=n});$('today').textContent=money(today);$('month').textContent=money(monthly);$('all').textContent=money(all);render()}catch(e){$('list').innerHTML=`<div class="empty">تعذر تحميل الأرباح: ${esc(e.message)}</div>`}}$('period').onchange=render;load()})()</script></body></html>
