<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها | أرباح الكابتن</title><link rel="stylesheet" href="assets/style.css?v=2026.09.01"><link rel="stylesheet" href="assets/mobile.css?v=2026.09.01"></head><body><main class="shell" style="padding:20px 0 50px"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><span class="badge">الكابتن</span><h1>الأرباح</h1><p class="muted">ملخص أرباح الرحلات المكتملة.</p></div><a class="btn light" href="captain.html" style="text-decoration:none">لوحة الكابتن</a></div></div><div class="grid" style="margin-top:18px"><div class="col-4 card"><small class="muted">اليوم</small><h2 id="today">0 د.ع</h2></div><div class="col-4 card"><small class="muted">هذا الشهر</small><h2 id="month">0 د.ع</h2></div><div class="col-4 card"><small class="muted">كل الرحلات</small><h2 id="all">0 د.ع</h2></div></div><section class="card" style="margin-top:18px"><span class="badge">آخر العمليات</span><div id="list" style="margin-top:12px"><div class="empty">جارٍ التحميل...</div></div></section></main><script src="assets/app.js?v=2026.09.01"></script><script>(async()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v||0).toLocaleString('ar-IQ')+' د.ع';if(!token){location.href='captain.html';return}try{const d=await api('/rides?status=trip_completed&limit=100');const x=d.data||d,items=x.items||[],now=new Date(),day=new Date(now);day.setHours(0,0,0,0);const month=new Date(now.getFullYear(),now.getMonth(),1);let all=0,today=0,monthly=0;items.forEach(r=>{const n=Number(r.finalFare??r.estimatedFare??r.fare??0),dt=new Date(r.completedAt||r.updatedAt||r.createdAt);all+=n;if(dt>=day)today+=n;if(dt>=month)monthly+=n});$('today').textContent=money(today);$('month').textContent=money(monthly);$('all').textContent=money(all);$('list').innerHTML=items.length?items.slice(0,30).map(r=>{const n=Number(r.finalFare??r.estimatedFare??r.fare??0);return `<article class="status" style="margin:10px 0"><div style="display:flex;justify-content:space-between;gap:10px"><b>رحلة مكتملة</b><strong>${money(n)}</strong></div><div class="muted">${esc(r.pickup?.address||'الانطلاق')} ← ${esc(r.dropoff?.address||'الوجهة')}</div><small class="muted">${new Date(r.completedAt||r.updatedAt||r.createdAt).toLocaleString('ar-IQ')}</small></article>`}).join(''):'<div class="empty">لا توجد أرباح مسجلة بعد.</div>'}catch(e){$('list').innerHTML='<div class="empty">تعذر تحميل الأرباح: '+esc(e.message)+'</div>'}})()</script></body></html>
