<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><meta name="description" content="وصلها — منصة النقل والتوصيل"><title>وصلها — تسجيل الدخول</title><link rel="stylesheet" href="assets/style.css"></head><body><main class="shell"><section id="gate" class="grid" style="min-height:100vh;align-items:center;padding:25px 0"><div class="col-7"><span class="badge">وصلها</span><h1 class="hero" style="font-size:clamp(42px,7vw,76px);line-height:1.08;margin:16px 0">النقل والتوصيل<br><span class="accent">بشكل أبسط.</span></h1><p class="muted" style="font-size:18px;line-height:2;max-width:650px">سجّل دخولك أولاً، وبعدها تنتقل مباشرة إلى التطبيق. لا نعرض رحلات أو كباتن أو تقييمات وهمية.</p></div><div class="col-5"><div class="card"><span class="badge">تسجيل الدخول</span><h2 style="margin-top:12px">أهلاً بك في وصلها 👋</h2><p class="muted">استخدم حسابك للمتابعة.</p><form id="loginForm" class="form" style="margin-top:20px"><div class="field"><label>رقم الهاتف</label><input id="phone" inputmode="tel" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn">دخول</button></form><p class="muted" style="font-size:12px;margin:18px 0 0;text-align:center">تسجيل الحسابات يتم من خلال النظام الموثّق.</p></div></div></section></main><script src="assets/app.js"></script><script>(async()=>{if(token){const u=user();if(u?.role==='customer')return location.replace('customer.html');if(u?.role==='captain')return location.replace('captain.html');if(u?.role==='admin')return location.replace('admin.html')}$('loginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;try{setBusy(b,true,'جارٍ تسجيل الدخول...');const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value.trim(),password:$('password').value})});saveAuth(d.data);const r=d.data?.user?.role;if(r==='customer')location.replace('customer.html');else if(r==='captain')location.replace('captain.html');else if(r==='admin')location.replace('admin.html');else throw Error('نوع الحساب غير معروف')}catch(e){toast(e.message)}finally{setBusy(b,false)}}})()</script></body></html>
