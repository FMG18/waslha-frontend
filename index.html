<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f9f6e"><title>وصلها — أهلاً بك</title>
<link rel="stylesheet" href="assets/login3.css?v=2026.09.03">
</head>
<body>
<main class="login-shell">
<section class="login-copy">
<a class="login-brand" href="index.html"><span class="login-mark">و</span><span>وصلها</span></a>
<h1>مشوارك<br><span>أسهل وأسرع.</span></h1>
<p>منصة سورية للتنقّل والتوصيل. اطلب مشوارك، اختر دراجة أو أرسل طلبك، وتابع الرحلة خطوة بخطوة.</p>
<div class="feature-row"><span class="feature">🚕 مشاوير</span><span class="feature">🏍️ دراجات</span><span class="feature">📦 توصيل</span><span class="feature">📍 خرائط ذكية</span></div>
</section>
<section class="login-card">
<span class="eyebrow">حساب وصلها</span><h2>أهلاً بك 👋</h2><p>سجّل الدخول حتى تبدأ مشوارك.</p>
<form id="loginForm">
<div class="field"><label for="phone">رقم الهاتف</label><input id="phone" inputmode="tel" autocomplete="username" placeholder="07xxxxxxxxx" required></div>
<div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required></div>
<button id="loginBtn" class="login-btn" type="submit">دخول إلى وصلها</button>
</form>
<a href="captain-register.html" class="captain-link">🚕 أريد العمل ككابتن</a>
<div id="loginStatus" class="status"></div>
<div class="login-note">وصلها — تنقّل وتوصيل داخل سوريا</div>
</section>
</main>
<script src="assets/app.js?v=2026.09.03"></script>
<script>
(async()=>{const $=id=>document.getElementById(id);if(token){const u=user();if(u?.role==='customer')return location.replace('home.html');if(u?.role==='captain')return location.replace('captain.html');if(u?.role==='admin')return location.replace('admin.html')}$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('loginBtn'),s=$('loginStatus');try{setBusy(b,true,'جارٍ تسجيل الدخول...');s.textContent='';const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$('phone').value.trim(),password:$('password').value})});const saved=saveAuth(d.data||d),r=saved?.user?.role;if(r==='customer')location.replace('home.html');else if(r==='captain')location.replace('captain.html');else if(r==='admin')location.replace('admin.html');else throw Error('نوع الحساب غير معروف')}catch(e){s.textContent=e.message||'تعذر تسجيل الدخول'}finally{setBusy(b,false)}})})()
</script>
</body></html>
