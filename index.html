<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f9f6e"><title>وصلها — تسجيل الدخول</title><link rel="stylesheet" href="assets/style.css?v=2026.09.01"></head><body><main class="shell"><section class="grid" style="min-height:100vh;align-items:center;padding:24px 0"><div class="col-7"><span class="badge">وصلها</span><h1 class="hero" style="font-size:clamp(42px,7vw,76px);line-height:1.08;margin:16px 0">مشوارك<br><span class="accent">أسهل وأسرع.</span></h1><p class="muted" style="font-size:18px;line-height:2;max-width:650px">منصة نقل وتوصيل مصممة للمدن العربية: اختر موقعك، حدد وجهتك، وشاهد الطريق والوقت والتكلفة قبل الطلب.</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px"><span class="badge">خرائط وتوجيه</span><span class="badge">طلب رحلة</span><span class="badge">توصيل</span></div></div><div class="col-5"><div class="card"><span class="badge">تسجيل الدخول</span><h2 style="margin:12px 0 5px">أهلاً بك في وصلها</h2><p class="muted" style="margin-top:0">سجّل دخولك للوصول إلى حسابك وطلب رحلتك.</p><form id="loginForm" class="form" style="margin-top:20px"><div class="field"><label for="phone">رقم الهاتف</label><input id="phone" inputmode="tel" autocomplete="username" placeholder="07xxxxxxxxx" required></div><div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required></div><button id="loginBtn" class="btn" type="submit">دخول</button></form><div id="loginStatus" class="muted" style="font-size:12px;text-align:center;margin-top:14px;min-height:20px"></div></div></div></section></main><script src="assets/app.js?v=2026.09.01"></script><script>(async()=>{const $=id=>document.getElementById(id);if(typeof token!=='undefined'&&token){const u=typeof user==='function'?user():null;if(u?.role==='customer')return location.replace('customer.html');if(u?.role==='captain')return location.replace('captain.html');if(u?.role==='admin')return location.replace('admin.html')}$("loginForm").addEventListener('submit',async e=>{e.preventDefault();const b=$("loginBtn"),s=$("loginStatus");try{setBusy(b,true,'جارٍ تسجيل الدخول...');s.textContent='';const d=await api('/auth/login',{method:'POST',body:JSON.stringify({phone:$("phone").value.trim(),password:$("password").value})});const saved=saveAuth(d.data||d);const r=saved?.user?.role;if(r==='customer')location.replace('customer.html');else if(r==='captain')location.replace('captain.html');else if(r==='admin')location.replace('admin.html');else throw Error('نوع الحساب غير معروف')}catch(e){s.textContent=e.message||'تعذر تسجيل الدخول';}finally{setBusy(b,false)}})})()</script></body></html>
